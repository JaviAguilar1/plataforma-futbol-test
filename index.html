<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Seguimiento de Club</title>
<style>
  :root{
    --fondo:#0b0f17;
    --superficie:#121826;
    --primario:#d4af37;
    --texto:#eef1f6;
    --borde:#273047;
    --rojo:#e5484d;
    --verde:#3ddc84;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;background:var(--superficie);
    border-bottom:2px solid var(--primario);
  }
  header img{height:40px;}
  header h1{font-size:1.2rem;margin:0;flex:1;}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--superficie);}
  nav button{
    background:none;border:1px solid var(--borde);color:var(--texto);
    padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;
  }
  nav button.activo{background:var(--primario);color:#1a1a1a;border-color:var(--primario);font-weight:600;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  select,input,textarea{
    background:var(--fondo);color:var(--texto);border:1px solid var(--borde);
    border-radius:4px;padding:6px 8px;font-size:.9rem;
  }
  button.accion{
    background:var(--primario);color:#1a1a1a;border:none;border-radius:4px;
    padding:7px 14px;cursor:pointer;font-weight:600;
  }
  button.secundario{
    background:none;border:1px solid var(--borde);color:var(--texto);
    border-radius:4px;padding:7px 12px;cursor:pointer;
  }
  button.peligro{background:var(--rojo);color:#fff;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.88rem;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--borde);text-align:left;}
  th{color:var(--primario);}
  .card{background:var(--superficie);border:1px solid var(--borde);border-radius:8px;padding:16px;margin-bottom:18px;}
  .fila-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;}
  .fila-form > *{flex:1;min-width:110px;}
  .oculto{display:none !important;}
  .aviso{background:#2a2110;border:1px solid var(--primario);border-radius:6px;padding:12px;margin-bottom:14px;font-size:.9rem;}
  .login-box{max-width:340px;margin:60px auto;text-align:center;}
  .login-box input{width:100%;margin-bottom:10px;}
  .tag-rol{font-size:.75rem;background:var(--primario);color:#1a1a1a;padding:2px 8px;border-radius:10px;}
  footer{text-align:center;color:#687089;font-size:.78rem;padding:30px 10px;}
  textarea{width:100%;resize:vertical;}
  .subtitulo{color:var(--primario);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
  .subtitulo:first-child{margin-top:0;}
  .panel-anidado{background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:14px;margin:0;}
  .panel-anidado .fila-form label{flex:none;width:150px;color:#9aa4bd;font-size:.85rem;}
</style>
</head>
<body>

<header>
  <img id="escudo" class="oculto">
  <h1 id="nombreClub">Cargando...</h1>
  <span id="estadoSesion"></span>
</header>

<nav id="nav">
  <button data-vista="plantel" class="activo">Plantel</button>
  <button data-vista="partidos">Partidos</button>
  <button data-vista="tabla">Tabla de posiciones</button>
</nav>

<main>
  <div id="avisoConfig" class="aviso oculto"></div>

  <div class="fila-form oculto" id="selectorCategoriaWrap">
    <label style="flex:none;">Categoría</label>
    <select id="selectorCategoria"></select>
  </div>

  <section id="vistaPlantel"></section>
  <section id="vistaPartidos" class="oculto"></section>
  <section id="vistaTabla" class="oculto"></section>

  <div id="vistaLogin" class="login-box oculto">
    <h2>Ingresar</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Contraseña">
    <button class="accion" onclick="hacerLogin()">Ingresar</button>
    <p id="loginError" style="color:var(--rojo);font-size:.85rem;"></p>
  </div>
</main>

<footer>Plantilla genérica de seguimiento de club — instancia propia, sin datos compartidos con otros clubes.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config/firebase.js" onerror="window.FIREBASE_CONFIG_FALTA=true"></script>
<script>
let CLUB = null;
let db = null;
let auth = null;
let usuario = null;
let rolActual = null;
let categoriaActual = null;
let vistaActual = 'plantel';

let fichaAbierta = {};              // categoriaId -> jugadorId con la ficha completa abierta
let detalleAbiertoFecha = {};       // categoriaId -> fecha con el detalle del partido abierto
let convocatoriaAbiertaFecha = {};  // categoriaId -> fecha con la convocatoria abierta
const MOTIVOS_CAMBIO = ['', 'Táctico', 'Lesión', 'Fatiga', 'Disciplina'];

function suscribirRefs(listaRefs, pares){
  listaRefs.forEach(r=>r.ref.off('value', r.cb));
  listaRefs.length = 0;
  pares.forEach(([ruta, onDato])=>{
    const ref = db.ref(ruta);
    const cb = snap => onDato(snap.val() || {});
    ref.on('value', cb);
    listaRefs.push({ref, cb});
  });
}

async function cargarConfigClub(){
  try{
    const r = await fetch('config/club.json', {cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){}
  const rEj = await fetch('config/club.example.json', {cache:'no-store'});
  return await rEj.json();
}

function aplicarTema(club){
  const c = club.club.colores || {};
  const root = document.documentElement.style;
  if(c.fondo) root.setProperty('--fondo', c.fondo);
  if(c.superficie) root.setProperty('--superficie', c.superficie);
  if(c.primario) root.setProperty('--primario', c.primario);
  if(c.texto) root.setProperty('--texto', c.texto);
  document.getElementById('pageTitle').textContent = club.club.nombre;
  document.getElementById('nombreClub').textContent = club.club.nombre;
  if(club.club.escudoUrl){
    const img = document.getElementById('escudo');
    img.src = club.club.escudoUrl;
    img.classList.remove('oculto');
  }
}

function poblarSelectorCategoria(){
  const sel = document.getElementById('selectorCategoria');
  sel.innerHTML = '';
  CLUB.temporada.categorias.forEach(cat=>{
    const op = document.createElement('option');
    op.value = cat.id; op.textContent = cat.nombre;
    sel.appendChild(op);
  });
  categoriaActual = CLUB.temporada.categorias[0]?.id || null;
  sel.value = categoriaActual;
  sel.onchange = ()=>{ categoriaActual = sel.value; renderVistaActual(); };
  document.getElementById('selectorCategoriaWrap').classList.remove('oculto');
}

function puedeEditar(){
  return !!rolActual && CLUB.roles.includes(rolActual);
}

function esAdmin(){
  return rolActual === CLUB.roles[0];
}

// ---------- Auth ----------
function hacerLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    document.getElementById('loginError').textContent = 'No se pudo ingresar: ' + err.message;
  });
}
function hacerLogout(){ auth.signOut(); }

function onAuthCambio(user){
  usuario = user;
  if(!user){
    rolActual = null;
    actualizarEstadoSesion();
    renderVistaActual();
    return;
  }
  db.ref('users/'+user.uid+'/role').once('value').then(snap=>{
    rolActual = snap.val();
    actualizarEstadoSesion();
    renderVistaActual();
  });
}

function actualizarEstadoSesion(){
  const el = document.getElementById('estadoSesion');
  if(usuario){
    el.innerHTML = (rolActual ? `<span class="tag-rol">${rolActual}</span> ` : '')
      + usuario.email + ' <button class="secundario" onclick="hacerLogout()">Salir</button>';
  } else {
    el.innerHTML = '<button class="secundario" onclick="mostrarLogin()">Ingresar</button>';
  }
}

function mostrarLogin(){
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('oculto'));
  document.getElementById('selectorCategoriaWrap').classList.add('oculto');
  document.getElementById('vistaLogin').classList.remove('oculto');
}

// ---------- Navegación ----------
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-vista]');
  if(!btn) return;
  vistaActual = btn.dataset.vista;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('activo', b===btn));
  document.getElementById('vistaLogin').classList.add('oculto');
  document.getElementById('selectorCategoriaWrap').classList.remove('oculto');
  renderVistaActual();
});

function renderVistaActual(){
  document.getElementById('vistaPlantel').classList.add('oculto');
  document.getElementById('vistaPartidos').classList.add('oculto');
  document.getElementById('vistaTabla').classList.add('oculto');
  if(vistaActual==='plantel') renderPlantel();
  if(vistaActual==='partidos') renderPartidos();
  if(vistaActual==='tabla') renderTabla();
}

// ---------- Plantel ----------
let _refsPlantel = [];
function renderPlantel(){
  const sec = document.getElementById('vistaPlantel');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let plantelDatos = {}, lesionesDatos = {}, contratosDatos = {};
  const rerender = ()=>{
    sec.innerHTML = plantelHTML(plantelDatos)
      + lesionesHTML(plantelDatos, lesionesDatos)
      + contratosHTML(plantelDatos, contratosDatos);
  };
  suscribirRefs(_refsPlantel, [
    ['plantel/'+cat, v=>{ plantelDatos=v; rerender(); }],
    ['lesiones/'+cat, v=>{ lesionesDatos=v; rerender(); }],
    ['contratos/'+cat, v=>{ contratosDatos=v; rerender(); }],
  ]);
}

function plantelHTML(datos){
  const opcionesPos = CLUB.posiciones.map(p=>`<option value="${p.codigo}">${p.nombre}</option>`).join('');
  const idAbierto = fichaAbierta[categoriaActual];
  const filas = Object.entries(datos).map(([id,j])=>{
    const abierta = id === idAbierto;
    const filaExtra = abierta ? `<tr><td colspan="7">${fichaExtraHTML(id, j)}</td></tr>` : '';
    return `
    <tr>
      <td>${j.apellido||''}, ${j.nombre||''}</td>
      <td>${nombrePosicion(j.posicion)}</td>
      <td>${j.fechaNacimiento||''}</td>
      <td>${j.pieHabil||''}</td>
      <td>${j.altura||''}</td>
      <td>${j.peso||''}</td>
      <td>
        <button class="secundario" onclick="toggleFicha('${id}')">${abierta?'Cerrar ficha':'Ver ficha'}</button>
        ${puedeEditar()?`<button class="peligro" onclick="borrarJugador('${id}')">Borrar</button>`:''}
      </td>
    </tr>${filaExtra}`;
  }).join('');
  return `
  <div class="card">
    <h2>Plantel</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="pNombre" placeholder="Nombre">
      <input id="pApellido" placeholder="Apellido">
      <select id="pPosicion">${opcionesPos}</select>
      <input id="pFechaNac" type="date">
      <select id="pPieHabil"><option value="Derecho">Derecho</option><option value="Izquierdo">Izquierdo</option><option value="Ambos">Ambos</option></select>
      <input id="pAltura" type="number" placeholder="Altura (cm)">
      <input id="pPeso" type="number" placeholder="Peso (kg)">
      <button class="accion" onclick="agregarJugador()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Jugador</th><th>Posición</th><th>Nacimiento</th><th>Pie</th><th>Altura</th><th>Peso</th><th></th></tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin jugadores cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function fichaExtraHTML(id, j){
  const dis = puedeEditar() ? '' : 'disabled';
  const c = j.contacto || {}, rep = j.representante || {}, padre = j.padre || {}, madre = j.madre || {};
  const opcionesPosSec = CLUB.posiciones.map(p=>
    `<option value="${p.codigo}" ${j.posicionSecundaria===p.codigo?'selected':''}>${p.nombre}</option>`).join('');
  const opcionPasaporte = v => `<option value="${v}" ${j.pasaporteComunitario===v?'selected':''}>${v||'—'}</option>`;
  return `
  <div class="panel-anidado">
    <div style="display:flex;gap:28px;flex-wrap:wrap;">
      <div style="flex:1;min-width:280px;">
        <div class="subtitulo">Datos generales</div>
        <div class="fila-form"><label>DNI</label><input id="fx_dni_${id}" value="${j.dni||''}" ${dis}></div>
        <div class="fila-form"><label>Posición secundaria</label><select id="fx_posSec_${id}" ${dis}><option value="">—</option>${opcionesPosSec}</select></div>
        <div class="fila-form"><label>Nacionalidad</label><input id="fx_nac_${id}" value="${j.nacionalidad||''}" ${dis}></div>
        <div class="fila-form"><label>Pasaporte comunitario</label><select id="fx_pasaporte_${id}" ${dis}>${opcionPasaporte('')}${opcionPasaporte('No')}${opcionPasaporte('Si')}${opcionPasaporte('En Trámite')}</select></div>
        <div class="fila-form"><label>Obra social</label><input id="fx_obraSocial_${id}" value="${j.obraSocial||''}" ${dis}></div>
        <div class="fila-form"><label>Nro. afiliado</label><input id="fx_nroAfiliado_${id}" value="${j.nroAfiliado||''}" ${dis}></div>
        <div class="fila-form"><label>Foto (URL)</label><input id="fx_foto_${id}" value="${j.foto||''}" ${dis}></div>
        <div class="fila-form"><label>Video promocional</label><input id="fx_video_${id}" value="${j.videoPromocional||''}" ${dis}></div>
        <div class="fila-form"><label>Observaciones</label><textarea id="fx_obs_${id}" rows="2" ${dis}>${j.observaciones||''}</textarea></div>
      </div>
      <div style="flex:1;min-width:280px;">
        <div class="subtitulo">Contacto del jugador</div>
        <div class="fila-form"><label>Email</label><input id="fx_email_${id}" value="${c.email||''}" ${dis}></div>
        <div class="fila-form"><label>Teléfono</label><input id="fx_tel_${id}" value="${c.telefono||''}" ${dis}></div>
        <div class="fila-form"><label>Domicilio</label><input id="fx_domicilio_${id}" value="${c.domicilio||''}" ${dis}></div>
        <div class="subtitulo">Representante</div>
        <div class="fila-form"><label>Email</label><input id="fx_repEmail_${id}" value="${rep.email||''}" ${dis}></div>
        <div class="fila-form"><label>Teléfono</label><input id="fx_repTel_${id}" value="${rep.telefono||''}" ${dis}></div>
        <div class="subtitulo">Padre</div>
        <div class="fila-form"><label>Email</label><input id="fx_padreEmail_${id}" value="${padre.email||''}" ${dis}></div>
        <div class="fila-form"><label>Teléfono</label><input id="fx_padreTel_${id}" value="${padre.telefono||''}" ${dis}></div>
        <div class="subtitulo">Madre</div>
        <div class="fila-form"><label>Email</label><input id="fx_madreEmail_${id}" value="${madre.email||''}" ${dis}></div>
        <div class="fila-form"><label>Teléfono</label><input id="fx_madreTel_${id}" value="${madre.telefono||''}" ${dis}></div>
      </div>
    </div>
    ${puedeEditar()?`<button class="accion" onclick="guardarFicha('${id}')" style="margin-top:10px;">Guardar ficha</button>`:''}
  </div>`;
}

function guardarFicha(id){
  const v = suf => document.getElementById('fx_'+suf+'_'+id).value.trim();
  db.ref('plantel/'+categoriaActual+'/'+id).update({
    dni: v('dni'),
    posicionSecundaria: v('posSec'),
    nacionalidad: v('nac'),
    pasaporteComunitario: v('pasaporte'),
    obraSocial: v('obraSocial'),
    nroAfiliado: v('nroAfiliado'),
    foto: v('foto'),
    videoPromocional: v('video'),
    observaciones: v('obs'),
    contacto: { email: v('email'), telefono: v('tel'), domicilio: v('domicilio') },
    representante: { email: v('repEmail'), telefono: v('repTel') },
    padre: { email: v('padreEmail'), telefono: v('padreTel') },
    madre: { email: v('madreEmail'), telefono: v('madreTel') },
  });
}

function toggleFicha(id){
  fichaAbierta[categoriaActual] = (fichaAbierta[categoriaActual] === id) ? null : id;
  renderVistaActual();
}

function nombrePosicion(codigo){
  const p = CLUB.posiciones.find(x=>x.codigo===codigo);
  return p ? p.nombre : (codigo || '');
}

function agregarJugador(){
  const j = {
    nombre: document.getElementById('pNombre').value.trim(),
    apellido: document.getElementById('pApellido').value.trim(),
    posicion: document.getElementById('pPosicion').value,
    fechaNacimiento: document.getElementById('pFechaNac').value,
    pieHabil: document.getElementById('pPieHabil').value,
    altura: document.getElementById('pAltura').value,
    peso: document.getElementById('pPeso').value
  };
  if(!j.nombre || !j.apellido) return;
  db.ref('plantel/'+categoriaActual).push(j);
}

function borrarJugador(id){
  if(!confirm('¿Borrar jugador?')) return;
  db.ref('plantel/'+categoriaActual+'/'+id).remove();
}

// ---------- Lesiones ----------
function lesionesHTML(plantel, lesiones){
  const jugadoresIds = Object.keys(plantel);
  const nombreJugador = jid => plantel[jid] ? `${plantel[jid].apellido}, ${plantel[jid].nombre}` : '(jugador no encontrado)';
  const opcionesJugador = jugadoresIds.map(id=>`<option value="${id}">${nombreJugador(id)}</option>`).join('');
  const filas = Object.entries(lesiones).map(([id,l])=>`
    <tr>
      <td>${nombreJugador(l.jugadorId)}</td>
      <td>${l.fechaInicio||''}</td>
      <td>${l.observaciones||''}</td>
      <td>${l.fechaEstimadaRecuperacion||''}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarLesion('${id}')">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>🤕 Lesiones</h2>
    ${puedeEditar() && jugadoresIds.length ? `
    <div class="fila-form">
      <select id="lJugador">${opcionesJugador}</select>
      <input id="lFechaInicio" type="date" title="Desde">
      <input id="lObs" placeholder="Observaciones">
      <input id="lFechaRecup" type="date" title="Fecha estimada de recuperación">
      <button class="accion" onclick="agregarLesion()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Jugador</th><th>Desde</th><th>Observaciones</th><th>F. estimada recup.</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="5">Sin lesiones cargadas.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarLesion(){
  const l = {
    jugadorId: document.getElementById('lJugador').value,
    fechaInicio: document.getElementById('lFechaInicio').value,
    observaciones: document.getElementById('lObs').value.trim(),
    fechaEstimadaRecuperacion: document.getElementById('lFechaRecup').value
  };
  if(!l.jugadorId) return;
  db.ref('lesiones/'+categoriaActual).push(l);
}

function borrarLesion(id){
  if(!confirm('¿Borrar lesión?')) return;
  db.ref('lesiones/'+categoriaActual+'/'+id).remove();
}

// ---------- Contratos ----------
function contratosHTML(plantel, contratos){
  const jugadoresIds = Object.keys(plantel);
  const nombreJugador = jid => plantel[jid] ? `${plantel[jid].apellido}, ${plantel[jid].nombre}` : '(jugador no encontrado)';
  const opcionesJugador = jugadoresIds.map(id=>`<option value="${id}">${nombreJugador(id)}</option>`).join('');
  const hoy = new Date();
  const filas = Object.entries(contratos).map(([id,c])=>{
    let meses = '';
    if(c.fechaFin){
      const fin = new Date(c.fechaFin+'T00:00:00');
      meses = Math.max(0, Math.round((fin-hoy)/(1000*60*60*24*30)));
    }
    return `
    <tr>
      <td>${nombreJugador(c.jugadorId)}</td>
      <td>${c.fechaFin||''}</td>
      <td>${meses}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarContrato('${id}')">Borrar</button></td>`:''}
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <h2>📄 Contratos</h2>
    ${puedeEditar() && jugadoresIds.length ? `
    <div class="fila-form">
      <select id="cJugador">${opcionesJugador}</select>
      <input id="cFechaFin" type="date" title="Fecha de fin de contrato">
      <button class="accion" onclick="agregarContrato()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Jugador</th><th>Fecha fin</th><th>Meses restantes</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="4">Sin contratos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarContrato(){
  const c = { jugadorId: document.getElementById('cJugador').value, fechaFin: document.getElementById('cFechaFin').value };
  if(!c.jugadorId || !c.fechaFin) return;
  db.ref('contratos/'+categoriaActual).push(c);
}

function borrarContrato(id){
  if(!confirm('¿Borrar contrato?')) return;
  db.ref('contratos/'+categoriaActual+'/'+id).remove();
}

// ---------- Partidos / Resultados ----------
let _refsPartidos = [];
function renderPartidos(){
  const sec = document.getElementById('vistaPartidos');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let partidosDatos = {}, plantelDatos = {}, convocatoriaDatos = {};
  const rerender = ()=>{ sec.innerHTML = partidosHTML(cat, partidosDatos, plantelDatos, convocatoriaDatos); };
  const pares = [
    ['partidos/'+cat, v=>{ partidosDatos=v; rerender(); }],
    ['plantel/'+cat, v=>{ plantelDatos=v; rerender(); }],
  ];
  const fechaConv = convocatoriaAbiertaFecha[cat];
  if(fechaConv) pares.push(['convocatorias/'+cat+'/'+fechaConv, v=>{ convocatoriaDatos=v; rerender(); }]);
  suscribirRefs(_refsPartidos, pares);
}

function partidosHTML(cat, datos, plantel, convocatoria){
  const filas = Object.entries(datos)
    .sort((a,b)=> (+a[0]) - (+b[0]))
    .map(([fecha,p])=>{
      const detalleAbierta = detalleAbiertoFecha[cat] === fecha;
      const convocatoriaAbierta = convocatoriaAbiertaFecha[cat] === fecha;
      let extra = '';
      if(detalleAbierta) extra += `<tr><td colspan="7">${partidoDetalleHTML(fecha,p)}</td></tr>`;
      if(convocatoriaAbierta) extra += `<tr><td colspan="7">${convocatoriaHTML(cat, fecha, plantel, convocatoria)}</td></tr>`;
      return `
      <tr>
        <td>${fecha}</td>
        <td>${p.rival||''}</td>
        <td>${p.localia||''}</td>
        <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''}</td>
        <td>${p.resultado||''}</td>
        <td>${p.competencia||''}</td>
        <td>
          <button class="secundario" onclick="toggleDetallePartido('${fecha}')">${detalleAbierta?'Cerrar':'Detalle'}</button>
          <button class="secundario" onclick="toggleConvocatoria('${fecha}')">${convocatoriaAbierta?'Cerrar':'Convocatoria'}</button>
          ${puedeEditar()?`<button class="peligro" onclick="borrarPartido('${fecha}')">Borrar</button>`:''}
        </td>
      </tr>${extra}`;
    }).join('');
  return `
  <div class="card">
    <h2>Partidos</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="mFecha" type="number" placeholder="Fecha Nro">
      <input id="mRival" placeholder="Rival">
      <select id="mLocalia"><option value="Local">Local</option><option value="Visitante">Visitante</option></select>
      <input id="mGF" type="number" placeholder="Goles a favor">
      <input id="mGC" type="number" placeholder="Goles en contra">
      <select id="mResultado"><option>Victoria</option><option>Empate</option><option>Derrota</option><option>No Disputado</option></select>
      <button class="accion" onclick="agregarPartido()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Fecha</th><th>Rival</th><th>Condición</th><th>Goles</th><th>Resultado</th><th>Competencia</th><th></th></tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin partidos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarPartido(){
  const fecha = document.getElementById('mFecha').value;
  if(!fecha) return;
  const p = {
    rival: document.getElementById('mRival').value.trim(),
    localia: document.getElementById('mLocalia').value,
    golesFavor: Number(document.getElementById('mGF').value || 0),
    golesContra: Number(document.getElementById('mGC').value || 0),
    resultado: document.getElementById('mResultado').value
  };
  db.ref('partidos/'+categoriaActual+'/'+fecha).set(p);
}

function borrarPartido(fecha){
  if(!confirm('¿Borrar partido?')) return;
  db.ref('partidos/'+categoriaActual+'/'+fecha).remove();
}

function toggleDetallePartido(fecha){
  const cat = categoriaActual;
  detalleAbiertoFecha[cat] = (detalleAbiertoFecha[cat] === fecha) ? null : fecha;
  renderVistaActual();
}

function toggleConvocatoria(fecha){
  const cat = categoriaActual;
  convocatoriaAbiertaFecha[cat] = (convocatoriaAbiertaFecha[cat] === fecha) ? null : fecha;
  renderVistaActual();
}

const ETIQUETAS_LINK = {
  partido: 'Partido completo', resumen: 'Resumen', analisisPropio: 'Análisis propio',
  analisisRival: 'Análisis rival', informePdf: 'Informe PDF', pelotaParada: 'Pelota parada',
  gps: 'GPS', charlaDt: 'Charla DT', arenga: 'Arenga jugadores', citacion: 'Citación',
};

function partidoDetalleHTML(fecha, p){
  const dis = puedeEditar() ? '' : 'disabled';
  const links = p.links || {};
  const linksHtml = (CLUB.linksPartido || []).map(k=>`
    <div class="fila-form">
      <label>${ETIQUETAS_LINK[k] || k}</label>
      <input id="pd_link_${k}_${fecha}" value="${links[k]||''}" placeholder="URL" ${dis}>
      ${links[k] ? `<a href="${links[k]}" target="_blank" class="secundario" style="flex:none;text-decoration:none;padding:6px 10px;">Abrir</a>` : ''}
    </div>`).join('');
  return `
  <div class="panel-anidado">
    <div style="display:flex;gap:28px;flex-wrap:wrap;">
      <div style="flex:1;min-width:280px;">
        <div class="subtitulo">Datos del partido</div>
        <div class="fila-form"><label>Competencia</label><input id="pd_competencia_${fecha}" value="${p.competencia||''}" ${dis}></div>
        <div class="fila-form"><label>Sistema táctico</label><input id="pd_sistema_${fecha}" value="${p.sistemaTactico||''}" placeholder="ej. 1-4-3-3" ${dis}></div>
        <div class="fila-form"><label>Penales a favor</label><input type="number" id="pd_penF_${fecha}" value="${p.penalesFavor ?? ''}" ${dis}></div>
        <div class="fila-form"><label>Penales en contra</label><input type="number" id="pd_penC_${fecha}" value="${p.penalesContra ?? ''}" ${dis}></div>
        <div class="fila-form"><label>Plan con tenencia</label><textarea id="pd_planCon_${fecha}" rows="2" ${dis}>${p.planConTenencia||''}</textarea></div>
        <div class="fila-form"><label>Plan sin tenencia</label><textarea id="pd_planSin_${fecha}" rows="2" ${dis}>${p.planSinTenencia||''}</textarea></div>
        <div class="fila-form"><label>Descripción</label><textarea id="pd_desc_${fecha}" rows="2" ${dis}>${p.descripcion||''}</textarea></div>
      </div>
      <div style="flex:1;min-width:280px;">
        <div class="subtitulo">Links</div>
        ${linksHtml || '<p style="color:#9aa4bd;font-size:.85rem;">No hay tipos de link configurados (linksPartido en club.json).</p>'}
      </div>
    </div>
    ${puedeEditar()?`<button class="accion" onclick="guardarDetallePartido('${fecha}')" style="margin-top:10px;">Guardar detalle</button>`:''}
  </div>`;
}

function guardarDetallePartido(fecha){
  const v = id => document.getElementById(id).value.trim();
  const links = {};
  (CLUB.linksPartido || []).forEach(k=>{
    const val = v('pd_link_'+k+'_'+fecha);
    if(val) links[k] = val;
  });
  const penF = document.getElementById('pd_penF_'+fecha).value;
  const penC = document.getElementById('pd_penC_'+fecha).value;
  db.ref('partidos/'+categoriaActual+'/'+fecha).update({
    competencia: v('pd_competencia_'+fecha),
    sistemaTactico: v('pd_sistema_'+fecha),
    penalesFavor: penF === '' ? null : Number(penF),
    penalesContra: penC === '' ? null : Number(penC),
    planConTenencia: v('pd_planCon_'+fecha),
    planSinTenencia: v('pd_planSin_'+fecha),
    descripcion: v('pd_desc_'+fecha),
    links,
  });
}

// ---------- Convocatoria por partido ----------
function convocatoriaHTML(cat, fecha, plantel, convocatoria){
  const jugadoresIds = Object.keys(plantel);
  if(jugadoresIds.length === 0){
    return `<div class="panel-anidado"><p>Cargá el plantel de esta categoría antes de armar la convocatoria.</p></div>`;
  }
  const dis = puedeEditar() ? '' : 'disabled';
  const opcionesSustituto = jugadoresIds.map(id=>`<option value="${id}">${plantel[id].apellido}, ${plantel[id].nombre}</option>`).join('');
  const filas = jugadoresIds
    .sort((a,b)=> (plantel[a].apellido||'').localeCompare(plantel[b].apellido||''))
    .map(id=>{
      const c = convocatoria[id] || {};
      return `
      <tr>
        <td>${plantel[id].apellido}, ${plantel[id].nombre}</td>
        <td><input type="checkbox" id="cv_titular_${id}" ${c.titular?'checked':''} ${dis}></td>
        <td><input type="number" id="cv_dorsal_${id}" value="${c.dorsal ?? ''}" style="width:60px;" ${dis}></td>
        <td><input type="number" id="cv_minutos_${id}" value="${c.minutos ?? ''}" style="width:70px;" ${dis}></td>
        <td><input type="number" id="cv_goles_${id}" value="${c.goles ?? ''}" style="width:60px;" ${dis}></td>
        <td><input type="checkbox" id="cv_amarilla_${id}" ${c.amarilla?'checked':''} ${dis}></td>
        <td><input type="checkbox" id="cv_roja_${id}" ${c.roja?'checked':''} ${dis}></td>
        <td><select id="cv_sustituidoPor_${id}" ${dis}><option value="">—</option>${opcionesSustituto}</select></td>
        <td><select id="cv_motivo_${id}" ${dis}>${MOTIVOS_CAMBIO.map(m=>`<option ${c.motivoCambio===m?'selected':''}>${m||'—'}</option>`).join('')}</select></td>
        <td><input type="checkbox" id="cv_destacado_${id}" ${c.destacado?'checked':''} ${dis}></td>
      </tr>`;
    }).join('');
  return `
  <div class="panel-anidado">
    <div class="subtitulo">Convocatoria — Fecha ${fecha}</div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Jugador</th><th>Titular</th><th>Dorsal</th><th>Min.</th><th>Goles</th><th>TA</th><th>TR</th><th>Sustituido por</th><th>Motivo cambio</th><th>★</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    </div>
    ${puedeEditar()?`<button class="accion" onclick="guardarConvocatoria('${cat}','${fecha}')" style="margin-top:10px;">Guardar convocatoria</button>`:''}
  </div>`;
}

function guardarConvocatoria(cat, fecha){
  db.ref('plantel/'+cat).once('value').then(snap=>{
    const plantel = snap.val() || {};
    const out = {};
    Object.keys(plantel).forEach(id=>{
      out[id] = {
        titular: document.getElementById('cv_titular_'+id).checked,
        dorsal: Number(document.getElementById('cv_dorsal_'+id).value || 0) || null,
        minutos: Number(document.getElementById('cv_minutos_'+id).value || 0) || null,
        goles: Number(document.getElementById('cv_goles_'+id).value || 0) || 0,
        amarilla: document.getElementById('cv_amarilla_'+id).checked,
        roja: document.getElementById('cv_roja_'+id).checked,
        sustituidoPor: document.getElementById('cv_sustituidoPor_'+id).value || null,
        motivoCambio: document.getElementById('cv_motivo_'+id).value || null,
        destacado: document.getElementById('cv_destacado_'+id).checked,
      };
    });
    db.ref('convocatorias/'+cat+'/'+fecha).set(out);
  });
}

// ---------- Tabla de posiciones (manual) ----------
let _refsTabla = [];
function renderTabla(){
  const sec = document.getElementById('vistaTabla');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const adapter = (CLUB.fuentes?.liga?.adapter) || 'manual';
  suscribirRefs(_refsTabla, [
    ['tablaPosiciones/'+categoriaActual, v=>{ sec.innerHTML = tablaHTML(Array.isArray(v)?v:Object.values(v), adapter); }],
  ]);
}

function tablaHTML(filas, adapter){
  const esManual = adapter === 'manual';
  const cuerpo = filas.map((f,i)=>`
    <tr>
      <td>${f.pos ?? i+1}</td>
      <td>${f.equipo||''}</td>
      <td>${f.pj ?? ''}</td>
      <td>${f.pg ?? ''}</td>
      <td>${f.pe ?? ''}</td>
      <td>${f.pp ?? ''}</td>
      <td>${f.gf ?? ''}</td>
      <td>${f.gc ?? ''}</td>
      <td>${f.pts ?? ''}</td>
      ${esManual && puedeEditar()?`<td><button class="peligro" onclick="borrarFilaTabla(${i})">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Tabla de posiciones</h2>
    ${esManual ? '' : `<p style="color:#9aa4bd;font-size:.85rem;">Esta tabla se actualiza sola desde la fuente de liga configurada (adaptador: <code>${adapter}</code>).</p>`}
    ${esManual && puedeEditar()?`
    <div class="fila-form">
      <input id="tEquipo" placeholder="Equipo">
      <input id="tPj" type="number" placeholder="PJ">
      <input id="tPg" type="number" placeholder="PG">
      <input id="tPe" type="number" placeholder="PE">
      <input id="tPp" type="number" placeholder="PP">
      <input id="tGf" type="number" placeholder="GF">
      <input id="tGc" type="number" placeholder="GC">
      <input id="tPts" type="number" placeholder="Pts">
      <button class="accion" onclick="agregarFilaTabla()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>Pts</th>${esManual && puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${cuerpo || '<tr><td colspan="10">Sin datos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarFilaTabla(){
  const fila = {
    equipo: document.getElementById('tEquipo').value.trim(),
    pj: Number(document.getElementById('tPj').value||0),
    pg: Number(document.getElementById('tPg').value||0),
    pe: Number(document.getElementById('tPe').value||0),
    pp: Number(document.getElementById('tPp').value||0),
    gf: Number(document.getElementById('tGf').value||0),
    gc: Number(document.getElementById('tGc').value||0),
    pts: Number(document.getElementById('tPts').value||0)
  };
  if(!fila.equipo) return;
  const ref = db.ref('tablaPosiciones/'+categoriaActual);
  ref.once('value').then(snap=>{
    const actual = snap.val() || [];
    actual.push(fila);
    ref.set(actual);
  });
}

function borrarFilaTabla(i){
  if(!confirm('¿Borrar fila?')) return;
  const ref = db.ref('tablaPosiciones/'+categoriaActual);
  ref.once('value').then(snap=>{
    const actual = snap.val() || [];
    actual.splice(i,1);
    ref.set(actual);
  });
}

// ---------- Arranque ----------
(async function init(){
  CLUB = await cargarConfigClub();
  aplicarTema(CLUB);
  poblarSelectorCategoria();

  if(window.FIREBASE_CONFIG_FALTA || !window.FIREBASE_CONFIG){
    document.getElementById('avisoConfig').textContent =
      'Falta config/firebase.js con las credenciales reales del club (ver config/README.md). Mostrando solo la config de ejemplo.';
    document.getElementById('avisoConfig').classList.remove('oculto');
    actualizarEstadoSesion();
    renderVistaActual();
    return;
  }

  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.database();
  auth = firebase.auth();
  auth.onAuthStateChanged(onAuthCambio);
  renderVistaActual();
})();
</script>
