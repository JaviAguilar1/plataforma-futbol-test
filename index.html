<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Seguimiento de Club</title>
<style>
  :root{
    --fondo:#0b0f17;
    --superficie:#121826;
    --primario:#d4af37;
    --texto:#eef1f6;
    --borde:#273047;
    --rojo:#e5484d;
    --verde:#3ddc84;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;background:var(--superficie);
    border-bottom:2px solid var(--primario);
  }
  header img{height:40px;}
  header h1{font-size:1.2rem;margin:0;flex:1;}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--superficie);}
  nav button{
    background:none;border:1px solid var(--borde);color:var(--texto);
    padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;
  }
  nav button.activo{background:var(--primario);color:#1a1a1a;border-color:var(--primario);font-weight:600;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  select,input,textarea{
    background:var(--fondo);color:var(--texto);border:1px solid var(--borde);
    border-radius:4px;padding:6px 8px;font-size:.9rem;
  }
  button.accion{
    background:var(--primario);color:#1a1a1a;border:none;border-radius:4px;
    padding:7px 14px;cursor:pointer;font-weight:600;
  }
  button.secundario{
    background:none;border:1px solid var(--borde);color:var(--texto);
    border-radius:4px;padding:7px 12px;cursor:pointer;
  }
  button.peligro{background:var(--rojo);color:#fff;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.88rem;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--borde);text-align:left;}
  th{color:var(--primario);}
  .card{background:var(--superficie);border:1px solid var(--borde);border-radius:8px;padding:16px;margin-bottom:18px;}
  .fila-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;}
  .fila-form > *{flex:1;min-width:110px;}
  .oculto{display:none !important;}
  .aviso{background:#2a2110;border:1px solid var(--primario);border-radius:6px;padding:12px;margin-bottom:14px;font-size:.9rem;}
  .login-box{max-width:340px;margin:60px auto;text-align:center;}
  .login-box input, .login-box select{width:100%;margin-bottom:10px;}
  .login-box p{font-size:.88rem;color:#9aa4bd;}
  button.link{background:none;border:none;color:var(--primario);cursor:pointer;text-decoration:underline;font-size:.85rem;padding:4px;}
  .tag-rol{font-size:.75rem;background:var(--primario);color:#1a1a1a;padding:2px 8px;border-radius:10px;}
  footer{text-align:center;color:#687089;font-size:.78rem;padding:30px 10px;}
  textarea{width:100%;resize:vertical;}
  .subtitulo{color:var(--primario);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
  .subtitulo:first-child{margin-top:0;}
  .panel-anidado{background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:14px;margin:0;}
  .panel-anidado .fila-form label{flex:none;width:150px;color:#9aa4bd;font-size:.85rem;}
  .card{overflow-x:auto;}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
  .kpi{flex:1;min-width:90px;background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:10px;text-align:center;font-size:.8rem;color:#9aa4bd;}
  .kpi b{display:block;font-size:1.5rem;color:var(--primario);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:18px;}
  .grid2 .card{margin-bottom:0;}
  .res{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-weight:700;font-size:.78rem;padding:1px 4px;color:#111;}
  .res-G{background:var(--verde);} .res-E{background:#c9b458;} .res-P{background:var(--rojo);color:#fff;}
  td.celda-G{color:var(--verde);} td.celda-E{color:#c9b458;} td.celda-P{color:var(--rojo);}
  .nota{color:#9aa4bd;font-size:.82rem;margin:0 0 6px;}
  .buscador{margin-left:auto;position:relative;min-width:220px;}
  .buscador input{width:100%;}
  #resultadosBusqueda{position:absolute;right:0;top:100%;margin-top:4px;z-index:20;background:var(--superficie);border:1px solid var(--borde);border-radius:6px;min-width:280px;max-height:340px;overflow:auto;}
  #resultadosBusqueda button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--borde);border-radius:0;color:var(--texto);padding:8px 10px;cursor:pointer;}
  #resultadosBusqueda button:hover{background:var(--fondo);}
  .estado{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.76rem;background:var(--borde);}
  .estado-titular{background:var(--verde);color:#111;} .estado-entro{background:var(--primario);color:#111;} .estado-no-citado{background:#5a2326;}
  td.mejor{color:var(--primario);font-weight:700;}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--rojo);color:#fff;padding:10px 16px;border-radius:6px;z-index:10;max-width:90vw;font-size:.9rem;}
  @media (max-width:600px){ main{padding:12px;} header{padding:10px 12px;} nav{padding:8px 12px;} }
</style>
</head>
<body>

<header>
  <img id="escudo" class="oculto">
  <h1 id="nombreClub">Cargando...</h1>
  <span id="estadoSesion"></span>
</header>

<nav id="nav" class="oculto">
  <button data-vista="inicio" class="activo">Inicio</button>
  <button data-vista="plantel">Plantel</button>
  <button data-vista="partidos">Partidos</button>
  <button data-vista="estadisticas">Estadísticas</button>
  <button data-vista="gps">GPS</button>
  <button data-vista="fixture">Fixture general</button>
  <button data-vista="tabla">Tabla de posiciones</button>
  <button data-vista="confiabilidad" id="navConfiabilidad" class="oculto">Confiabilidad</button>
  <button data-vista="recursos">Recursos</button>
  <button data-vista="reportes">Reportes</button>
  <button data-vista="usuarios" id="navUsuarios" class="oculto">Usuarios</button>
  <div class="buscador">
    <input id="buscadorJugador" placeholder="Buscar jugador..." autocomplete="off"
      onfocus="cargarIndiceJugadores()" oninput="buscarJugador(this.value)"
      onblur="setTimeout(()=>document.getElementById('resultadosBusqueda').classList.add('oculto'), 200)">
    <div id="resultadosBusqueda" class="oculto"></div>
  </div>
</nav>

<main>
  <div id="avisoConfig" class="aviso oculto"></div>

  <div class="fila-form oculto" id="selectorCategoriaWrap">
    <span id="wrapTemporada" style="display:contents;"><label style="flex:none;">Temporada</label><select id="selectorTemporada" style="flex:none;min-width:120px;"></select></span>
    <span id="wrapCategoria" style="display:contents;"><label style="flex:none;">Categoría</label><select id="selectorCategoria"></select></span>
  </div>
  <div id="avisoTemporada" class="aviso oculto"></div>

  <section id="vistaInicio" class="oculto"></section>
  <section id="vistaPlantel" class="oculto"></section>
  <section id="vistaPartidos" class="oculto"></section>
  <section id="vistaEstadisticas" class="oculto"></section>
  <section id="vistaGps" class="oculto"><div id="gpsImport"></div><div id="gpsDatos"></div></section>
  <section id="vistaFixture" class="oculto"></section>
  <section id="vistaReportes" class="oculto"></section>
  <section id="vistaUsuarios" class="oculto"></section>
  <section id="vistaTabla" class="oculto"></section>
  <section id="vistaConfiabilidad" class="oculto"></section>
  <section id="vistaRecursos" class="oculto"></section>

  <div id="muro" class="login-box"><p>Cargando...</p></div>
</main>

<div id="toast" class="oculto"></div>
<footer>Plantilla genérica de seguimiento de club — instancia propia, sin datos compartidos con otros clubes.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config/firebase.js" onerror="window.FIREBASE_CONFIG_FALTA=true"></script>
<script>
let CLUB = null;
let db = null;
let auth = null;
let usuario = null;
let rolActual = null;
let categoriaActual = null;
let vistaActual = 'inicio';

let fichaAbierta = {};              // categoriaId -> jugadorId con la ficha completa abierta
let detalleAbiertoFecha = {};       // categoriaId -> fecha con el detalle del partido abierto
let convocatoriaAbiertaFecha = {};  // categoriaId -> fecha con la convocatoria abierta
const MOTIVOS_CAMBIO = ['', 'Táctico', 'Lesión', 'Fatiga', 'Disciplina'];
const VALORACIONES = ['', 'Excelente', 'Muy buena', 'Buena', 'Regular'];
const TIPOS_PRESTAMO = ['Préstamo a otro club', 'Convocatoria a selección'];
const TIPOS_DOCUMENTO = ['Planificación', 'Proyecto externo', 'Rendimiento físico'];
const TIPOS_CONSULTA = ['Médica', 'Física', 'Nutrición', 'Desarrollo humano', 'Entrenamiento', 'Entrenamiento general', 'División'];
const LESION = {
  registro: ['Lesión deportiva en la institución', 'Lesión deportiva fuera de la institución', 'Trastorno no lesional', 'Otra'],
  causa: ['Traumática', 'No traumática', 'Otra'],
  tipoLesion: ['Articular (ligamentaria / escapular)', 'Muscular', 'Ósea', 'Tendinosa', 'Otra'],
  localizacion: ['Abdomen', 'Cabeza / Cara', 'Cadera / Ingle', 'Columna baja / Pelvis / Sacro', 'Cuello / Columna cervical',
    'Esternón / Costillas / Columna superior', 'Hombro / Clavícula', 'Mano / Dedo / Pulgar', 'Muñeca', 'Muslo', 'Pie / Dedo',
    'Pierna / Tendón de Aquiles', 'Rodilla', 'Tobillo', 'Otra'],
  diagnostico: ['Conmoción', 'Contusión / Hematoma', 'Esguince / Ligamentaria', 'Fractura', 'Laceración',
    'Lesión por sobreuso no específica', 'Luxación / Subluxación', 'Meniscal / Cartilaginosa', 'Nerviosa',
    'Ruptura muscular / Desgarro', 'Sinovitis', 'Tendinopatía', 'Otra lesión ósea', 'Otra'],
  severidad: ['Leve (0 días de reposo) / Consulta', 'Mínima (1-3 días de reposo)', 'Media (4-7 días de reposo)',
    'Moderada (8-28 días de reposo)', 'Severa (más de 28 días de reposo)', 'Otra'],
  mecanismo: ['Barriendo / Tackling', 'Cabezazo', 'Caída', 'Carrera / Sprint', 'Choque / Colisión', 'Deslizamiento',
    'Elongación / Stretching', 'Giro / Pivot', 'Golpe por pelota', 'Obstrucción', 'Pase', 'Patada',
    'Recibiendo barrida / Tackle', 'Regate / Dribbling', 'Remate', 'Salto / Aterrizaje', 'Sobreuso', 'Uso del brazo / Codo', 'Otro'],
  tratamientoInicial: ['Inmovilizador', 'Conservador (continúa diferenciado / disminuye carga)', 'Quirúrgico', 'Otro'],
  reincidencia: ['No', 'Sí', 'Desconocido'],
};
const ESTADOS_TRATAMIENTO = ['En tratamiento', 'Readaptación', 'Alta'];
const TIPOS_INFORME = ['Trimestral', 'Final', 'Captación'];
let notasPrestamoAbierto = {}; // categoriaId -> prestamoId con las notas abiertas
const SISTEMAS_TACTICOS = ['1-4-4-2', '1-4-3-3', '1-4-2-3-1', '1-4-1-4-1', '1-4-4-1-1', '1-4-1-3-2', '1-4-2-1-3', '1-3-5-2', '1-3-4-3', '1-3-4-1-2', '1-5-3-2', '1-5-4-1'];
let mostrarArchivados = {}; // categoriaId -> bool
let filtrosPlantel = {};     // categoriaId -> {nombre, pos, edadMax, valoracion}
let filtroCompetencia = {};  // categoriaId -> competencia elegida en Estadísticas
let fixtureGrupo = null, fixtureCompetencia = '';
let filtrosReportes = {libDesde:'', libHasta:'', libPos:'', conDesde:'', conHasta:''};
const NODOS_POR_JUGADOR = ['lesiones', 'contratos', 'prestamos', 'multimedia', 'informes'];
// Lo que es de una temporada (como en futdetail) se guarda bajo
// temporadas/<año>/...; el plantel y lo del jugador (médico, contratos,
// préstamos, multimedia, informes) es del club y no cambia de año.
const NODOS_DE_TEMPORADA = ['partidos', 'convocatorias', 'tablaPosiciones', 'recordatoriosOmitidos', 'entrenamientos', 'documentos', 'gps'];
let temporadaActiva = null;  // la vigente del club (temporadasInfo/activa)
let temporadaActual = null;  // la que se está mirando
let temporadasLista = [];

// Todo dato cargado por usuarios pasa por esc() antes de ir a innerHTML: sin
// esto, un texto con comillas se corta dentro de value="..." y al re-guardar
// se pierde el resto.
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function url(u){
  u = String(u ?? '').trim();
  if(!u) return '';
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return /^https?:/i.test(u) ? esc(u) : '';
  return esc('https://'+u);
}

function fechaCorta(iso, anioCompleto){
  if(!iso) return '';
  const [a,m,d] = String(iso).split('-');
  return d ? `${d}-${m}-${anioCompleto ? a : a.slice(2)}` : iso;
}
function hoyISO(desplazamientoMeses){
  const h = new Date();
  if(desplazamientoMeses) h.setMonth(h.getMonth() + desplazamientoMeses);
  return new Date(h.getTime() - h.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function edadDe(fechaNac){
  if(!fechaNac) return '';
  const n = new Date(fechaNac+'T00:00:00'), h = new Date();
  let e = h.getFullYear() - n.getFullYear();
  if(h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) e--;
  return e;
}
function nombreCategoria(id){ return CLUB.temporada.categorias.find(c=>c.id===id)?.nombre || id; }
const sinAcentos = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function nombreCompleto(j){ return j ? `${j.apellido||''}, ${j.nombre||''}` : ''; }

// Al cambiar de vista se apagan los listeners de todas las demás (si no,
// vistas ocultas siguen bajando datos de Firebase en cada cambio).
const _listasRefs = new Set();
function apagarSuscripciones(){
  _listasRefs.forEach(lista=>{ lista.forEach(r=>r.ref.off('value', r.cb)); lista.length = 0; });
}
// Sin esto, un guardado rechazado por Firebase (rol sin permiso, reglas
// desactualizadas) fallaba en silencio y el usuario creía que se había guardado.
window.addEventListener('unhandledrejection', e=>{
  if(/PERMISSION_DENIED/i.test(String(e.reason?.message || e.reason))){
    mostrarToast('No se pudo guardar: la base de datos rechazó el cambio por permisos. Revisá tu rol o las reglas de Firebase.');
  }
});
let _toastTimer = null;
function mostrarToast(texto){
  const el = document.getElementById('toast');
  el.textContent = texto;
  el.classList.remove('oculto');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.add('oculto'), 7000);
}

function rutaReal(ruta){
  return NODOS_DE_TEMPORADA.includes(ruta.split('/')[0]) ? `temporadas/${temporadaActual}/${ruta}` : ruta;
}
function dbRef(ruta){ return db.ref(rutaReal(ruta)); }

async function cargarTemporadas(){
  const info = db ? ((await db.ref('temporadasInfo').once('value')).val() || {}) : {};
  temporadaActiva = String(info.activa || CLUB.temporada.anio || new Date().getFullYear());
  temporadasLista = [...new Set([temporadaActiva, ...Object.keys(info.lista || {})])].sort().reverse();
  temporadaActual = temporadaActiva;
  const sel = document.getElementById('selectorTemporada');
  sel.innerHTML = temporadasLista.map(t=>`<option value="${esc(t)}">${esc(t)}${t===temporadaActiva?' (activa)':''}</option>`).join('');
  sel.value = temporadaActual;
  sel.onchange = ()=>{ temporadaActual = sel.value; renderVistaActual(); };
}

// Admin: arrancar una temporada nueva. No mueve ni borra nada: la anterior
// queda tal cual bajo temporadas/<año> y se sigue viendo desde el selector.
async function iniciarTemporada(){
  const nueva = document.getElementById('nuevaTemporada').value.trim();
  if(!nueva || nueva === temporadaActiva) return;
  if(!confirm(`¿Pasar a la temporada ${nueva}?\n\nPartidos, convocatorias, tabla, entrenamientos y documentos arrancan vacíos. La temporada ${temporadaActiva} queda guardada y se puede ver eligiéndola arriba.\n\nEl plantel, los datos médicos, contratos, préstamos, multimedia e informes no cambian (los ascensos se hacen con "Pasar de categoría" en Plantel).`)) return;
  await db.ref('temporadasInfo').update({activa: nueva, ['lista/'+nueva]: true, ['lista/'+temporadaActiva]: true});
  location.reload();
}

function temporadaAdminHTML(){
  if(!esAdmin()) return '';
  const sugerida = String((parseInt(temporadaActiva) || new Date().getFullYear()) + 1);
  return `
  <div class="card">
    <h2>Temporada</h2>
    <p class="nota">Temporada activa: <b>${esc(temporadaActiva)}</b>. Al iniciar una nueva, los partidos, convocatorias, tabla, entrenamientos y documentos arrancan vacíos y la anterior queda para consultar desde el selector de arriba.</p>
    <div class="fila-form">
      <input id="nuevaTemporada" value="${esc(sugerida)}" style="flex:none;width:110px;">
      <button class="secundario" onclick="iniciarTemporada()" style="flex:none;">Iniciar temporada nueva</button>
    </div>
  </div>`;
}

function suscribirRefs(listaRefs, pares){
  _listasRefs.add(listaRefs);
  listaRefs.forEach(r=>r.ref.off('value', r.cb));
  listaRefs.length = 0;
  pares.forEach(([ruta, onDato])=>{
    const ref = dbRef(ruta);
    const cb = snap => onDato(snap.val() || {});
    ref.on('value', cb);
    listaRefs.push({ref, cb});
  });
}

async function cargarConfigClub(){
  try{
    const r = await fetch('config/club.json', {cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){}
  const rEj = await fetch('config/club.example.json', {cache:'no-store'});
  return await rEj.json();
}

function aplicarTema(club){
  const c = club.club.colores || {};
  const root = document.documentElement.style;
  if(c.fondo) root.setProperty('--fondo', c.fondo);
  if(c.superficie) root.setProperty('--superficie', c.superficie);
  if(c.primario) root.setProperty('--primario', c.primario);
  if(c.texto) root.setProperty('--texto', c.texto);
  document.getElementById('pageTitle').textContent = club.club.nombre;
  document.getElementById('nombreClub').textContent = club.club.nombre;
  if(club.club.escudoUrl){
    const img = document.getElementById('escudo');
    img.src = club.club.escudoUrl;
    img.classList.remove('oculto');
  }
}

function poblarSelectorCategoria(){
  const sel = document.getElementById('selectorCategoria');
  const cats = categoriasVisibles();
  sel.innerHTML = cats.map(c=>`<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join('');
  if(!cats.some(c=>c.id===categoriaActual)) categoriaActual = cats[0]?.id || null;
  sel.value = categoriaActual;
  sel.onchange = ()=>{ categoriaActual = sel.value; renderVistaActual(); };
}

function rolDe(id){
  return (CLUB.roles || []).find(r => (typeof r === 'string' ? r : r.id) === id);
}

// El rol con id "admin" es el que administra usuarios y temporadas: las
// reglas de Firebase lo reconocen por ese id (no pueden leer club.json).
function esAdmin(){ return rolActual === 'admin'; }

function puedeEditar(catId){
  if(!rolActual) return false;
  if(esAdmin()) return true;
  const rol = rolDe(rolActual);
  if(!rol) return false;
  if(typeof rol === 'string') return true;
  if(!rol.categorias || rol.categorias === 'todas') return true;
  return rol.categorias.includes(catId || categoriaActual);
}

function puedeVer(catId){
  if(!db) return true;
  if(!rolActual) return false;
  if(esAdmin()) return true;
  const rol = rolDe(rolActual);
  if(!rol) return false;
  const ve = typeof rol === 'string' ? 'todas' : (rol.ve ?? 'todas');
  return ve === 'todas' || ve.includes(catId);
}

function categoriasVisibles(){ return CLUB.temporada.categorias.filter(c=>puedeVer(c.id)); }

// Las reglas solo dejan leer categoría por categoría (según el rol), nunca
// un nodo entero: las vistas de todo el club arman {cat: datos} así.
function paresPorCategoria(nodo, alCambiar){
  const acum = {};
  return categoriasVisibles().map(c=>[`${nodo}/${c.id}`, v=>{ acum[c.id] = v; alCambiar(acum); }]);
}

// Las reglas tampoco pueden leer club.json: el admin copia qué edita y qué ve
// cada rol a rolesConfig cada vez que entra.
async function sincronizarRolesConfig(){
  const comoMapa = v => (v === undefined || v === 'todas') ? 'todas' : Object.fromEntries((v || []).map(c=>[c, true]));
  const cfg = {};
  (CLUB.roles || []).forEach(r=>{
    cfg[typeof r === 'string' ? r : r.id] = typeof r === 'string'
      ? {edita: 'todas', ve: 'todas'}
      : {nombre: r.nombre || r.id, edita: comoMapa(r.categorias), ve: comoMapa(r.ve)};
  });
  await db.ref('rolesConfig').set(cfg);
}

// ---------- Auth ----------
// Nada se ve sin una cuenta aprobada: la persona crea su cuenta, pide un rol
// y queda pendiente hasta que el admin la aprueba en "Usuarios".
let _refUsuario = null, _refPendientes = null;

function rolesSolicitables(){
  return (CLUB.roles || []).map(r=> typeof r === 'string' ? {id:r, nombre:r} : r).filter(r=>r.id !== 'admin');
}

function mostrarMuro(modo, mensaje){
  apagarSuscripciones();
  document.getElementById('nav').classList.add('oculto');
  document.getElementById('selectorCategoriaWrap').classList.add('oculto');
  document.getElementById('avisoTemporada').classList.add('oculto');

      <button class="accion" onclick="recuperarPassword()">Enviar mail</button>
      <div><button class="link" onclick="mostrarMuro('login')">Volver</button></div>`,
    pedirAcceso: `<h2>Pedir acceso</h2>

      <select id="regRol">${opcionesRol}</select>

function mensajeMuro(texto, ok){
  const el = document.getElementById('muroMensaje');
  el.textContent = texto;
  el.style.color = ok ? 'var(--verde)' : 'var(--rojo)';
}

const ERRORES_AUTH = {
  'auth/invalid-credential': 'Email o contraseña incorrectos.',
  'auth/wrong-password': 'Email o contraseña incorrectos.',
  'auth/user-not-found': 'Email o contraseña incorrectos.',
  'auth/invalid-login-credentials': 'Email o contraseña incorrectos.',
  'auth/email-already-in-use': 'Ya hay una cuenta con ese email: ingresá o pedí cambiar la contraseña.',
  'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres.',
  'auth/invalid-email': 'El email no es válido.',
  'auth/too-many-requests': 'Demasiados intentos. Esperá un rato y probá de nuevo.',
};
const textoErrorAuth = err => ERRORES_AUTH[err.code] || err.message;

function hacerLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ mensajeMuro('Completá email y contraseña.'); return; }
  auth.signInWithEmailAndPassword(email, pass).catch(err=> mensajeMuro(textoErrorAuth(err)));
}

async function crearCuenta(){
  const nombre = document.getElementById('regNombre').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const rol = document.getElementById('regRol').value;
  if(!nombre || !email || !pass){ mensajeMuro('Completá nombre, email y contraseña.'); return; }
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await guardarPedidoDeAcceso(cred.user, nombre, rol);
  }catch(err){ mensajeMuro(textoErrorAuth(err)); }
}

function pedirAcceso(){
  const nombre = document.getElementById('regNombre').value.trim();
  if(!nombre){ mensajeMuro('Poné tu nombre y apellido.'); return; }
  guardarPedidoDeAcceso(usuario, nombre, document.getElementById('regRol').value);
}

// Campo por campo: las reglas dejan que cada uno escriba estos datos de su
// propia cuenta, pero nunca "role" (eso lo asigna solo el admin).
function guardarPedidoDeAcceso(user, nombre, rol){
  return db.ref('users/'+user.uid).update({
    email: user.email, nombre, rolSolicitado: rol, solicitadoEl: new Date().toISOString(),
  });
}

function recuperarPassword(){
  const email = document.getElementById('recEmail').value.trim();
  if(!email){ mensajeMuro('Poné tu email.'); return; }
  auth.sendPasswordResetEmail(email)
    .then(()=> mensajeMuro('Listo: si hay una cuenta con ese email, te llega un mail para cambiar la contraseña.', true))
    .catch(err=> mensajeMuro(textoErrorAuth(err)));
}

function hacerLogout(){
  apagarSuscripciones();
  auth.signOut();
}

function onAuthCambio(user){
  usuario = user;
  if(_refUsuario){ _refUsuario.off(); _refUsuario = null; }
  if(_refPendientes){ _refPendientes.off(); _refPendientes = null; }
  rolActual = null;
  if(!user){ mostrarMuro('login'); return; }
  mostrarMuro('cargando');
  // Escucha la propia cuenta: cuando el admin la aprueba (o le cambia/quita el
  // rol) la pantalla se actualiza sola, sin tener que volver a entrar.
  _refUsuario = db.ref('users/'+user.uid);
  _refUsuario.on('value', async snap=>{
    const u = snap.val() || {};
    const rol = u.role || null;
    if(!rol){
      rolActual = null;
      mostrarMuro(u.rolSolicitado ? 'pendiente' : 'pedirAcceso');
      return;
    }
    if(rol === rolActual) return;
    rolActual = rol;
    if(esAdmin()){
      await sincronizarRolesConfig();
      escucharPendientes();
    }
    await cargarTemporadas();
    mostrarApp();
  });
}

function escucharPendientes(){
  _refPendientes = db.ref('users');
  _refPendientes.on('value', snap=>{
    const n = Object.values(snap.val() || {}).filter(u=>!u.role && u.rolSolicitado).length;
    document.getElementById('navUsuarios').textContent = n ? `Usuarios (${n} pendiente${n>1?'s':''})` : 'Usuarios';
  });
}

function mostrarApp(){
  document.getElementById('muro').classList.add('oculto');
  document.getElementById('nav').classList.remove('oculto');
  document.getElementById('navUsuarios').classList.toggle('oculto', !esAdmin());
  if(vistaActual === 'usuarios' && !esAdmin()) vistaActual = 'inicio';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('activo', b.dataset.vista===vistaActual));
  poblarSelectorCategoria();
  actualizarEstadoSesion();
  renderVistaActual();
}

function actualizarEstadoSesion(){
  const el = document.getElementById('estadoSesion');
  if(!usuario){ el.innerHTML = ''; return; }
  const rol = rolActual ? rolDe(rolActual) : null;
  const nombreRol = rol ? (typeof rol === 'string' ? rol : rol.nombre) : rolActual;
  el.innerHTML = (rolActual ? `<span class="tag-rol">${esc(nombreRol)}</span> ` : '')
    + esc(usuario.email) + ' <button class="secundario" onclick="hacerLogout()">Salir</button>';

// ---------- Cálculos compartidos (Inicio / Estadísticas / Fixture / ficha) ----------
// G/E/P sale del campo "resultado" que se elige a mano; si no está, de los goles.
function desenlace(p){
  if(!p) return null;
  const r = {Victoria:'G', Empate:'E', Derrota:'P'}[p.resultado];
  if(r) return r;
  if(p.resultado === 'No Disputado' || p.golesFavor == null || p.golesContra == null) return null;
  return p.golesFavor > p.golesContra ? 'G' : p.golesFavor < p.golesContra ? 'P' : 'E';
}
function resumenEquipo(lista){
  const r = {pj:0, g:0, e:0, p:0, gf:0, gc:0};
  lista.forEach(p=>{
    const x = desenlace(p);
    if(!x) return;
    r.pj++; r[x.toLowerCase()]++;
    r.gf += Number(p.golesFavor)||0; r.gc += Number(p.golesContra)||0;
  });
  r.pts = r.g*3 + r.e;
  r.pct = r.pj ? (r.pts*100/(r.pj*3)).toFixed(1) : '0.0';
  return r;
}
function kpisHTML(r){
  return `<div class="kpis">${[['Partidos', r.pj], ['Ganados', r.g], ['Empatados', r.e], ['Perdidos', r.p],
    ['Goles a favor', r.gf], ['Goles en contra', r.gc], ['% de puntos', r.pct+'%']]
    .map(([t,v])=>`<div class="kpi"><b>${v}</b>${t}</div>`).join('')}</div>`;
}
function statsJugadores(convocatorias, partidos, competencia){
  const st = {};
  Object.entries(convocatorias||{}).forEach(([fecha, conv])=>{
    if(competencia && (partidos?.[fecha]?.competencia || '') !== competencia) return;
    Object.entries(conv||{}).forEach(([jid,c])=>{
      const x = st[jid] || (st[jid] = {jugador:'', conv:0, jug:0, tit:0, min:0, goles:0, asist:0, ta:0, tr:0, dest:0});
      if(c.jugador) x.jugador = c.jugador;
      x.conv++; if(c.titular) x.tit++;
      if(c.titular || (Number(c.minutos)||0) > 0) x.jug++;
      x.min += Number(c.minutos)||0; x.goles += Number(c.goles)||0; x.asist += Number(c.asistencias)||0;
      if(c.amarilla) x.ta++; if(c.roja) x.tr++; if(c.destacado) x.dest++;
    });
  });
  return st;
}
function competenciasDe(partidos){
  return [...new Set(Object.values(partidos||{}).map(p=>p.competencia).filter(Boolean))].sort();
}
// Amarillas por ciclo (mismo criterio que Tigre): se cuentan en orden de
// fecha y el ciclo vuelve a cero al llegar a la suspensión o con una
// expulsión (en los dos casos el jugador ya cumple fecha). Solo cuenta lo
// anterior a `antesDeFecha` si se pasa (para armar la convocatoria de esa
// fecha); "suspendido" = lo que pasó en la última fecha contada.
function situacionTarjetas(convocatorias, partidos, antesDeFecha){
  const d = CLUB.disciplina || {};
  const alerta = d.amarillasAlerta ?? 4, suspension = d.amarillasSuspension ?? 5;
  const noCuentan = (d.competenciasQueNoCuentan || []).map(sinAcentos);
  const fechas = Object.keys(convocatorias || {})
    .filter(f=> antesDeFecha == null || Number(f) < Number(antesDeFecha))
    .filter(f=> !noCuentan.includes(sinAcentos(partidos?.[f]?.competencia || '')))
    .sort((a,b)=> a-b);
  const ultima = fechas[fechas.length-1];
  const ciclo = {}, nombre = {}, suspendido = {};
  fechas.forEach(f=> Object.entries(convocatorias[f] || {}).forEach(([jid, c])=>{
    if(c.jugador) nombre[jid] = c.jugador;
    if(c.roja){
      ciclo[jid] = 0;
      if(f === ultima) suspendido[jid] = `Expulsado en la fecha ${f} (ver sanción)`;
      return;
    }
    if(!c.amarilla) return;
    ciclo[jid] = (ciclo[jid] || 0) + 1;
    if(ciclo[jid] >= suspension){
      ciclo[jid] = 0;
      if(f === ultima) suspendido[jid] = `Llegó a ${suspension} amarillas en la fecha ${f}: cumple la próxima`;
    }
  }));
  const ids = [...new Set([...Object.keys(ciclo), ...Object.keys(suspendido)])];
  return {
    alerta, suspension, ciclo, suspendido, nombre,
    enRiesgo: ids.filter(id=> suspendido[id] || (ciclo[id] || 0) >= alerta),
  };
}

let _indiceJugadores = null;
async function cargarIndiceJugadores(){
  const pares = await Promise.all(categoriasVisibles().map(c=> dbRef('plantel/'+c.id).once('value').then(x=>[c.id, x.val() || {}])));
  _indiceJugadores = pares.flatMap(([cat, pl])=> Object.entries(pl).map(([id, j])=>({id, cat, j})));
  buscarJugador(document.getElementById('buscadorJugador').value);
}
function buscarJugador(texto){
  const el = document.getElementById('resultadosBusqueda');
  const q = sinAcentos(texto.trim());
  if(!q || !_indiceJugadores){ el.classList.add('oculto'); return; }
  const r = _indiceJugadores
    .filter(x=> sinAcentos(`${nombreCompleto(x.j)} ${x.j.nombre||''} ${x.j.apellido||''}`).includes(q))
    .sort((a,b)=> !!a.j.archivado - !!b.j.archivado || nombreCompleto(a.j).localeCompare(nombreCompleto(b.j)))
    .slice(0, 12);
  el.innerHTML = r.length
    ? r.map(x=>`<button onmousedown="irAJugador('${x.cat}','${x.id}')">${esc(nombreCompleto(x.j))}
        <span class="nota">· ${esc(nombreCategoria(x.cat))} · ${esc(nombrePosicion(x.j.posicion))}${x.j.archivado ? ' · archivado' : ''}</span></button>`).join('')
    : '<div class="nota" style="padding:8px 10px;">Sin resultados</div>';
  el.classList.remove('oculto');
}
function irAJugador(cat, id){
  const x = (_indiceJugadores || []).find(y=> y.id === id && y.cat === cat);
  document.getElementById('buscadorJugador').value = '';
  document.getElementById('resultadosBusqueda').classList.add('oculto');
  categoriaActual = cat;
  document.getElementById('selectorCategoria').value = cat;
  filtrosPlantel[cat] = {};
  if(x?.j.archivado) mostrarArchivados[cat] = true;
  fichaAbierta[cat] = id;
  vistaActual = 'plantel';
  document.querySelectorAll('#nav button[data-vista]').forEach(b=>b.classList.toggle('activo', b.dataset.vista === 'plantel'));
  renderVistaActual();
  setTimeout(()=> document.getElementById('historial_'+id)?.closest('.panel-anidado')?.scrollIntoView({behavior:'smooth', block:'start'}), 700);
}

function inicioHTML(d){
  const cat = categoriaActual;
  const hoy = hoyISO(), en6Meses = hoyISO(6);
  const mes = hoy.slice(5,7), dia = hoy.slice(8,10);
  const jugadorDe = (c, id) => d.plantel[c]?.[id];
  const nombreEn = (c, id, respaldo) => jugadorDe(c,id) ? nombreCompleto(jugadorDe(c,id)) : (respaldo || '(jugador no encontrado)');

  const cumples = [];
  Object.entries(d.plantel).forEach(([c, pl])=> Object.values(pl||{}).forEach(j=>{
    if(!j.archivado && (j.fechaNacimiento||'').slice(5,7) === mes) cumples.push({c, j});
  }));
  cumples.sort((a,b)=> a.j.fechaNacimiento.slice(8,10).localeCompare(b.j.fechaNacimiento.slice(8,10)));
  const cumplesHoy = cumples.filter(x=> x.j.fechaNacimiento.slice(8,10) === dia);

  const lesionados = [];
  Object.entries(d.lesiones).forEach(([c, ls])=> Object.values(ls||{}).forEach(l=>{ if(lesionActiva(l)) lesionados.push({c, l}); }));
  lesionados.sort((a,b)=> (a.l.fechaEstimadaRecuperacion||'9').localeCompare(b.l.fechaEstimadaRecuperacion||'9'));

  const contratos = [];
  Object.entries(d.contratos).forEach(([c, cs])=> Object.values(cs||{}).forEach(k=>{
    if(k.fechaFin && k.fechaFin >= hoy && k.fechaFin <= en6Meses) contratos.push({c, k});
  }));
  contratos.sort((a,b)=> a.k.fechaFin.localeCompare(b.k.fechaFin));

  const partidosCat = d.partidos[cat] || {};
  const r = resumenEquipo(Object.values(partidosCat));
  const ultimos = Object.entries(partidosCat).filter(([,p])=>desenlace(p)).sort((a,b)=>(+b[0])-(+a[0])).slice(0,5);
  const st = Object.entries(statsJugadores(d.convocatorias[cat], partidosCat));
  const tarjetas = situacionTarjetas(d.convocatorias[cat], partidosCat);
  const top = campo => st.filter(([,x])=>x[campo]>0).sort((a,b)=>b[1][campo]-a[1][campo]).slice(0,5);
  const listaTop = (campo, vacio) => {
    const t = top(campo);

// ---------- GPS / rendimiento físico ----------
// Sesiones en temporadas/<año>/gps/<cat>/<sesionId> = {fecha, tipo, titulo,
// fuente, registros: {<slug del nombre>: {jugador, minutos, ...métricas}}}.
// Se guarda el nombre tal cual lo trae el proveedor; el vínculo con el
// plantel se resuelve al mostrar (gpsAlias/<cat>/<slug> = jugadorId, o por
// nombre), así la carga desde la app y la del importador automático andan igual.
const METRICAS_GPS = [
  {k:'minutos', t:'Min.', d:0, re:/duration|duracion|minut|tiempo jugado|time played/},
  {k:'distanciaTotalM', t:'Distancia (m)', d:0, re:/total distance|distancia total|^distance|^distancia$|^distancia \(m\)/},
  {k:'distanciaPorMinM', t:'m/min', d:1, re:/m\/min|meterage|(distance|distancia).*(por min|per min|\/min)/},
  {k:'metros1821', t:'18-21 km/h (m)', d:0, re:/18.?21/},
  {k:'metros2125', t:'21-25 km/h (m)', d:0, re:/21.?25/},
  {k:'metros25Mas', t:'+25 km/h (m)', d:0, re:/(\+|>|mas de) ?25|25 ?(\+|km\/h ?\+)/},
  {k:'distanciaAltaVelocidadPorMin', t:'Alta vel. m/min', d:1, re:/(hsr|high speed|alta velocidad).*(min)/},
  {k:'sprints', t:'Sprints', d:0, re:/^(n.? ?de )?sprints?( count| efforts)?$|cantidad de sprints/},
  {k:'velMaxKmh', t:'Vel. máx (km/h)', d:1, max:true, re:/max(imum|ima)? ?(speed|velocity|velocidad|vel)|vel(ocidad)? ?max|top speed/},
  {k:'aceleraciones', t:'Acel.', d:0, re:/^(n.? ?de )?(accel|aceler)/},
  {k:'aceleracionesBanda2', t:'Acel. banda 2', d:0, re:null},
  {k:'desaceleraciones', t:'Desacel.', d:0, re:/^(n.? ?de )?(decel|desacel|deacel)/},
  {k:'aceleracionMaximaIndividual', t:'Acel. máx (m/s²)', d:2, max:true, re:/max.*(accel|aceler)/},
  {k:'desaceleracionMaximaIndividual', t:'Desacel. máx (m/s²)', d:2, max:true, abs:true, re:/max.*(decel|desacel)/},
  {k:'playerLoad', t:'Player load', d:0, re:/player ?load|carga/},
];
// Algunos proveedores dan la desaceleración en negativo: se compara por magnitud.
const valorGps = (r, m) => { const v = Number(r?.[m.k]) || 0; return m.abs ? Math.abs(v) : v; };
const slugNombre = n => sinAcentos(n).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');

// Alias guardado > nombre y apellido > inicial + apellido > apellido único.
function resolverJugadorGps(nombre, plantel, alias){
  const slug = slugNombre(nombre);
  if(alias?.[slug] && plantel[alias[slug]]) return alias[slug];
  const palabras = new Set(slug.split('_').filter(Boolean));
  const partes = j => [slugNombre(j.apellido||'').split('_').filter(Boolean), slugNombre(j.nombre||'').split('_').filter(Boolean)];
  const conApellido = Object.entries(plantel).filter(([,j])=>{ const [ap] = partes(j); return ap.length && ap.every(w=>palabras.has(w)); });
  const conNombre = conApellido.filter(([,j])=>{
    const [, no] = partes(j);
    return no.some(w=>palabras.has(w)) || [...palabras].some(w=> w.length === 1 && no.some(n=> n[0] === w));
  });
  if(conNombre.length === 1) return conNombre[0][0];
  return conApellido.length === 1 && !conNombre.length ? conApellido[0][0] : null;
}

function numeroGps(v){
  v = String(v ?? '').trim();
  if(!v) return 0;
  const tiempo = v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if(tiempo) return tiempo[3] !== undefined ? (+tiempo[1])*60 + (+tiempo[2]) + (+tiempo[3])/60 : (+tiempo[1]) + (+tiempo[2])/60;
  if(v.includes(',') && v.includes('.')) v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g,'').replace(',', '.') : v.replace(/,/g,'');
  else v = v.replace(',', '.');
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function parsearCsv(texto){
  texto = texto.replace(/^\uFEFF/, '');
  const primera = texto.split(/\r?\n/)[0];
  const sep = [';', '\t', ','].sort((a,b)=> primera.split(b).length - primera.split(a).length)[0];
  const filas = []; let fila = [], campo = '', comillas = false;
  for(let i=0; i<texto.length; i++){
    const c = texto[i];
    if(comillas){
      if(c === '"' && texto[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"') comillas = false;
      else campo += c;
    } else if(c === '"') comillas = true;
    else if(c === sep){ fila.push(campo); campo = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && texto[i+1] === '\n') i++;
      fila.push(campo); campo = '';
      if(fila.some(x=>x.trim() !== '')) filas.push(fila);
      fila = [];
    } else campo += c;
  }
  fila.push(campo);
  if(fila.some(x=>x.trim() !== '')) filas.push(fila);
  const encabezados = (filas.shift() || []).map(h=>h.trim());
  return {encabezados, filas: filas.map(f=> Object.fromEntries(encabezados.map((h,i)=>[h, (f[i] ?? '').trim()])))};
}

// Mapeo de columnas: lo último usado en este navegador > club.json
// (fuentes.gps.config.mapeoColumnas, el mismo del importador de Python) > adivinar.
function mapeoInicialGps(encabezados){
  let guardado = {};
  try{ guardado = JSON.parse(localStorage.getItem('mapeoGps') || '{}'); }catch(e){}
  const deConfig = CLUB.fuentes?.gps?.config?.mapeoColumnas || {};
  const mapeo = {};
  const elegir = (campo, re) => encabezados.find(h=> guardado[h] === campo) || encabezados.find(h=> deConfig[h] === campo)
    || (re ? encabezados.find(h=> re.test(sinAcentos(h))) : undefined) || '';
  mapeo.jugador = elegir('jugador', /player|jugador|^name$|nombre|athlete|atleta/);
  const usadas = new Set([mapeo.jugador]);
  // Desaceleraciones antes que aceleraciones: "desaceleraciones" contiene "aceleraciones".
  [...METRICAS_GPS].sort((a,b)=> /desacel/.test(b.k) - /desacel/.test(a.k) || !!b.max - !!a.max).forEach(m=>{
    const h = encabezados.filter(x=>!usadas.has(x)).find(x=> guardado[x] === m.k) || encabezados.filter(x=>!usadas.has(x)).find(x=> deConfig[x] === m.k)
      || (m.re ? encabezados.filter(x=>!usadas.has(x)).find(x=> m.re.test(sinAcentos(x))) : undefined) || '';
    mapeo[m.k] = h; if(h) usadas.add(h);
  });
  return mapeo;
}

const fmtGps = (v, d) => (v === undefined || v === null || v === '' || isNaN(v)) ? '' : Number(v).toFixed(d);

function gpsHTML(cat){
  const {sesiones, plantel, alias, partidos} = _gpsCtx;
  const ids = Object.keys(sesiones).sort((a,b)=> (sesiones[b].fecha||'').localeCompare(sesiones[a].fecha||'') || b.localeCompare(a));
  if(!ids.length) return `<div class="card"><h2>GPS — ${esc(nombreCategoria(cat))} ${esc(temporadaActual)}</h2>
    <p class="nota">Todavía no hay sesiones cargadas en esta categoría y temporada. Se cargan con "Cargar sesión desde CSV" (cualquier proveedor exporta CSV) o con el importador automático (scripts/scrape_main.py).</p></div>`;
  const sel = ids.includes(gpsSesionSel[cat]) ? gpsSesionSel[cat] : ids[0];
  const ses = sesiones[sel];
  const regs = Object.entries(ses.registros || {});
  const cols = METRICAS_GPS.filter(m=> regs.some(([,r])=> valorGps(r, m) > 0));
  const maximos = Object.fromEntries(cols.map(m=>[m.k, Math.max(...regs.map(([,r])=> valorGps(r, m)||0))]));
  const conMin = regs.filter(([,r])=> Number(r.minutos) > 0 || !cols.some(m=>m.k==='minutos'));
  const promedio = Object.fromEntries(cols.map(m=>[m.k, conMin.length ? conMin.reduce((a,[,r])=>a+(valorGps(r, m)||0), 0) / conMin.length : 0]));
  const editar = puedeEditar();
  const opcionesJug = Object.entries(plantel).filter(([,j])=>!j.archivado)
    .sort((a,b)=> nombreCompleto(a[1]).localeCompare(nombreCompleto(b[1])))
    .map(([id,j])=>`<option value="${id}">${esc(nombreCompleto(j))}</option>`).join('');
  const filas = regs
    .sort((a,b)=> (Number(b[1].distanciaTotalM)||0) - (Number(a[1].distanciaTotalM)||0) || (Number(b[1].minutos)||0) - (Number(a[1].minutos)||0))
    .map(([slug, r])=>{
      const jid = resolverJugadorGps(r.jugador || slug, plantel, alias);
      const nombre = jid ? esc(nombreCompleto(plantel[jid]))
        : `${esc(r.jugador || slug)} <span class="nota">(sin vincular)</span>${editar ? ` <select onchange="vincularGps('${cat}','${slug}',this.value)"><option value="">Vincular con...</option>${opcionesJug}</select>` : ''}`;
      return `<tr><td>${nombre}</td>${cols.map(m=>`<td${valorGps(r, m) === maximos[m.k] && maximos[m.k] > 0 ? ' class="mejor"' : ''}>${fmtGps(valorGps(r, m), m.d)}</td>`).join('')}</tr>`;
    }).join('');
  return `
  <div class="card">
    <h2>GPS — ${esc(nombreCategoria(cat))} ${esc(temporadaActual)}</h2>
    <div class="fila-form">
      <select onchange="gpsSesionSel['${cat}']=this.value; renderVistaActual();">${ids.map(id=>`<option value="${esc(id)}" ${id===sel?'selected':''}>${esc(etiquetaSesion(sesiones[id], partidos))}</option>`).join('')}</select>
      ${editar ? `<button class="peligro" style="flex:none;" onclick="borrarSesionGps('${cat}','${esc(sel)}')">Borrar sesión</button>` : ''}
    </div>
    <p class="nota">${regs.length} jugadores · fuente: ${esc(ses.fuente || '—')}${ses.archivo ? ' ('+esc(ses.archivo)+')' : ''}. En amarillo, el mejor valor de la sesión.</p>
    <table>
      <thead><tr><th>Jugador</th>${cols.map(m=>`<th>${m.t}</th>`).join('')}</tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr><th>Promedio del equipo</th>${cols.map(m=>`<th>${fmtGps(promedio[m.k], m.d)}</th>`).join('')}</tr></tfoot>
    </table>
  </div>
  ${promediosGpsHTML(cat)}`;
}

function promediosGpsHTML(cat){
  const {sesiones, plantel, alias} = _gpsCtx;
  const tipo = gpsTipoPromedio[cat] || 'partido';
  const acum = {};
  Object.values(sesiones).filter(x=> tipo === 'todos' || x.tipo === tipo).forEach(x=>
    Object.entries(x.registros || {}).forEach(([slug, r])=>{
      const jid = resolverJugadorGps(r.jugador || slug, plantel, alias);
      const k = jid || 'sin:' + slug;
      const a = acum[k] || (acum[k] = {nombre: jid ? nombreCompleto(plantel[jid]) : (r.jugador || slug) + ' (sin vincular)', n: 0, suma: {}, max: {}});
      a.n++;
      METRICAS_GPS.forEach(m=>{ const v = valorGps(r, m) || 0; a.suma[m.k] = (a.suma[m.k] || 0) + v; a.max[m.k] = Math.max(a.max[m.k] || 0, v); });
    }));
  const filas = Object.values(acum);
  const cols = METRICAS_GPS.filter(m=> filas.some(a=> a.max[m.k] > 0));
  return `
  <div class="card">
    <h2>Promedios por jugador</h2>
    <div class="fila-form"><select onchange="gpsTipoPromedio['${cat}']=this.value; renderVistaActual();">
      ${[['partido','Partidos'], ['entrenamiento','Entrenamientos'], ['todos','Todas las sesiones']].map(([v,t])=>`<option value="${v}" ${v===tipo?'selected':''}>${t}</option>`).join('')}
    </select></div>
    <p class="nota">Promedio por sesión; en velocidad y aceleración máximas, el mejor registro.</p>
    <table>
      <thead><tr><th>Jugador</th><th>Sesiones</th>${cols.map(m=>`<th>${m.t}</th>`).join('')}</tr></thead>
      <tbody>${filas.sort((a,b)=> a.nombre.localeCompare(b.nombre)).map(a=>`<tr><td>${esc(a.nombre)}</td><td>${a.n}</td>${cols.map(m=>`<td>${fmtGps(m.max === true ? a.max[m.k] : a.suma[m.k]/a.n, m.d)}</td>`).join('')}</tr>`).join('')
        || `<tr><td colspan="${cols.length + 2}">No hay sesiones de ese tipo.</td></tr>`}</tbody>
    </table>
  </div>`;
}

function vincularGps(cat, slug, jugadorId){
  if(!jugadorId) return;
  dbRef(`gpsAlias/${cat}/${slug}`).set(jugadorId);
}
function borrarSesionGps(cat, id){
  if(!confirm('¿Borrar esta sesión de GPS?')) return;
  dbRef(`gps/${cat}/${id}`).remove();
}

// ---- Carga desde CSV (paso 1: archivo y datos de la sesión; paso 2: columnas y jugadores)
function renderImportGps(){
  const el = document.getElementById('gpsImport');
  if(!puedeEditar()){ el.innerHTML = ''; return; }
  const imp = _importGps;
  el.innerHTML = `
  <div class="card">
    <h2>Cargar sesión desde CSV</h2>
    <p class="nota">Sirve para cualquier proveedor (Catapult, STATSports, WIMU, Playermaker...): exportá la sesión a CSV desde su software y subila acá.</p>
    <div class="fila-form">
      <input type="date" id="gpsFecha" value="${esc(imp?.fecha || hoyISO())}" title="Día de la sesión">
      <select id="gpsTipo">${[['partido','Partido'], ['entrenamiento','Entrenamiento']].map(([v,t])=>`<option value="${v}" ${imp?.tipo===v?'selected':''}>${t}</option>`).join('')}</select>
      <input id="gpsTitulo" placeholder="Título (opcional, ej. turno mañana)" value="${esc(imp?.titulo)}">
      <input type="file" id="gpsArchivo" accept=".csv,.txt" onchange="leerCsvGps(this.files[0])">
    </div>
    ${imp ? importGpsPaso2HTML(imp) : ''}
  </div>`;
}

function leerCsvGps(archivo){
  if(!archivo) return;
  const lector = new FileReader();
  lector.onload = ()=>{
    const {encabezados, filas} = parsearCsv(String(lector.result));
    if(!encabezados.length || !filas.length){ mostrarToast('El archivo no tiene filas para importar.'); return; }
    _importGps = {cat: categoriaActual, archivo: archivo.name, encabezados, filas, mapeo: mapeoInicialGps(encabezados),
      fecha: document.getElementById('gpsFecha').value, tipo: document.getElementById('gpsTipo').value, titulo: document.getElementById('gpsTitulo').value.trim()};
    renderImportGps();
  };
  lector.readAsText(archivo);
}

function cambiarMapeoGps(campo, columna){
  ['fecha','tipo','titulo'].forEach(k=> _importGps[k] = document.getElementById('gps' + k[0].toUpperCase() + k.slice(1)).value);
  _importGps.mapeo[campo] = columna;
  renderImportGps();
}

// Filas que son resúmenes del proveedor ("Team average", "Promedio"...) no son jugadores.
const esFilaResumen = n => /^(team|equipo|promedio|average|total|media)\b/i.test(sinAcentos(n));

function filasImportGps(imp){
  return imp.filas.map(f=> f[imp.mapeo.jugador] || '').map((nombre, i)=>({nombre, fila: imp.filas[i]}))
    .filter(x=> x.nombre && !esFilaResumen(x.nombre));
}

function importGpsPaso2HTML(imp){
  const opcionesCol = sel => `<option value="">— no usar —</option>` + imp.encabezados.map(h=>`<option value="${esc(h)}" ${h===sel?'selected':''}>${esc(h)}</option>`).join('');
  const campos = [{k:'jugador', t:'Jugador (nombre)'}, ...METRICAS_GPS];
  const {plantel, alias} = _gpsCtx;
  const opcionesJug = Object.entries(plantel).filter(([,j])=>!j.archivado)
    .sort((a,b)=> nombreCompleto(a[1]).localeCompare(nombreCompleto(b[1])))
    .map(([id,j])=>`<option value="${id}">${esc(nombreCompleto(j))}</option>`).join('');
  const nombres = imp.mapeo.jugador ? [...new Set(filasImportGps(imp).map(x=>x.nombre))] : [];
  const vinculos = nombres.map(n=>{
    const jid = resolverJugadorGps(n, plantel, alias);
    return `<tr><td>${esc(n)}</td><td><select class="gpsVinculo" data-slug="${esc(slugNombre(n))}">
      <option value="">— sin vincular —</option>${opcionesJug.replace(`value="${jid}"`, `value="${jid}" selected`)}</select></td></tr>`;
  }).join('');
  const sinVincular = nombres.filter(n=> !resolverJugadorGps(n, plantel, alias)).length;
  return `
    <div class="subtitulo">Archivo: ${esc(imp.archivo)} · ${imp.filas.length} filas</div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;">
      <div style="flex:1;min-width:280px;">
        <p class="nota">Qué columna del archivo es cada dato (se recuerda para la próxima carga).</p>
        <table><tbody>${campos.map(c=>`<tr><td>${c.t}</td><td><select onchange="cambiarMapeoGps('${c.k}', this.value)">${opcionesCol(imp.mapeo[c.k])}</select></td></tr>`).join('')}</tbody></table>
      </div>
      <div style="flex:1;min-width:280px;">
        <p class="nota">${nombres.length ? `${nombres.length} jugadores en el archivo${sinVincular ? `, <b>${sinVincular} sin reconocer</b>: elegí a quién corresponde (queda guardado para las próximas cargas)` : ', todos reconocidos'}.` : 'Elegí primero la columna del nombre del jugador.'}</p>
        <table><tbody>${vinculos}</tbody></table>
      </div>
    </div>
    <div class="fila-form" style="margin-top:10px;">
      <button class="accion" style="flex:none;" onclick="guardarImportGps()" ${imp.mapeo.jugador ? '' : 'disabled'}>Guardar sesión</button>
      <button class="secundario" style="flex:none;" onclick="_importGps=null; renderImportGps();">Cancelar</button>
    </div>`;
}

async function guardarImportGps(){
  const imp = _importGps, cat = categoriaActual;
  const fecha = document.getElementById('gpsFecha').value, tipo = document.getElementById('gpsTipo').value;
  const titulo = document.getElementById('gpsTitulo').value.trim();
  if(!fecha){ mostrarToast('Poné el día de la sesión.'); return; }
  const registros = {};
  filasImportGps(imp).forEach(({nombre, fila})=>{
    const r = {jugador: nombre};
    METRICAS_GPS.forEach(m=>{ if(imp.mapeo[m.k]) r[m.k] = numeroGps(fila[imp.mapeo[m.k]]); });
    registros[slugNombre(nombre)] = r;
  });
  const id = [fecha, tipo, slugNombre(titulo)].filter(Boolean).join('_');
  if(_gpsCtx.sesiones[id] && !confirm('Ya hay una sesión cargada con ese día, tipo y título. ¿Reemplazarla?')) return;
  const up = {};
  up[rutaReal(`gps/${cat}/${id}`)] = {fecha, tipo, titulo: titulo || null, fuente: 'csv', archivo: imp.archivo,
    cargadoEl: new Date().toISOString(), cargadoPor: usuario?.email || null, registros};
  document.querySelectorAll('.gpsVinculo').forEach(s=>{ if(s.value) up[`gpsAlias/${cat}/${s.dataset.slug}`] = s.value; });
  const mapeoGuardado = {};
  Object.entries(imp.mapeo).forEach(([campo, col])=>{ if(col) mapeoGuardado[col] = campo; });
  try{ localStorage.setItem('mapeoGps', JSON.stringify(mapeoGuardado)); }catch(e){}
  await db.ref().update(up);
  gpsSesionSel[cat] = id;
  _importGps = null;
  renderVistaActual();
  mostrarToast(`Sesión guardada: ${Object.keys(registros).length} jugadores.`);
}

// ---- Ficha: GPS del jugador en todas las temporadas y categorías visibles
function cargarGpsJugador(id){
  const leer = (ruta) => db.ref(ruta).once('value').then(x=> x.val() || {});
  const cats = categoriasVisibles();
  Promise.all([
    Promise.all(cats.map(c=> Promise.all([leer('plantel/'+c.id), leer('gpsAlias/'+c.id)]))),
    Promise.all(temporadasLista.flatMap(t=> cats.map(c=> leer(`temporadas/${t}/gps/${c.id}`).then(v=>({t, cat: c.id, sesiones: v}))))),
  ]).then(([porCat, gpsPorTemporada])=>{
    const el = document.getElementById('gpsJugador_'+id);
    if(!el) return;
    const ctx = Object.fromEntries(cats.map((c,i)=>[c.id, {plantel: porCat[i][0], alias: porCat[i][1]}]));
    const regs = [];
    gpsPorTemporada.forEach(({t, cat, sesiones})=> Object.values(sesiones).forEach(ses=>
      Object.entries(ses.registros || {}).forEach(([slug, r])=>{
        const pl = {...ctx[cat].plantel};
        if(!pl[id]){ const j = Object.values(ctx).map(x=>x.plantel[id]).find(Boolean); if(j) pl[id] = j; }
        if(resolverJugadorGps(r.jugador || slug, pl, ctx[cat].alias) === id) regs.push({t, cat, ses, r});
      })));
    if(!regs.length){ el.innerHTML = ''; return; }
    regs.sort((a,b)=> (b.ses.fecha||'').localeCompare(a.ses.fecha||''));
    const cols = METRICAS_GPS.filter(m=> regs.some(x=> valorGps(x.r, m) > 0));
    const partidos = regs.filter(x=> x.ses.tipo === 'partido');
    const prom = m => partidos.length ? partidos.reduce((a,x)=> a + (valorGps(x.r, m)||0), 0) / partidos.length : null;
    const mejor = m => Math.max(...regs.map(x=> valorGps(x.r, m) || 0));
    el.innerHTML = `
      <div class="subtitulo" style="margin-top:18px;">GPS</div>
      <table>
        <thead><tr><th></th>${cols.map(m=>`<th>${m.t}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Promedio en partidos (${partidos.length})</td>${cols.map(m=>`<td>${partidos.length ? fmtGps(prom(m), m.d) : ''}</td>`).join('')}</tr>
          <tr><td>Mejor registro</td>${cols.map(m=>`<td>${fmtGps(mejor(m), m.d)}</td>`).join('')}</tr>
        </tbody>
      </table>
      <table>
        <thead><tr><th>Día</th><th>Sesión</th>${cols.map(m=>`<th>${m.t}</th>`).join('')}</tr></thead>
        <tbody>${regs.slice(0, 15).map(x=>`<tr><td>${esc(fechaCorta(x.ses.fecha))}</td><td>${x.ses.tipo === 'partido' ? 'Partido' : 'Entrenamiento'} · ${esc(nombreCategoria(x.cat))}</td>
          ${cols.map(m=>`<td>${fmtGps(valorGps(x.r, m), m.d)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      ${regs.length > 15 ? `<p class="nota">Últimas 15 de ${regs.length} sesiones.</p>` : ''}`;
  });
}

// ---------- Fixture general (todas las categorías de un grupo, fecha por fecha) ----------
// "Jornada" = puntos que sumó el club contra los que sumó el rival entre todas
// las categorías que jugaron esa fecha (así se lee el fixture de juveniles AFA).
let _refsFixture = [];
function gruposFixture(){
  const cats = categoriasVisibles();
  return [
    {id:'juveniles', nombre:'Juveniles', cats: cats.filter(c=>!c.esReserva)},
    {id:'reserva', nombre:'Reserva', cats: cats.filter(c=>c.esReserva)},
  ].filter(g=>g.cats.length);
}
function renderFixture(){
  const sec = document.getElementById('vistaFixture');
  sec.classList.remove('oculto');
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver esto.</p>'; return; }
  suscribirRefs(_refsFixture, paresPorCategoria('partidos', v=>{ sec.innerHTML = fixtureHTML(v); }));
}
function cambiarFixture(grupo, competencia){ fixtureGrupo = grupo; fixtureCompetencia = competencia; renderVistaActual(); }

function fixtureHTML(todos){
  const grupos = gruposFixture();
  const grupo = grupos.find(g=>g.id===fixtureGrupo) || grupos[0];
  if(!grupo) return '<div class="card"><p>No hay categorías configuradas.</p></div>';
  const cats = grupo.cats;
  const comps = [...new Set(cats.flatMap(c=>competenciasDe(todos[c.id])))].sort();
  const comp = comps.includes(fixtureCompetencia) ? fixtureCompetencia : '';
  const porCat = Object.fromEntries(cats.map(c=>[c.id,
    Object.fromEntries(Object.entries(todos[c.id]||{}).filter(([,p])=> !comp || (p.competencia||'') === comp))]));
  const fechas = [...new Set(cats.flatMap(c=>Object.keys(porCat[c.id])))].sort((a,b)=>a-b);
  const tot = Object.fromEntries(cats.map(c=>[c.id, {gf:0, gc:0}]));
  const jugados = [];
  let ptsClubTot = 0, ptsRivalTot = 0;
  const filas = fechas.map(f=>{
    let rival = '', dia = '', ptsClub = 0, ptsRival = 0, hubo = false;
    const celdas = cats.map(c=>{
      const p = porCat[c.id][f];
      if(!p) return '<td></td><td></td><td></td>';
      rival = rival || p.rival || ''; dia = dia || p.fechaPartido || '';
      const x = desenlace(p);
      const loc = {Local:'L', Visitante:'V'}[p.localia] || '';
      if(!x) return `<td></td><td></td><td>${loc}</td>`;
      hubo = true; jugados.push(p);
      tot[c.id].gf += Number(p.golesFavor)||0; tot[c.id].gc += Number(p.golesContra)||0;
      ptsClub += {G:3, E:1, P:0}[x]; ptsRival += {G:0, E:1, P:3}[x];
      return `<td class="celda-${x}">${p.golesFavor ?? ''}</td><td class="celda-${x}">${p.golesContra ?? ''}</td><td>${loc}</td>`;
    }).join('');
    ptsClubTot += ptsClub; ptsRivalTot += ptsRival;
    return `<tr><td>${f}</td><td>${esc(fechaCorta(dia))}</td><td>${esc(rival)}</td>${celdas}<td>${hubo ? `<b>${ptsClub}</b> - ${ptsRival}` : ''}</td></tr>`;
  }).join('');
  const r = resumenEquipo(jugados);
  return `
  <div class="card">
    <h2>Fixture general — ${esc(grupo.nombre)} ${esc(temporadaActual)}</h2>
    <div class="fila-form">
      ${grupos.length > 1 ? `<select onchange="cambiarFixture(this.value, '')">${grupos.map(g=>`<option value="${g.id}" ${g.id===grupo.id?'selected':''}>${esc(g.nombre)}</option>`).join('')}</select>` : ''}
      <select onchange="cambiarFixture('${grupo.id}', this.value)"><option value="">Todas las competencias</option>${comps.map(c=>`<option value="${esc(c)}" ${c===comp?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${kpisHTML(r)}
    <table>
      <thead>
        <tr><th rowspan="2">Fecha</th><th rowspan="2">Día</th><th rowspan="2">Rival</th>${cats.map(c=>`<th colspan="3" style="text-align:center;">${esc(c.nombre)}</th>`).join('')}<th rowspan="2">Jornada</th></tr>
        <tr>${cats.map(()=>'<th>GF</th><th>GC</th><th>L/V</th>').join('')}</tr>
      </thead>
      <tbody>${filas || `<tr><td colspan="${4 + cats.length*3}">Sin partidos cargados.</td></tr>`}</tbody>
      ${filas ? `<tfoot><tr><th colspan="3">Totales</th>${cats.map(c=>`<th>${tot[c.id].gf}</th><th>${tot[c.id].gc}</th><th></th>`).join('')}<th>${ptsClubTot} - ${ptsRivalTot}</th></tr></tfoot>` : ''}
    </table>
  </div>`;
}

// ---------- Reportes (todo el club) ----------
let _refsReportes = [];
function renderReportes(){
  const sec = document.getElementById('vistaReportes');
  sec.classList.remove('oculto');
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver esto.</p>'; return; }
  const d = {plantel:{}, contratos:{}, prestamos:{}};
  suscribirRefs(_refsReportes, Object.keys(d).flatMap(k=> paresPorCategoria(k, v=>{ d[k]=v; sec.innerHTML = reportesHTML(d); })));
}
function cambiarFiltroReporte(campo, valor){ filtrosReportes[campo] = valor; renderVistaActual(); }

function reportesHTML(d){
  const f = filtrosReportes;
  const hoy = hoyISO();
  const jugadorDe = (c, id) => d.plantel[c]?.[id] || {};
  const inp = (campo, titulo) => `<input type="date" title="${titulo}" value="${esc(f[campo])}" onchange="cambiarFiltroReporte('${campo}', this.value)">`;

  const liberados = [];
  Object.entries(d.plantel).forEach(([c, pl])=> Object.values(pl||{}).forEach(j=>{
    const fl = j.fechaLiberado || '';
    if(!j.archivado) return;
    if(f.libDesde && fl < f.libDesde) return;
    if(f.libHasta && (!fl || fl > f.libHasta)) return;
    if(f.libPos && j.posicion !== f.libPos) return;
    liberados.push({c, j});
  }));
  liberados.sort((a,b)=> (b.j.fechaLiberado||'').localeCompare(a.j.fechaLiberado||''));

  const contratos = [];
  Object.entries(d.contratos).forEach(([c, cs])=> Object.values(cs||{}).forEach(k=>{
    if(f.conDesde && (k.fechaFin||'') < f.conDesde) return;
    if(f.conHasta && (k.fechaFin||'') > f.conHasta) return;
    contratos.push({c, k, j: jugadorDe(c, k.jugadorId)});
  }));
  contratos.sort((a,b)=> (a.k.fechaFin||'').localeCompare(b.k.fechaFin||''));

  const prestamos = [];
  Object.entries(d.prestamos).forEach(([c, ps])=> Object.values(ps||{}).forEach(p=>{
    if(!p.fechaFin || p.fechaFin >= hoy) prestamos.push({c, p, j: jugadorDe(c, p.jugadorId)});
  }));

  return `
  <div class="card">
    <h2>Jugadores liberados / archivados</h2>
    <div class="fila-form">
      ${inp('libDesde', 'Liberado desde')} ${inp('libHasta', 'Liberado hasta')}
      <select onchange="cambiarFiltroReporte('libPos', this.value)"><option value="">Todas las posiciones</option>${CLUB.posiciones.map(p=>`<option value="${esc(p.codigo)}" ${f.libPos===p.codigo?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
    </div>
    <table>
      <thead><tr><th>Jugador</th><th>Categoría</th><th>Posición</th><th>Edad</th><th>Nacionalidad</th><th>Fecha liberado</th></tr></thead>
      <tbody>${liberados.map(({c,j})=>`<tr><td>${esc(nombreCompleto(j))}</td><td>${esc(nombreCategoria(c))}</td><td>${esc(nombrePosicion(j.posicion))}</td>
        <td>${edadDe(j.fechaNacimiento)}</td><td>${esc(j.nacionalidad)}</td><td>${esc(fechaCorta(j.fechaLiberado, true))}</td></tr>`).join('')
        || '<tr><td colspan="6">Sin jugadores liberados con esos filtros.</td></tr>'}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>Jugadores con contrato</h2>
    <div class="fila-form">${inp('conDesde', 'Fin de contrato desde')} ${inp('conHasta', 'Fin de contrato hasta')}</div>

// ---------- Plantel ----------
let _refsPlantel = [];
function renderPlantel(){
  const sec = document.getElementById('vistaPlantel');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let plantelDatos = {}, lesionesDatos = {}, contratosDatos = {}, prestamosDatos = {}, multimediaDatos = {}, informesDatos = {};
  const rerender = ()=>{
    sec.innerHTML = plantelHTML(plantelDatos)
      + lesionesHTML(plantelDatos, lesionesDatos)
      + contratosHTML(plantelDatos, contratosDatos)
      + prestamosHTML(plantelDatos, prestamosDatos)
      + multimediaHTML(plantelDatos, multimediaDatos)
      + informesHTML(plantelDatos, informesDatos);
    const abierta = fichaAbierta[cat];
    if(abierta && plantelDatos[abierta]) cargarHistorialJugador(abierta);
  };
  suscribirRefs(_refsPlantel, [
    ['plantel/'+cat, v=>{ plantelDatos=v; rerender(); }],
    ['lesiones/'+cat, v=>{ lesionesDatos=v; rerender(); }],
    ['contratos/'+cat, v=>{ contratosDatos=v; rerender(); }],
    ['prestamos/'+cat, v=>{ prestamosDatos=v; rerender(); }],
    ['multimedia/'+cat, v=>{ multimediaDatos=v; rerender(); }],
    ['informes/'+cat, v=>{ informesDatos=v; rerender(); }],
  ]);
}

      (verArchivados || !j.archivado)
      && (!f.nombre || sinAcentos(nombreCompleto(j)).includes(sinAcentos(f.nombre)))
      && (!f.pos || j.posicion === f.pos)
      && (!f.edadMax || (j.fechaNacimiento && edadDe(j.fechaNacimiento) <= Number(f.edadMax)))
      && (!f.valoracion || j.valoracion === f.valoracion))

// Pase de categoría (ej. cambio de temporada): se mueve el jugador con el
// mismo id y todos sus registros, en una sola escritura multi-ruta. Las
// convocatorias quedan donde se jugó cada partido, con el nombre guardado
// para que se sigan leyendo desde la categoría vieja.
async function pasarJugadores(){
  const origen = categoriaActual;
  const destino = document.getElementById('paseDestino').value;
  const ids = [...document.querySelectorAll('.chkPase:checked')].map(e=>e.value);
  if(!ids.length){ alert('Marcá al menos un jugador.'); return; }
  if(!puedeEditar(destino)){ alert('Tu rol no puede editar la categoría destino.'); return; }
  if(!confirm(`¿Pasar ${ids.length} jugador(es) de ${nombreCategoria(origen)} a ${nombreCategoria(destino)}? Se mueven también sus datos médicos, contratos, préstamos, multimedia e informes.`)) return;
  const leer = n => dbRef(n+'/'+origen).once('value').then(s=>s.val()||{});
  const plantel = await leer('plantel');
  const up = {};
  ids.forEach(id=>{ up[`plantel/${destino}/${id}`] = plantel[id]; up[`plantel/${origen}/${id}`] = null; });
  for(const nodo of NODOS_POR_JUGADOR){
    Object.entries(await leer(nodo)).forEach(([rid, r])=>{
      if(!ids.includes(r.jugadorId)) return;
      up[`${nodo}/${destino}/${rid}`] = r;
      up[`${nodo}/${origen}/${rid}`] = null;
    });
  }
  for(const t of temporadasLista){
    const convs = (await db.ref(`temporadas/${t}/convocatorias/${origen}`).once('value')).val() || {};
    Object.entries(convs).forEach(([fecha, conv])=> ids.forEach(id=>{
      if(conv?.[id] && !conv[id].jugador) up[`temporadas/${t}/convocatorias/${origen}/${fecha}/${id}/jugador`] = nombreCompleto(plantel[id]);
    }));
  }
  db.ref().update(up);
}

// Recorre las convocatorias de TODAS las categorías: un jugador que pasó de
// categoría conserva su historial completo (el id no cambia con el pase).
function cargarHistorialJugador(id){
  const leer = (t, nodo) => Promise.all(categoriasVisibles().map(c=>
    db.ref(`temporadas/${t}/${nodo}/${c.id}`).once('value').then(s=>[c.id, s.val()||{}]))).then(Object.fromEntries);
  Promise.all(temporadasLista.map(t=> Promise.all([leer(t, 'convocatorias'), leer(t, 'partidos')]))).then(porTemporada=>{
    const el = document.getElementById('historial_'+id);
    if(el) el.innerHTML = historialJugadorHTML(id, temporadasLista.map((t,i)=>({t, convs: porTemporada[i][0], partidos: porTemporada[i][1]})));
  });
  cargarGpsJugador(id);
}

// Estado del jugador en cada partido de su categoría (como la ficha de Tigre).
function estadoEnFecha(p, conv, id){
  if(p.resultado === 'No Disputado') return 'No disputado';
  if(!desenlace(p)) return 'Por jugar';
  if(!conv) return 'Sin convocatoria';
  const c = conv[id];
  if(!c) return 'No citado';
  if(c.titular) return 'Titular';
  return (Number(c.minutos)||0) > 0 ? 'Entró' : 'No ingresó';
}

function historialJugadorHTML(id, temporadas){
  const filas = [], resumen = {};
  temporadas.forEach(({t, convs, partidos})=>{
    // Categorías donde figura en alguna convocatoria de esa temporada, más la
    // actual si es la temporada activa (para ver también donde no fue citado).
    const cats = new Set(Object.keys(convs).filter(cat=> Object.values(convs[cat] || {}).some(conv=> conv?.[id])));
    if(t === temporadaActiva && fichaAbierta[categoriaActual] === id) cats.add(categoriaActual);
    cats.forEach(cat=> Object.entries(partidos[cat] || {}).forEach(([fecha, p])=>{
      const conv = convs[cat]?.[fecha];
      const c = conv?.[id];
      const estado = estadoEnFecha(p, conv, id);
      filas.push({t, cat, fecha, p, c: c || {}, estado});
      const k = `${t} · ${nombreCategoria(cat)} — ${p.competencia || 'Sin competencia'}`;
      const x = resumen[k] || (resumen[k] = {conv:0, jug:0, tit:0, noCit:0, min:0, goles:0, asist:0, ta:0, tr:0});
      if(estado === 'No citado') x.noCit++;
      if(!c) return;
      x.conv++; if(c.titular) x.tit++;
      if(estado === 'Titular' || estado === 'Entró') x.jug++;
      x.min += Number(c.minutos)||0; x.goles += Number(c.goles)||0; x.asist += Number(c.asistencias)||0;
      if(c.amarilla) x.ta++; if(c.roja) x.tr++;
    }));
  });
  if(!filas.length) return 'Todavía no hay partidos de su categoría ni convocatorias donde figure.';
  filas.sort((a,b)=> b.t.localeCompare(a.t) || a.cat.localeCompare(b.cat) || (+a.fecha) - (+b.fecha));
  return `
    <table>
      <thead><tr><th>Temporada · categoría / competencia</th><th>Conv.</th><th>Jugó</th><th>Titular</th><th>No citado</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th></tr></thead>
      <tbody>${Object.entries(resumen).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.conv}</td><td>${x.jug}</td><td>${x.tit}</td><td>${x.noCit}</td><td>${x.min}</td><td>${x.goles}</td><td>${x.asist}</td><td>${x.ta}</td><td>${x.tr}</td></tr>`).join('')}</tbody>
    </table>
    <table>
      <thead><tr><th>Temporada</th><th>Categoría</th><th>Fecha</th><th>Rival</th><th>Resultado</th><th>Estado</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th></tr></thead>
      <tbody>${filas.map(({t, cat, fecha, p, c, estado})=>`<tr>
        <td>${esc(t)}</td><td>${esc(nombreCategoria(cat))}</td><td>${fecha}${p.fechaPartido ? ' ('+esc(fechaCorta(p.fechaPartido))+')' : ''}</td><td>${esc(p.rival)}</td>
        <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''} ${badge(desenlace(p))}</td><td><span class="estado estado-${sinAcentos(estado).replace(/ /g, '-')}">${estado}</span></td>
        <td>${c.minutos ?? ''}</td><td>${c.goles||''}</td><td>${c.asistencias||''}</td><td>${c.amarilla?'Sí':''}</td><td>${c.roja?'Sí':''}</td></tr>`).join('')}</tbody>
    </table>`;
}

// ---------- Datos médicos (consultas y lesiones) ----------
// Registros viejos sin tipoConsulta se toman como 'Médica' (eran solo lesiones).
const esLesion = l => (l.tipoConsulta || 'Médica') === 'Médica';
const lesionActiva = l => esLesion(l) && !l.fechaRecuperacion;
function diasEntre(desde, hasta){
  if(!desde) return null;
  const d1 = new Date(desde+'T00:00:00'), d2 = hasta ? new Date(hasta+'T00:00:00') : new Date();
  return Math.round((d2-d1)/86400000);
}
function opcionesSelect(lista, valor){
  return ['', ...lista].map(o=>`<option value="${esc(o)}" ${o===(valor||'')?'selected':''}>${esc(o)||'—'}</option>`).join('');
}

      const detalle = [l.tipoLesion, l.causa, l.mecanismo, l.registro, l.tratamientoInicial,

    <tr${lesionActiva(l)?' style="background:#2a1416;"':''}>

      <td>${lesion ? (editar ? `<select onchange="dbRef('${ruta}/estadoTratamiento').set(this.value||null)">${opcionesSelect(ESTADOS_TRATAMIENTO, l.estadoTratamiento)}</select>` : esc(l.estadoTratamiento)) : ''}</td>

      <input id="lLink" placeholder="Link del informe">
      <input id="lObs" placeholder="Observaciones">
    </div>
    <div id="lCamposLesion">
      <div class="fila-form">
        ${sel('lDiagnostico', LESION.diagnostico, 'Lesión')}
        ${sel('lTipo', LESION.tipoLesion, 'Tipo de lesión')}
        ${sel('lLocalizacion', LESION.localizacion, 'Localización')}

// ---------- Partidos / Resultados ----------
let _refsPartidos = [];
function renderPartidos(){
  const sec = document.getElementById('vistaPartidos');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let partidosDatos = {}, plantelDatos = {}, convocatoriasDatos = {};
  const rerender = ()=>{ sec.innerHTML = partidosHTML(cat, partidosDatos, plantelDatos, convocatoriasDatos); };
  const pares = [
    ['partidos/'+cat, v=>{ partidosDatos=v; rerender(); }],
    ['plantel/'+cat, v=>{ plantelDatos=v; rerender(); }],
  ];
  const fechaConv = convocatoriaAbiertaFecha[cat];
  if(fechaConv) pares.push(['convocatorias/'+cat, v=>{ convocatoriasDatos=v; rerender(); }]);
  suscribirRefs(_refsPartidos, pares);
}

function partidosHTML(cat, datos, plantel, convocatorias){
  const filas = Object.entries(datos)
    .sort((a,b)=> (+a[0]) - (+b[0]))
    .map(([fecha,p])=>{
      const detalleAbierta = detalleAbiertoFecha[cat] === fecha;
      const convocatoriaAbierta = convocatoriaAbiertaFecha[cat] === fecha;
      let extra = '';
      if(detalleAbierta) extra += `<tr><td colspan="8">${partidoDetalleHTML(fecha,p)}</td></tr>`;
      if(convocatoriaAbierta) extra += `<tr><td colspan="8">${convocatoriaHTML(cat, fecha, plantel, convocatorias[fecha] || {}, situacionTarjetas(convocatorias, datos, fecha))}</td></tr>`;
      return `
      <tr>
        <td>${fecha}</td>
        <td>${esc(fechaCorta(p.fechaPartido))}</td>
        <td>${esc(p.rival)}</td>
        <td>${esc(p.localia)}</td>
        <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''}</td>
        <td>${esc(p.resultado)}</td>
        <td>${esc(p.competencia)}</td>
        <td>
          <button class="secundario" onclick="toggleDetallePartido('${fecha}')">${detalleAbierta?'Cerrar':'Detalle'}</button>
          <button class="secundario" onclick="toggleConvocatoria('${fecha}')">${convocatoriaAbierta?'Cerrar':'Convocatoria'}</button>
          ${puedeEditar()?`<button class="peligro" onclick="borrarPartido('${fecha}')">Borrar</button>`:''}
        </td>
      </tr>${extra}`;
    }).join('');
  return `
  <div class="card">
    <h2>Partidos</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="mFecha" type="number" placeholder="Fecha Nro">
      <input id="mFechaPartido" type="date" title="Día del partido (opcional)">
      <input id="mRival" placeholder="Rival">
      <select id="mLocalia"><option value="Local">Local</option><option value="Visitante">Visitante</option></select>
      <input id="mGF" type="number" placeholder="Goles a favor">
      <input id="mGC" type="number" placeholder="Goles en contra">
      <select id="mResultado"><option>Victoria</option><option>Empate</option><option>Derrota</option><option>No Disputado</option></select>
      <button class="accion" onclick="agregarPartido()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Fecha</th><th>Día</th><th>Rival</th><th>Condición</th><th>Goles</th><th>Resultado</th><th>Competencia</th><th></th></tr></thead>
      <tbody>${filas || '<tr><td colspan="8">Sin partidos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarPartido(){
  const fecha = document.getElementById('mFecha').value;
  if(!fecha) return;
  const p = {
    rival: document.getElementById('mRival').value.trim(),
    localia: document.getElementById('mLocalia').value,
    golesFavor: Number(document.getElementById('mGF').value || 0),
    golesContra: Number(document.getElementById('mGC').value || 0),
    resultado: document.getElementById('mResultado').value
  };
  // Solo si se cargó: este formulario también sirve para corregir una fecha
  // ya cargada y no debe borrar el día que se haya puesto en "Detalle".
  const fechaPartido = document.getElementById('mFechaPartido').value;
  if(fechaPartido) p.fechaPartido = fechaPartido;
  dbRef('partidos/'+categoriaActual+'/'+fecha).update(p);
}

function borrarPartido(fecha){
  if(!confirm('¿Borrar partido?')) return;
  dbRef('partidos/'+categoriaActual+'/'+fecha).remove();
}

function toggleDetallePartido(fecha){
  const cat = categoriaActual;
  detalleAbiertoFecha[cat] = (detalleAbiertoFecha[cat] === fecha) ? null : fecha;
  renderVistaActual();
}

function toggleConvocatoria(fecha){
  const cat = categoriaActual;
  convocatoriaAbiertaFecha[cat] = (convocatoriaAbiertaFecha[cat] === fecha) ? null : fecha;
  renderVistaActual();
}

function guardarDetallePartido(fecha){
  const v = id => document.getElementById(id).value.trim();
  const links = {};
  (CLUB.linksPartido || []).forEach(k=>{
    const val = v('pd_link_'+k+'_'+fecha);
    if(val) links[k] = val;
  });
  const penF = document.getElementById('pd_penF_'+fecha).value;
  const penC = document.getElementById('pd_penC_'+fecha).value;
  dbRef('partidos/'+categoriaActual+'/'+fecha).update({
    fechaPartido: v('pd_fechaPartido_'+fecha),
    competencia: v('pd_competencia_'+fecha),
    arbitro: v('pd_arbitro_'+fecha),
    sistemaTactico: v('pd_sistema_'+fecha),
    penalesFavor: penF === '' ? null : Number(penF),
    penalesContra: penC === '' ? null : Number(penC),
    planConTenencia: v('pd_planCon_'+fecha),
    planSinTenencia: v('pd_planSin_'+fecha),
    descripcion: v('pd_desc_'+fecha),
    links,
  });
}

// ---------- Convocatoria por partido ----------
// Filas = jugadores activos del plantel + cualquiera que ya figure en esta
// convocatoria aunque después se haya archivado o pasado de categoría (si no,
// al re-guardar se borraría su línea de un partido que sí jugó).
function convocatoriaHTML(cat, fecha, plantel, convocatoria, tarjetas){
  const ids = [...new Set([...idsJugadoresActivos(plantel), ...Object.keys(convocatoria)])];
  if(ids.length === 0){
    return `<div class="panel-anidado"><p>Cargá el plantel de esta categoría antes de armar la convocatoria.</p></div>`;
  }
  const nombre = id => plantel[id] ? nombreCompleto(plantel[id]) : (convocatoria[id]?.jugador || '(fuera del plantel)');
  ids.sort((a,b)=> nombre(a).localeCompare(nombre(b)));
  const dis = puedeEditar() ? '' : 'disabled';
  const opcionesSustituto = seleccionado => ids
    .map(id=>`<option value="${id}" ${seleccionado===id?'selected':''}>${esc(nombre(id))}</option>`).join('');
  const convocados = Object.keys(convocatoria).length;
  const filas = ids.map(id=>{
      const c = convocatoria[id] || {};
      return `
      <tr>
        <td>${esc(nombre(id))}${plantel[id] ? '' : ' <span class="tag-rol" style="background:var(--borde);">fuera del plantel</span>'}${avisoTarjetas(tarjetas, id)}</td>
        <td><input type="checkbox" id="cv_convocado_${id}" data-nombre="${esc(nombre(id))}" ${convocatoria[id]?'checked':''} ${dis}></td>
        <td><input type="checkbox" id="cv_titular_${id}" ${c.titular?'checked':''} onchange="if(this.checked) document.getElementById('cv_convocado_${id}').checked=true" ${dis}></td>
        <td><input type="number" id="cv_dorsal_${id}" value="${c.dorsal ?? ''}" style="width:60px;" ${dis}></td>
        <td><input type="number" id="cv_minutos_${id}" value="${c.minutos ?? ''}" style="width:70px;" ${dis}></td>
        <td><input type="number" id="cv_goles_${id}" value="${c.goles ?? ''}" style="width:60px;" ${dis}></td>
        <td><input type="number" id="cv_asistencias_${id}" value="${c.asistencias ?? ''}" style="width:60px;" ${dis}></td>
        <td><input type="checkbox" id="cv_amarilla_${id}" ${c.amarilla?'checked':''} ${dis}></td>
        <td><input type="checkbox" id="cv_roja_${id}" ${c.roja?'checked':''} ${dis}></td>
        <td><input type="date" id="cv_rojaFecha_${id}" value="${esc(c.rojaFechaExpulsion)}" style="width:130px;" ${dis}></td>
        <td><input id="cv_rojaLink_${id}" value="${esc(c.rojaLink)}" placeholder="Link" style="width:100px;" ${dis}></td>
        <td><input id="cv_rojaPdf_${id}" value="${esc(c.rojaPdf)}" placeholder="PDF" style="width:100px;" ${dis}></td>
        <td><input id="cv_rojaObs_${id}" value="${esc(c.rojaObservaciones)}" placeholder="Obs." style="width:110px;" ${dis}></td>
        <td><select id="cv_sustituidoPor_${id}" ${dis}><option value="" ${!c.sustituidoPor?'selected':''}>—</option>${opcionesSustituto(c.sustituidoPor)}</select></td>
        <td><select id="cv_motivo_${id}" ${dis}>${MOTIVOS_CAMBIO.map(m=>`<option value="${m}" ${c.motivoCambio===m?'selected':''}>${m||'—'}</option>`).join('')}</select></td>
        <td><input type="checkbox" id="cv_destacado_${id}" ${c.destacado?'checked':''} ${dis}></td>
      </tr>`;
    }).join('');
  return `
  <div class="panel-anidado">
    <div class="subtitulo">Convocatoria — Fecha ${fecha} (${convocados} convocados)</div>
    <p style="color:#9aa4bd;font-size:.82rem;margin:0 0 6px;">Solo se guardan los jugadores marcados como convocados (marcar Titular también lo marca).</p>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>Jugador</th><th>Conv.</th><th>Titular</th><th>Dorsal</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th>
        <th>F. expulsión</th><th>Link roja</th><th>PDF roja</th><th>Obs. roja</th>
        <th>Sustituido por</th><th>Motivo cambio</th><th>Destacado</th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table>
    </div>
    ${puedeEditar()?`<button class="accion" onclick="guardarConvocatoria('${cat}','${fecha}')" style="margin-top:10px;">Guardar convocatoria</button>`:''}
    <button class="secundario" onclick="exportarCitacionPDF('${cat}','${fecha}')" style="margin-top:10px;">Exportar citación (PDF)</button>
  </div>`;
}

function avisoTarjetas(tarjetas, id){
  if(tarjetas.suspendido[id]) return ` <span class="tag-rol" style="background:var(--rojo);color:#fff;" title="${esc(tarjetas.suspendido[id])}">suspendido</span>`;
  const n = tarjetas.ciclo[id] || 0;
  return n >= tarjetas.alerta ? ` <span class="tag-rol" title="A ${tarjetas.suspension - n} de la suspensión">${n} TA</span>` : '';
}
