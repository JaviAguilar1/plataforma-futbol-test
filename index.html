function exportarCitacionPDF(cat, fecha){
  Promise.all([
    dbRef('plantel/'+cat).once('value'),
    dbRef('convocatorias/'+cat+'/'+fecha).once('value'),
    dbRef('partidos/'+cat+'/'+fecha).once('value'),
  ]).then(([spPlantel, spConv, spPartido])=>{
    const plantel = spPlantel.val() || {};
    const conv = spConv.val() || {};
    const partido = spPartido.val() || {};
    const titulares = [], suplentes = [];
    Object.entries(conv).forEach(([id,c])=>{
      const nombreJ = plantel[id] ? nombreCompleto(plantel[id]) : (c.jugador || '');
      const linea = `${c.dorsal ?? ''} — ${esc(nombreJ)}`;
      (c.titular ? titulares : suplentes).push(linea);
    });
    const firmas = lista => lista.map(l=>`<div class="firma-fila"><span>${l}</span><span>Firma</span></div>`).join('')
      || '<p style="color:#777;">(sin cargar)</p>';
    const html = `
    <h1>${esc(CLUB.club.nombre)} — Citación</h1>
    <p>Fecha <strong>${fecha}</strong> — Rival: <strong>${esc(partido.rival)}</strong> (${esc(partido.localia)})</p>
    <h3>Titulares</h3>${firmas(titulares)}
    <h3>Suplentes</h3>${firmas(suplentes)}`;
    abrirVentanaPDF('Citación F'+fecha, html);
  });
}

function guardarConvocatoria(cat, fecha){
  // Lee los ids directo del DOM ya renderizado (no vuelve a pedir el plantel):
  // un jugador agregado al plantel recién no rompe el guardado.
  const numeroOVacio = v => v === '' ? null : Number(v);
  const out = {};
  document.querySelectorAll('[id^="cv_convocado_"]').forEach(elConv=>{
    const id = elConv.id.slice('cv_convocado_'.length);
    const titular = document.getElementById('cv_titular_'+id).checked;
    if(!elConv.checked && !titular) return;
    out[id] = {
      jugador: elConv.dataset.nombre,
      titular,
      dorsal: numeroOVacio(document.getElementById('cv_dorsal_'+id).value),
      minutos: numeroOVacio(document.getElementById('cv_minutos_'+id).value),
      goles: Number(document.getElementById('cv_goles_'+id).value || 0),
      asistencias: Number(document.getElementById('cv_asistencias_'+id).value || 0),
      amarilla: document.getElementById('cv_amarilla_'+id).checked,
      roja: document.getElementById('cv_roja_'+id).checked,
      rojaFechaExpulsion: document.getElementById('cv_rojaFecha_'+id).value || null,
      rojaLink: document.getElementById('cv_rojaLink_'+id).value.trim() || null,
      rojaPdf: document.getElementById('cv_rojaPdf_'+id).value.trim() || null,
      rojaObservaciones: document.getElementById('cv_rojaObs_'+id).value.trim() || null,
      sustituidoPor: document.getElementById('cv_sustituidoPor_'+id).value || null,
      motivoCambio: document.getElementById('cv_motivo_'+id).value || null,
      destacado: document.getElementById('cv_destacado_'+id).checked,
    };
  });
  dbRef('convocatorias/'+cat+'/'+fecha).set(out);
}

// ---------- Tabla de posiciones ----------
let TABLA_LIGA = null;
async function cargarTablaLiga(forzar){
  if(TABLA_LIGA && !forzar) return TABLA_LIGA;
  try{
    const r = await fetch('data/tablas.json' + (forzar ? '?t='+Date.now() : ''), {cache:'no-store'});
    TABLA_LIGA = r.ok ? await r.json() : {categorias:{}, fixture:{}};
  }catch(e){
    TABLA_LIGA = {categorias:{}, fixture:{}};
  }
  return TABLA_LIGA;
}

async function actualizarTablaLiga(){
  await cargarTablaLiga(true);
  renderVistaActual();
}

let _refsTabla = [];
async function renderTabla(){
  const sec = document.getElementById('vistaTabla');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  const adapter = (CLUB.fuentes?.liga?.adapter) || 'manual';

  if(adapter !== 'manual'){
    suscribirRefs(_refsTabla, []);
    if(temporadaActual !== temporadaActiva){
      sec.innerHTML = '<div class="card"><p>La tabla que trae la liga automáticamente es solo la de la temporada activa.</p></div>';
      return;
    }
    const liga = await cargarTablaLiga();
    const filas = (liga.categorias && liga.categorias[categoriaActual]) || [];
    sec.innerHTML = tablaHTML(filas, adapter);
    return;
  }

  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  suscribirRefs(_refsTabla, [
    ['tablaPosiciones/'+categoriaActual, v=>{ sec.innerHTML = tablaHTML(Array.isArray(v)?v:Object.values(v), adapter); }],
  ]);
}

      <td>${f.pe ?? ''}</td>

    ${esManual ? '' : `<p style="color:#9aa4bd;font-size:.85rem;">
        Esta tabla se trae sola desde <code>data/tablas.json</code> (lo genera <code>scripts/scrape_main.py</code>

function agregarFilaTabla(){
  const fila = {
    equipo: document.getElementById('tEquipo').value.trim(),
    pj: Number(document.getElementById('tPj').value||0),
    pg: Number(document.getElementById('tPg').value||0),
    pe: Number(document.getElementById('tPe').value||0),
    pp: Number(document.getElementById('tPp').value||0),
    gf: Number(document.getElementById('tGf').value||0),
    gc: Number(document.getElementById('tGc').value||0),
    pts: Number(document.getElementById('tPts').value||0)
  };
  if(!fila.equipo) return;
  const ref = dbRef('tablaPosiciones/'+categoriaActual);
  ref.once('value').then(snap=>{
    const actual = snap.val() || [];
    actual.push(fila);
    ref.set(actual);
  });
}

function borrarFilaTabla(i){
  if(!confirm('¿Borrar fila?')) return;
  const ref = dbRef('tablaPosiciones/'+categoriaActual);
  ref.once('value').then(snap=>{
    const actual = snap.val() || [];
    actual.splice(i,1);
    ref.set(actual);
  });
}

// ---------- Confiabilidad (carga manual vs. fuente automática de liga) ----------
let _refsConfiabilidad = [];
async function renderConfiabilidad(){
  const sec = document.getElementById('vistaConfiabilidad');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver esto.</p>'; return; }
  if(temporadaActual !== temporadaActiva){
    sec.innerHTML = '<div class="card"><p>La comparación con la liga solo aplica a la temporada activa.</p></div>';
    return;
  }
  const cat = categoriaActual;
  const liga = await cargarTablaLiga();
  const fixtureLiga = (liga.fixture && liga.fixture[cat]) || [];
  const tablaLiga = (liga.categorias && liga.categorias[cat]) || [];
  let partidosManual = {}, omitidos = {};
  const render = ()=>{ sec.innerHTML = confiabilidadHTML(cat, partidosManual, fixtureLiga, tablaLiga, omitidos); };
  suscribirRefs(_refsConfiabilidad, [
    ['partidos/'+cat, v=>{ partidosManual=v; render(); }],
    ['recordatoriosOmitidos/'+cat, v=>{ omitidos=v; render(); }],
  ]);
}

function compararResultado(fecha, manual, liga){
  if(!liga || liga.resultado == null) return null; // la liga todavía no tiene el resultado, nada que comparar
  if(!manual || manual.golesFavor == null){
    return `La liga ya tiene el resultado de la fecha ${fecha} (vs ${esc(liga.rival)}, ${esc(liga.resultado)}) pero no está cargado a mano.`;
  }
  if(manual.golesFavor !== liga.golesFavor || manual.golesContra !== liga.golesContra){
    return `Fecha ${fecha} vs ${esc(liga.rival)}: cargaste ${manual.golesFavor}-${manual.golesContra}, la liga dice ${liga.golesFavor}-${liga.golesContra}.`;
  }
  return null;
}

function calcularTablaPropia(partidosManual){
  let pj=0, pg=0, pe=0, pp=0, gf=0, gc=0;
  Object.values(partidosManual).forEach(p=>{
    if(!p.resultado || p.resultado === 'No Disputado') return;
    pj++;
    gf += p.golesFavor || 0;
    gc += p.golesContra || 0;
    if(p.resultado === 'Victoria') pg++;
    else if(p.resultado === 'Empate') pe++;
    else if(p.resultado === 'Derrota') pp++;
  });
  return {pj, pg, pe, pp, gf, gc, pts: pg*3+pe};
}

function filaLigaDelClub(tablaLiga){
  const nombre = (CLUB.fuentes?.liga?.config?.nombreEquipoEnLiga || CLUB.club.nombre || '').toLowerCase();
  if(!nombre) return null;
  return tablaLiga.find(f=>{
    const equipo = (f.equipo||'').toLowerCase();
    return equipo.includes(nombre) || nombre.includes(equipo);
  }) || null;
}

function recordatoriosLinks(partidosManual, omitidos){
  const tipos = CLUB.linksPartido || [];
  const avisos = [];
  Object.entries(partidosManual).forEach(([fecha,p])=>{
    if(!p.resultado || p.resultado === 'No Disputado') return;
    if(omitidos[fecha]) return;
    const links = p.links || {};
    if(!tipos.some(t=>links[t])) avisos.push({fecha, rival:p.rival});
  });
  return avisos;
}

function omitirRecordatorio(fecha){
  dbRef('recordatoriosOmitidos/'+categoriaActual+'/'+fecha).set(true);
}

function confiabilidadHTML(cat, partidosManual, fixtureLiga, tablaLiga, omitidos){
  const avisosResultados = fixtureLiga
    .map(f=>compararResultado(f.fecha, partidosManual[f.fecha], f))
    .filter(Boolean);

  const propia = calcularTablaPropia(partidosManual);
  const filaLiga = filaLigaDelClub(tablaLiga);
  const difTabla = filaLiga && ['pj','pg','pe','pp','gf','gc'].some(c=>propia[c] !== filaLiga[c]);

  const recordatorios = recordatoriosLinks(partidosManual, omitidos);

  return `
  <div class="card">
    <h2>Confiabilidad</h2>
    <p style="color:#9aa4bd;font-size:.85rem;">
      Cruza lo cargado a mano contra la fuente automática de liga (<code>data/tablas.json</code>).
      Si una sección no muestra nada, es que no encontró ninguna discrepancia.
    </p>

    <div class="subtitulo">Resultados</div>
    ${avisosResultados.length ? `<ul>${avisosResultados.map(m=>`<li>${m}</li>`).join('')}</ul>` : '<p>Sin discrepancias.</p>'}

    <div class="subtitulo">Tabla propia (sumada de los partidos cargados) vs. tabla de la liga</div>
    ${!filaLiga ? '<p style="color:#9aa4bd;">Todavía no se encontró la fila del club en la tabla de la liga (revisá <code>nombreEquipoEnLiga</code> en club.json).</p>'
      : !difTabla ? '<p>Sin discrepancias.</p>' : `
      <table>
        <thead><tr><th></th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th></tr></thead>
        <tbody>
          <tr><td>Carga manual</td><td>${propia.pj}</td><td>${propia.pg}</td><td>${propia.pe}</td><td>${propia.pp}</td><td>${propia.gf}</td><td>${propia.gc}</td></tr>
          <tr><td>Liga (${esc(filaLiga.equipo)})</td><td>${filaLiga.pj}</td><td>${filaLiga.pg}</td><td>${filaLiga.pe}</td><td>${filaLiga.pp}</td><td>${filaLiga.gf}</td><td>${filaLiga.gc}</td></tr>
        </tbody>
      </table>`}

    <div class="subtitulo">Partidos jugados sin ningún link cargado</div>
    ${recordatorios.length ? `<ul>${recordatorios.map(r=>`
      <li>Fecha ${r.fecha} vs ${esc(r.rival)} — sin links.
        ${puedeEditar() ? `<button class="secundario" onclick="omitirRecordatorio('${r.fecha}')">Omitir</button>` : ''}
      </li>`).join('')}</ul>` : '<p>Sin pendientes.</p>'}
  </div>`;
}

// ---------- Recursos (Documentos + Entrenamientos) ----------
let _refsRecursos = [];
function renderRecursos(){
  const sec = document.getElementById('vistaRecursos');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let documentosDatos = {}, entrenamientosDatos = {};
  const rerender = ()=>{
    sec.innerHTML = documentosHTML(documentosDatos) + entrenamientosHTML(entrenamientosDatos);
  };
  suscribirRefs(_refsRecursos, [
    ['documentos/'+cat, v=>{ documentosDatos=v; rerender(); }],
    ['entrenamientos/'+cat, v=>{ entrenamientosDatos=v; rerender(); }],
  ]);
}

function documentosHTML(documentos){
  const filas = Object.entries(documentos)
    .sort((a,b)=> (b[1].fechaDesde||'').localeCompare(a[1].fechaDesde||''))
    .map(([id,d])=>`
    <tr>
      <td>${esc(d.tipo)}</td>
      <td>${esc(d.titulo)}</td>
      <td>${esc(d.microciclo)}</td>
      <td>${esc(d.fechaDesde)}${d.fechaHasta?' a '+d.fechaHasta:''}</td>
      <td>${esc(d.descripcion)}</td>
      <td>${d.url?`<a href="${url(d.url)}" target="_blank">Abrir</a>`:''}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarDocumento('${id}')">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Documentos (Planificación / Proyectos externos / Rendimiento físico)</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <select id="docTipo">${TIPOS_DOCUMENTO.map(t=>`<option>${t}</option>`).join('')}</select>
      <input id="docTitulo" placeholder="Título">
      <input id="docMicrociclo" type="number" placeholder="Microciclo (opcional)">
      <input id="docFechaDesde" type="date" title="Fecha desde">
      <input id="docFechaHasta" type="date" title="Fecha hasta (opcional)">
      <input id="docDescripcion" placeholder="Descripción">
      <input id="docUrl" placeholder="Url">
      <button class="accion" onclick="agregarDocumento()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Tipo</th><th>Título</th><th>Microciclo</th><th>Fecha</th><th>Descripción</th><th>Url</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin documentos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarDocumento(){
  const d = {
    tipo: document.getElementById('docTipo').value,
    titulo: document.getElementById('docTitulo').value.trim(),
    microciclo: document.getElementById('docMicrociclo').value || null,
    fechaDesde: document.getElementById('docFechaDesde').value,
    fechaHasta: document.getElementById('docFechaHasta').value || null,
    descripcion: document.getElementById('docDescripcion').value.trim(),
    url: document.getElementById('docUrl').value.trim(),
  };
  if(!d.titulo) return;
  dbRef('documentos/'+categoriaActual).push(d);
}

function borrarDocumento(id){
  if(!confirm('¿Borrar documento?')) return;
  dbRef('documentos/'+categoriaActual+'/'+id).remove();
}

function entrenamientosHTML(entrenamientos){
  const otrasCatsEditables = CLUB.temporada.categorias.filter(c=> c.id!==categoriaActual && puedeEditar(c.id));
  const filas = Object.entries(entrenamientos)
    .sort((a,b)=> (b[1].fecha||'').localeCompare(a[1].fecha||''))
    .map(([id,e])=>`
    <tr>
      <td>${esc(e.fecha)}</td>
      <td>${esc(e.descripcion)}</td>
      <td>${esc(e.etiquetas)}</td>
      <td>${e.linkCampo?`<a href="${url(e.linkCampo)}" target="_blank">Campo</a>`:''}</td>
      <td>${e.linkArqueros?`<a href="${url(e.linkArqueros)}" target="_blank">Arqueros</a>`:''}</td>
      <td>${e.urlPlanificacion?`<a href="${url(e.urlPlanificacion)}" target="_blank">Planificación</a>`:''}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarEntrenamiento('${id}')">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Entrenamientos</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="entFecha" type="date">
      <input id="entDescripcion" placeholder="Descripción (ej. Semana 18)">
      <input id="entEtiquetas" placeholder="Etiquetas (ej. Impacto, Descarga)">
      <input id="entLinkCampo" placeholder="Link entrenamiento de campo">
      <input id="entLinkArqueros" placeholder="Link entrenamiento de arqueros">
      <input id="entUrlPlanificacion" placeholder="Url planificación">
      <button class="accion" onclick="agregarEntrenamiento()">Agregar</button>
    </div>
    ${otrasCatsEditables.length ? `<div class="fila-form nota"><span style="flex:none;">Cargarlo también en:</span>
      ${otrasCatsEditables.map(c=>`<label style="flex:none;display:inline-flex;gap:4px;align-items:center;"><input type="checkbox" class="chkEntCat" value="${c.id}">${esc(c.nombre)}</label>`).join('')}
    </div>` : ''}`:''}
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Etiquetas</th><th>Campo</th><th>Arqueros</th><th>Planificación</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin entrenamientos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarEntrenamiento(){
  const e = {
    fecha: document.getElementById('entFecha').value,
    descripcion: document.getElementById('entDescripcion').value.trim(),
    etiquetas: document.getElementById('entEtiquetas').value.trim(),
    linkCampo: document.getElementById('entLinkCampo').value.trim(),
    linkArqueros: document.getElementById('entLinkArqueros').value.trim(),
    urlPlanificacion: document.getElementById('entUrlPlanificacion').value.trim(),
  };
  if(!e.fecha) return;
  const cats = [categoriaActual, ...[...document.querySelectorAll('.chkEntCat:checked')].map(x=>x.value)];
  cats.forEach(c=> dbRef('entrenamientos/'+c).push(e));
}

function borrarEntrenamiento(id){
  if(!confirm('¿Borrar entrenamiento?')) return;
  dbRef('entrenamientos/'+categoriaActual+'/'+id).remove();
}

// ---------- Arranque ----------
(async function init(){
  CLUB = await cargarConfigClub();
  aplicarTema(CLUB);
  if((CLUB.fuentes?.liga?.adapter || 'manual') !== 'manual'){
    document.getElementById('navConfiabilidad').classList.remove('oculto');
  }

  if(window.FIREBASE_CONFIG_FALTA || !window.FIREBASE_CONFIG){
    await cargarTemporadas();
    document.getElementById('muro').classList.add('oculto');
    document.getElementById('nav').classList.remove('oculto');
    document.getElementById('avisoConfig').textContent =
      'Falta config/firebase.js con las credenciales reales del club (ver config/README.md). Mostrando solo la config de ejemplo.';
    document.getElementById('avisoConfig').classList.remove('oculto');
    poblarSelectorCategoria();
    renderVistaActual();
    return;
  }

  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.database();
  auth = firebase.auth();
  auth.onAuthStateChanged(onAuthCambio);
})();
</script>
