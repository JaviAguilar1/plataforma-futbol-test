<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Seguimiento de Club</title>
<style>
  :root{
    --fondo:#0b0f17;
    --superficie:#121826;
    --primario:#d4af37;
    --texto:#eef1f6;
    --borde:#273047;
    --rojo:#e5484d;
    --verde:#3ddc84;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;background:var(--superficie);
    border-bottom:2px solid var(--primario);
  }
  header img{height:40px;}
  header h1{font-size:1.2rem;margin:0;flex:1;}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--superficie);}
  nav button{
    background:none;border:1px solid var(--borde);color:var(--texto);
    padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;
  }
  nav button.activo{background:var(--primario);color:#1a1a1a;border-color:var(--primario);font-weight:600;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  select,input,textarea{
    background:var(--fondo);color:var(--texto);border:1px solid var(--borde);
    border-radius:4px;padding:6px 8px;font-size:.9rem;
  }
  button.accion{
    background:var(--primario);color:#1a1a1a;border:none;border-radius:4px;
    padding:7px 14px;cursor:pointer;font-weight:600;
  }
  button.secundario{
    background:none;border:1px solid var(--borde);color:var(--texto);
    border-radius:4px;padding:7px 12px;cursor:pointer;
  }
  button.peligro{background:var(--rojo);color:#fff;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.88rem;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--borde);text-align:left;}
  th{color:var(--primario);}
  .card{background:var(--superficie);border:1px solid var(--borde);border-radius:8px;padding:16px;margin-bottom:18px;}
  .fila-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;}
  .fila-form > *{flex:1;min-width:110px;}
  .oculto{display:none !important;}
  .aviso{background:#2a2110;border:1px solid var(--primario);border-radius:6px;padding:12px;margin-bottom:14px;font-size:.9rem;}
  .login-box{max-width:340px;margin:60px auto;text-align:center;}
  .login-box input{width:100%;margin-bottom:10px;}
  .tag-rol{font-size:.75rem;background:var(--primario);color:#1a1a1a;padding:2px 8px;border-radius:10px;}
  footer{text-align:center;color:#687089;font-size:.78rem;padding:30px 10px;}
  textarea{width:100%;resize:vertical;}
  .subtitulo{color:var(--primario);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
  .subtitulo:first-child{margin-top:0;}
  .panel-anidado{background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:14px;margin:0;}
  .panel-anidado .fila-form label{flex:none;width:150px;color:#9aa4bd;font-size:.85rem;}
  .card{overflow-x:auto;}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
  .kpi{flex:1;min-width:90px;background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:10px;text-align:center;font-size:.8rem;color:#9aa4bd;}
  .kpi b{display:block;font-size:1.5rem;color:var(--primario);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:18px;}
  .grid2 .card{margin-bottom:0;}
  .res{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-weight:700;font-size:.78rem;padding:1px 4px;color:#111;}
  .res-G{background:var(--verde);} .res-E{background:#c9b458;} .res-P{background:var(--rojo);color:#fff;}
  td.celda-G{color:var(--verde);} td.celda-E{color:#c9b458;} td.celda-P{color:var(--rojo);}
  .nota{color:#9aa4bd;font-size:.82rem;margin:0 0 6px;}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--rojo);color:#fff;padding:10px 16px;border-radius:6px;z-index:10;max-width:90vw;font-size:.9rem;}
  @media (max-width:600px){ main{padding:12px;} header{padding:10px 12px;} nav{padding:8px 12px;} }
</style>
</head>
<body>

<header>
  <img id="escudo" class="oculto">
  <h1 id="nombreClub">Cargando...</h1>
  <span id="estadoSesion"></span>
</header>

<nav id="nav">
  <button data-vista="inicio" class="activo">Inicio</button>
  <button data-vista="plantel">Plantel</button>
  <button data-vista="partidos">Partidos</button>
  <button data-vista="estadisticas">Estadísticas</button>
  <button data-vista="fixture">Fixture general</button>
  <button data-vista="tabla">Tabla de posiciones</button>
  <button data-vista="confiabilidad" id="navConfiabilidad" class="oculto">Confiabilidad</button>
  <button data-vista="recursos">Recursos</button>
  <button data-vista="reportes">Reportes</button>
</nav>

<main>
  <div id="avisoConfig" class="aviso oculto"></div>

  <div class="fila-form oculto" id="selectorCategoriaWrap">
    <label style="flex:none;">Categoría</label>
    <select id="selectorCategoria"></select>
  </div>

  <section id="vistaInicio"></section>
  <section id="vistaPlantel" class="oculto"></section>
  <section id="vistaPartidos" class="oculto"></section>
  <section id="vistaEstadisticas" class="oculto"></section>
  <section id="vistaFixture" class="oculto"></section>
  <section id="vistaReportes" class="oculto"></section>
  <section id="vistaTabla" class="oculto"></section>
  <section id="vistaConfiabilidad" class="oculto"></section>
  <section id="vistaRecursos" class="oculto"></section>

  <div id="vistaLogin" class="login-box oculto">
    <h2>Ingresar</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Contraseña">
    <button class="accion" onclick="hacerLogin()">Ingresar</button>
    <p id="loginError" style="color:var(--rojo);font-size:.85rem;"></p>
  </div>
</main>

<div id="toast" class="oculto"></div>
<footer>Plantilla genérica de seguimiento de club — instancia propia, sin datos compartidos con otros clubes.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config/firebase.js" onerror="window.FIREBASE_CONFIG_FALTA=true"></script>
<script>
let CLUB = null;
let db = null;
let auth = null;
let usuario = null;
let rolActual = null;
let categoriaActual = null;
let vistaActual = 'inicio';

let fichaAbierta = {};              // categoriaId -> jugadorId con la ficha completa abierta
let detalleAbiertoFecha = {};       // categoriaId -> fecha con el detalle del partido abierto
let convocatoriaAbiertaFecha = {};  // categoriaId -> fecha con la convocatoria abierta
const MOTIVOS_CAMBIO = ['', 'Táctico', 'Lesión', 'Fatiga', 'Disciplina'];
const VALORACIONES = ['', 'Excelente', 'Muy buena', 'Buena', 'Regular'];
const TIPOS_PRESTAMO = ['Préstamo a otro club', 'Convocatoria a selección'];
const TIPOS_DOCUMENTO = ['Planificación', 'Proyecto externo', 'Rendimiento físico'];
const TIPOS_CONSULTA = ['Médica', 'Física', 'Nutrición', 'Desarrollo humano', 'Entrenamiento', 'Entrenamiento general', 'División'];
const LESION = {
  registro: ['Lesión deportiva en la institución', 'Lesión deportiva fuera de la institución', 'Trastorno no lesional', 'Otra'],
  causa: ['Traumática', 'No traumática', 'Otra'],
  tipoLesion: ['Articular (ligamentaria / escapular)', 'Muscular', 'Ósea', 'Tendinosa', 'Otra'],
  localizacion: ['Abdomen', 'Cabeza / Cara', 'Cadera / Ingle', 'Columna baja / Pelvis / Sacro', 'Cuello / Columna cervical',
    'Esternón / Costillas / Columna superior', 'Hombro / Clavícula', 'Mano / Dedo / Pulgar', 'Muñeca', 'Muslo', 'Pie / Dedo',
    'Pierna / Tendón de Aquiles', 'Rodilla', 'Tobillo', 'Otra'],
  diagnostico: ['Conmoción', 'Contusión / Hematoma', 'Esguince / Ligamentaria', 'Fractura', 'Laceración',
    'Lesión por sobreuso no específica', 'Luxación / Subluxación', 'Meniscal / Cartilaginosa', 'Nerviosa',
    'Ruptura muscular / Desgarro', 'Sinovitis', 'Tendinopatía', 'Otra lesión ósea', 'Otra'],
  severidad: ['Leve (0 días de reposo) / Consulta', 'Mínima (1-3 días de reposo)', 'Media (4-7 días de reposo)',
    'Moderada (8-28 días de reposo)', 'Severa (más de 28 días de reposo)', 'Otra'],
  mecanismo: ['Barriendo / Tackling', 'Cabezazo', 'Caída', 'Carrera / Sprint', 'Choque / Colisión', 'Deslizamiento',
    'Elongación / Stretching', 'Giro / Pivot', 'Golpe por pelota', 'Obstrucción', 'Pase', 'Patada',
    'Recibiendo barrida / Tackle', 'Regate / Dribbling', 'Remate', 'Salto / Aterrizaje', 'Sobreuso', 'Uso del brazo / Codo', 'Otro'],
  tratamientoInicial: ['Inmovilizador', 'Conservador (continúa diferenciado / disminuye carga)', 'Quirúrgico', 'Otro'],
  reincidencia: ['No', 'Sí', 'Desconocido'],
};
const ESTADOS_TRATAMIENTO = ['En tratamiento', 'Readaptación', 'Alta'];
const TIPOS_INFORME = ['Trimestral', 'Final', 'Captación'];
let notasPrestamoAbierto = {}; // categoriaId -> prestamoId con las notas abiertas
const SISTEMAS_TACTICOS = ['1-4-4-2', '1-4-3-3', '1-4-2-3-1', '1-4-1-4-1', '1-4-4-1-1', '1-4-1-3-2', '1-4-2-1-3', '1-3-5-2', '1-3-4-3', '1-3-4-1-2', '1-5-3-2', '1-5-4-1'];
let mostrarArchivados = {}; // categoriaId -> bool
let filtrosPlantel = {};     // categoriaId -> {nombre, pos, edadMax, valoracion}
let filtroCompetencia = {};  // categoriaId -> competencia elegida en Estadísticas
let fixtureGrupo = null, fixtureCompetencia = '';
let filtrosReportes = {libDesde:'', libHasta:'', libPos:'', conDesde:'', conHasta:''};
const NODOS_POR_JUGADOR = ['lesiones', 'contratos', 'prestamos', 'multimedia', 'informes'];

// Todo dato cargado por usuarios pasa por esc() antes de ir a innerHTML: sin
// esto, un texto con comillas se corta dentro de value="..." y al re-guardar
// se pierde el resto.
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function url(u){
  u = String(u ?? '').trim();
  if(!u) return '';
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return /^https?:/i.test(u) ? esc(u) : '';
  return esc('https://'+u);
}

function fechaCorta(iso, anioCompleto){
  if(!iso) return '';
  const [a,m,d] = String(iso).split('-');
  return d ? `${d}-${m}-${anioCompleto ? a : a.slice(2)}` : iso;
}
function hoyISO(desplazamientoMeses){
  const h = new Date();
  if(desplazamientoMeses) h.setMonth(h.getMonth() + desplazamientoMeses);
  return new Date(h.getTime() - h.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function edadDe(fechaNac){
  if(!fechaNac) return '';
  const n = new Date(fechaNac+'T00:00:00'), h = new Date();
  let e = h.getFullYear() - n.getFullYear();
  if(h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) e--;
  return e;
}
function nombreCategoria(id){ return CLUB.temporada.categorias.find(c=>c.id===id)?.nombre || id; }
const sinAcentos = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function nombreCompleto(j){ return j ? `${j.apellido||''}, ${j.nombre||''}` : ''; }

// Al cambiar de vista se apagan los listeners de todas las demás (si no,
// vistas ocultas siguen bajando datos de Firebase en cada cambio).
const _listasRefs = new Set();
function apagarSuscripciones(){
  _listasRefs.forEach(lista=>{ lista.forEach(r=>r.ref.off('value', r.cb)); lista.length = 0; });
}
// Sin esto, un guardado rechazado por Firebase (rol sin permiso, reglas
// desactualizadas) fallaba en silencio y el usuario creía que se había guardado.
window.addEventListener('unhandledrejection', e=>{
  if(/PERMISSION_DENIED/i.test(String(e.reason?.message || e.reason))){
    mostrarToast('No se pudo guardar: la base de datos rechazó el cambio por permisos. Revisá tu rol o las reglas de Firebase.');
  }
});
let _toastTimer = null;
function mostrarToast(texto){
  const el = document.getElementById('toast');
  el.textContent = texto;
  el.classList.remove('oculto');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.add('oculto'), 7000);
}

function suscribirRefs(listaRefs, pares){
  _listasRefs.add(listaRefs);
  listaRefs.forEach(r=>r.ref.off('value', r.cb));
  listaRefs.length = 0;
  pares.forEach(([ruta, onDato])=>{
    const ref = db.ref(ruta);
    const cb = snap => onDato(snap.val() || {});
    ref.on('value', cb);
    listaRefs.push({ref, cb});
  });
}

async function cargarConfigClub(){
  try{
    const r = await fetch('config/club.json', {cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){}
  const rEj = await fetch('config/club.example.json', {cache:'no-store'});
  return await rEj.json();
}

function aplicarTema(club){
  const c = club.club.colores || {};
  const root = document.documentElement.style;
  if(c.fondo) root.setProperty('--fondo', c.fondo);
  if(c.superficie) root.setProperty('--superficie', c.superficie);
  if(c.primario) root.setProperty('--primario', c.primario);
  if(c.texto) root.setProperty('--texto', c.texto);
  document.getElementById('pageTitle').textContent = club.club.nombre;
  document.getElementById('nombreClub').textContent = club.club.nombre;
  if(club.club.escudoUrl){
    const img = document.getElementById('escudo');
    img.src = club.club.escudoUrl;
    img.classList.remove('oculto');
  }
}

function poblarSelectorCategoria(){
  const sel = document.getElementById('selectorCategoria');
  sel.innerHTML = '';
  CLUB.temporada.categorias.forEach(cat=>{
    const op = document.createElement('option');
    op.value = cat.id; op.textContent = cat.nombre;
    sel.appendChild(op);
  });
  categoriaActual = CLUB.temporada.categorias[0]?.id || null;
  sel.value = categoriaActual;
  sel.onchange = ()=>{ categoriaActual = sel.value; renderVistaActual(); };
  document.getElementById('selectorCategoriaWrap').classList.remove('oculto');
}

function rolDe(id){
  return (CLUB.roles || []).find(r => (typeof r === 'string' ? r : r.id) === id);
}

function puedeEditar(catId){
  if(!rolActual) return false;
  const rol = rolDe(rolActual);
  if(!rol) return false;
  if(typeof rol === 'string') return true;
  if(!rol.categorias || rol.categorias === 'todas') return true;
  return rol.categorias.includes(catId || categoriaActual);
}

function esAdmin(){
  const primero = (CLUB.roles || [])[0];
  if(!primero) return false;
  return rolActual === (typeof primero === 'string' ? primero : primero.id);
}

// ---------- Auth ----------
function hacerLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    document.getElementById('loginError').textContent = 'No se pudo ingresar: ' + err.message;
  });
}
function hacerLogout(){ auth.signOut(); }

function onAuthCambio(user){
  usuario = user;
  if(!user){
    rolActual = null;
    actualizarEstadoSesion();
    renderVistaActual();
    return;
  }
  db.ref('users/'+user.uid+'/role').once('value').then(snap=>{
    rolActual = snap.val();
    actualizarEstadoSesion();
    renderVistaActual();
  });
}

function actualizarEstadoSesion(){
  const el = document.getElementById('estadoSesion');
  if(usuario){
    const rol = rolActual ? rolDe(rolActual) : null;
    const nombreRol = rol ? (typeof rol === 'string' ? rol : rol.nombre) : rolActual;
    el.innerHTML = (rolActual ? `<span class="tag-rol">${esc(nombreRol)}</span> ` : '')
      + usuario.email + ' <button class="secundario" onclick="hacerLogout()">Salir</button>';
  } else {
    el.innerHTML = '<button class="secundario" onclick="mostrarLogin()">Ingresar</button>';
  }
}

function mostrarLogin(){
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('oculto'));
  document.getElementById('selectorCategoriaWrap').classList.add('oculto');
  document.getElementById('vistaLogin').classList.remove('oculto');
}

// ---------- Navegación ----------
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-vista]');
  if(!btn) return;
  vistaActual = btn.dataset.vista;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('activo', b===btn));
  document.getElementById('vistaLogin').classList.add('oculto');
  document.getElementById('selectorCategoriaWrap').classList.remove('oculto');
  renderVistaActual();
});

const VISTAS_DE_TODO_EL_CLUB = ['fixture', 'reportes'];
function renderVistaActual(){
  apagarSuscripciones();
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('oculto'));
  document.getElementById('vistaLogin').classList.add('oculto');
  document.getElementById('selectorCategoriaWrap').classList.toggle('oculto', VISTAS_DE_TODO_EL_CLUB.includes(vistaActual));
  ({
    inicio: renderInicio, plantel: renderPlantel, partidos: renderPartidos, estadisticas: renderEstadisticas,
    fixture: renderFixture, tabla: renderTabla, confiabilidad: renderConfiabilidad, recursos: renderRecursos,
    reportes: renderReportes,
  })[vistaActual]();
}

// ---------- Cálculos compartidos (Inicio / Estadísticas / Fixture / ficha) ----------
// G/E/P sale del campo "resultado" que se elige a mano; si no está, de los goles.
function desenlace(p){
  if(!p) return null;
  const r = {Victoria:'G', Empate:'E', Derrota:'P'}[p.resultado];
  if(r) return r;
  if(p.resultado === 'No Disputado' || p.golesFavor == null || p.golesContra == null) return null;
  return p.golesFavor > p.golesContra ? 'G' : p.golesFavor < p.golesContra ? 'P' : 'E';
}
function resumenEquipo(lista){
  const r = {pj:0, g:0, e:0, p:0, gf:0, gc:0};
  lista.forEach(p=>{
    const x = desenlace(p);
    if(!x) return;
    r.pj++; r[x.toLowerCase()]++;
    r.gf += Number(p.golesFavor)||0; r.gc += Number(p.golesContra)||0;
  });
  r.pts = r.g*3 + r.e;
  r.pct = r.pj ? (r.pts*100/(r.pj*3)).toFixed(1) : '0.0';
  return r;
}
function kpisHTML(r){
  return `<div class="kpis">${[['Partidos', r.pj], ['Ganados', r.g], ['Empatados', r.e], ['Perdidos', r.p],
    ['Goles a favor', r.gf], ['Goles en contra', r.gc], ['% de puntos', r.pct+'%']]
    .map(([t,v])=>`<div class="kpi"><b>${v}</b>${t}</div>`).join('')}</div>`;
}
function statsJugadores(convocatorias, partidos, competencia){
  const st = {};
  Object.entries(convocatorias||{}).forEach(([fecha, conv])=>{
    if(competencia && (partidos?.[fecha]?.competencia || '') !== competencia) return;
    Object.entries(conv||{}).forEach(([jid,c])=>{
      const x = st[jid] || (st[jid] = {jugador:'', conv:0, tit:0, min:0, goles:0, asist:0, ta:0, tr:0, dest:0});
      if(c.jugador) x.jugador = c.jugador;
      x.conv++; if(c.titular) x.tit++;
      x.min += Number(c.minutos)||0; x.goles += Number(c.goles)||0; x.asist += Number(c.asistencias)||0;
      if(c.amarilla) x.ta++; if(c.roja) x.tr++; if(c.destacado) x.dest++;
    });
  });
  return st;
}
function competenciasDe(partidos){
  return [...new Set(Object.values(partidos||{}).map(p=>p.competencia).filter(Boolean))].sort();
}
const badge = x => x ? `<span class="res res-${x}">${x}</span>` : '';

// ---------- Inicio ----------
let _refsInicio = [];
function renderInicio(){
  const sec = document.getElementById('vistaInicio');
  sec.classList.remove('oculto');
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const d = {plantel:{}, lesiones:{}, contratos:{}, partidos:{}, convocatorias:{}};
  const rerender = ()=>{ sec.innerHTML = inicioHTML(d); };
  suscribirRefs(_refsInicio, Object.keys(d).map(k=>[k, v=>{ d[k]=v; rerender(); }]));
}

function inicioHTML(d){
  const cat = categoriaActual;
  const hoy = hoyISO(), en6Meses = hoyISO(6);
  const mes = hoy.slice(5,7), dia = hoy.slice(8,10);
  const jugadorDe = (c, id) => d.plantel[c]?.[id];
  const nombreEn = (c, id, respaldo) => jugadorDe(c,id) ? nombreCompleto(jugadorDe(c,id)) : (respaldo || '(jugador no encontrado)');

  const cumples = [];
  Object.entries(d.plantel).forEach(([c, pl])=> Object.values(pl||{}).forEach(j=>{
    if(!j.archivado && (j.fechaNacimiento||'').slice(5,7) === mes) cumples.push({c, j});
  }));
  cumples.sort((a,b)=> a.j.fechaNacimiento.slice(8,10).localeCompare(b.j.fechaNacimiento.slice(8,10)));
  const cumplesHoy = cumples.filter(x=> x.j.fechaNacimiento.slice(8,10) === dia);

  const lesionados = [];
  Object.entries(d.lesiones).forEach(([c, ls])=> Object.values(ls||{}).forEach(l=>{ if(lesionActiva(l)) lesionados.push({c, l}); }));
  lesionados.sort((a,b)=> (a.l.fechaEstimadaRecuperacion||'9').localeCompare(b.l.fechaEstimadaRecuperacion||'9'));

  const contratos = [];
  Object.entries(d.contratos).forEach(([c, cs])=> Object.values(cs||{}).forEach(k=>{
    if(k.fechaFin && k.fechaFin >= hoy && k.fechaFin <= en6Meses) contratos.push({c, k});
  }));
  contratos.sort((a,b)=> a.k.fechaFin.localeCompare(b.k.fechaFin));

  const partidosCat = d.partidos[cat] || {};
  const r = resumenEquipo(Object.values(partidosCat));
  const ultimos = Object.entries(partidosCat).filter(([,p])=>desenlace(p)).sort((a,b)=>(+b[0])-(+a[0])).slice(0,5);
  const st = Object.entries(statsJugadores(d.convocatorias[cat], partidosCat));
  const top = campo => st.filter(([,x])=>x[campo]>0).sort((a,b)=>b[1][campo]-a[1][campo]).slice(0,5);
  const listaTop = (campo, vacio) => {
    const t = top(campo);
    return t.length ? `<table><tbody>${t.map(([jid,x])=>`<tr><td>${esc(nombreEn(cat, jid, x.jugador))}</td><td style="text-align:right;"><b>${x[campo]}</b></td></tr>`).join('')}</tbody></table>`
      : `<p class="nota">${vacio}</p>`;
  };

  return `
  <div class="card">
    <h2>Resumen — ${esc(nombreCategoria(cat))}</h2>
    ${kpisHTML(r)}
    <div class="subtitulo">Últimos partidos</div>
    ${ultimos.length ? `<table><tbody>${ultimos.map(([f,p])=>`<tr>
      <td>Fecha ${f}</td><td>${esc(fechaCorta(p.fechaPartido))}</td><td>${esc(p.rival)}</td><td>${esc(p.localia)}</td>
      <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''}</td><td>${badge(desenlace(p))}</td></tr>`).join('')}</tbody></table>`
      : '<p class="nota">Sin partidos jugados cargados.</p>'}
  </div>
  <div class="grid2">
    <div class="card"><h2>Goleadores</h2>${listaTop('goles', 'Sin goles cargados en las convocatorias.')}</div>
    <div class="card"><h2>Asistencias</h2>${listaTop('asist', 'Sin asistencias cargadas en las convocatorias.')}</div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>Lesionados (todo el club)</h2>
      ${lesionados.length ? `<table><thead><tr><th>Jugador</th><th>Categoría</th><th>Lesión</th><th>Desde</th><th>F. estimada</th></tr></thead><tbody>
      ${lesionados.map(({c,l})=>`<tr><td>${esc(nombreEn(c, l.jugadorId))}</td><td>${esc(nombreCategoria(c))}</td><td>${esc(l.diagnostico || l.observaciones)}</td>
        <td>${esc(fechaCorta(l.fechaInicio))}</td><td>${esc(fechaCorta(l.fechaEstimadaRecuperacion))}</td></tr>`).join('')}</tbody></table>`
      : '<p class="nota">No hay jugadores lesionados.</p>'}
    </div>
    <div class="card">
      <h2>Contratos que vencen en 6 meses</h2>
      ${contratos.length ? `<table><thead><tr><th>Jugador</th><th>Categoría</th><th>Vence</th></tr></thead><tbody>
      ${contratos.map(({c,k})=>`<tr><td>${esc(nombreEn(c, k.jugadorId))}</td><td>${esc(nombreCategoria(c))}</td><td>${esc(fechaCorta(k.fechaFin, true))}</td></tr>`).join('')}</tbody></table>`
      : '<p class="nota">Ningún contrato vence en los próximos 6 meses.</p>'}
    </div>
  </div>
  <div class="card">
    <h2>Cumpleaños del mes (todo el club)</h2>
    ${cumplesHoy.length ? `<div class="aviso">Hoy cumple${cumplesHoy.length>1?'n':''}: ${cumplesHoy.map(({c,j})=>`<b>${esc(nombreCompleto(j))}</b> (${esc(nombreCategoria(c))}, ${edadDe(j.fechaNacimiento)} años)`).join(', ')}</div>` : ''}
    ${cumples.length ? `<table><thead><tr><th>Jugador</th><th>Categoría</th><th>Día</th><th>Cumple</th></tr></thead><tbody>
    ${cumples.map(({c,j})=>{
      const diaN = j.fechaNacimiento.slice(8,10);
      const cumpleAnios = Number(hoy.slice(0,4)) - Number(j.fechaNacimiento.slice(0,4));
      return `<tr${diaN===dia?' style="font-weight:700;"':''}><td>${esc(nombreCompleto(j))}</td><td>${esc(nombreCategoria(c))}</td><td>${diaN}/${mes}</td><td>${cumpleAnios} años</td></tr>`;
    }).join('')}</tbody></table>` : '<p class="nota">Nadie cumple años este mes (o falta cargar la fecha de nacimiento).</p>'}
  </div>`;
}

function cambiarFiltroCompetencia(v){ filtroCompetencia[categoriaActual] = v; renderVistaActual(); }

function estadisticasHTML(cat, partidos, convocatorias, plantel){
  const comps = competenciasDe(partidos);
  const comp = comps.includes(filtroCompetencia[cat]) ? filtroCompetencia[cat] : '';
  const lista = Object.values(partidos).filter(p=> !comp || (p.competencia||'') === comp);
  const total = resumenEquipo(lista);
  const filaRes = (t,r)=>`<tr><td>${t}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td>${r.pct}%</td></tr>`;
  const sistemas = {};
  lista.forEach(p=>{ if(p.sistemaTactico) sistemas[p.sistemaTactico] = (sistemas[p.sistemaTactico]||0) + 1; });
  const filas = Object.entries(statsJugadores(convocatorias, partidos, comp))
    .sort((a,b)=> b[1].tit-a[1].tit || b[1].min-a[1].min)
    .map(([jid,x])=>`<tr>
      <td>${esc(plantel[jid] ? nombreCompleto(plantel[jid]) : (x.jugador || '(fuera del plantel)'))}</td>
      <td>${x.conv}</td><td>${x.tit}</td><td>${x.min}</td><td>${x.goles}</td><td>${x.asist}</td><td>${x.ta}</td><td>${x.tr}</td><td>${x.dest}</td>
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Estadísticas — ${esc(nombreCategoria(cat))}</h2>
    <div class="fila-form"><label style="flex:none;">Competencia</label>
      <select onchange="cambiarFiltroCompetencia(this.value)"><option value="">Todas</option>${comps.map(c=>`<option value="${esc(c)}" ${c===comp?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${kpisHTML(total)}
    <table>
      <thead><tr><th></th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Dif.</th><th>% puntos</th></tr></thead>
      <tbody>
        ${filaRes('Local', resumenEquipo(lista.filter(p=>p.localia==='Local')))}
        ${filaRes('Visitante', resumenEquipo(lista.filter(p=>p.localia==='Visitante')))}
        ${filaRes('Total', total)}
      </tbody>
    </table>
    ${Object.keys(sistemas).length ? `<div class="subtitulo" style="margin-top:16px;">Sistemas utilizados</div>
    <table><tbody>${Object.entries(sistemas).sort((a,b)=>b[1]-a[1]).map(([x,n])=>`<tr><td>${esc(x)}</td><td>${n} partido${n>1?'s':''}</td></tr>`).join('')}</tbody></table>` : ''}
  </div>
  <div class="card">
    <h2>Estadísticas por jugador</h2>
    <p class="nota">Sale de las convocatorias cargadas en cada partido.</p>
    <table>
      <thead><tr><th>Jugador</th><th>Convocatorias</th><th>Titular</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th><th>Destacado</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="9">Todavía no hay convocatorias cargadas.</td></tr>'}</tbody>
    </table>
  </div>`;
}

// ---------- Fixture general (todas las categorías de un grupo, fecha por fecha) ----------
// "Jornada" = puntos que sumó el club contra los que sumó el rival entre todas
// las categorías que jugaron esa fecha (así se lee el fixture de juveniles AFA).
let _refsFixture = [];
function gruposFixture(){
  const cats = CLUB.temporada.categorias;
  return [
    {id:'juveniles', nombre:'Juveniles', cats: cats.filter(c=>!c.esReserva)},
    {id:'reserva', nombre:'Reserva', cats: cats.filter(c=>c.esReserva)},
  ].filter(g=>g.cats.length);
}
function renderFixture(){
  const sec = document.getElementById('vistaFixture');
  sec.classList.remove('oculto');
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver esto.</p>'; return; }
  suscribirRefs(_refsFixture, [['partidos', v=>{ sec.innerHTML = fixtureHTML(v); }]]);
}
function cambiarFixture(grupo, competencia){ fixtureGrupo = grupo; fixtureCompetencia = competencia; renderVistaActual(); }

function fixtureHTML(todos){
  const grupos = gruposFixture();
  const grupo = grupos.find(g=>g.id===fixtureGrupo) || grupos[0];
  if(!grupo) return '<div class="card"><p>No hay categorías configuradas.</p></div>';
  const cats = grupo.cats;
  const comps = [...new Set(cats.flatMap(c=>competenciasDe(todos[c.id])))].sort();
  const comp = comps.includes(fixtureCompetencia) ? fixtureCompetencia : '';
  const porCat = Object.fromEntries(cats.map(c=>[c.id,
    Object.fromEntries(Object.entries(todos[c.id]||{}).filter(([,p])=> !comp || (p.competencia||'') === comp))]));
  const fechas = [...new Set(cats.flatMap(c=>Object.keys(porCat[c.id])))].sort((a,b)=>a-b);
  const tot = Object.fromEntries(cats.map(c=>[c.id, {gf:0, gc:0}]));
  const jugados = [];
  let ptsClubTot = 0, ptsRivalTot = 0;
  const filas = fechas.map(f=>{
    let rival = '', dia = '', ptsClub = 0, ptsRival = 0, hubo = false;
    const celdas = cats.map(c=>{
      const p = porCat[c.id][f];
      if(!p) return '<td></td><td></td><td></td>';
      rival = rival || p.rival || ''; dia = dia || p.fechaPartido || '';
      const x = desenlace(p);
      const loc = {Local:'L', Visitante:'V'}[p.localia] || '';
      if(!x) return `<td></td><td></td><td>${loc}</td>`;
      hubo = true; jugados.push(p);
      tot[c.id].gf += Number(p.golesFavor)||0; tot[c.id].gc += Number(p.golesContra)||0;
      ptsClub += {G:3, E:1, P:0}[x]; ptsRival += {G:0, E:1, P:3}[x];
      return `<td class="celda-${x}">${p.golesFavor ?? ''}</td><td class="celda-${x}">${p.golesContra ?? ''}</td><td>${loc}</td>`;
    }).join('');
    ptsClubTot += ptsClub; ptsRivalTot += ptsRival;
    return `<tr><td>${f}</td><td>${esc(fechaCorta(dia))}</td><td>${esc(rival)}</td>${celdas}<td>${hubo ? `<b>${ptsClub}</b> - ${ptsRival}` : ''}</td></tr>`;
  }).join('');
  const r = resumenEquipo(jugados);
  return `
  <div class="card">
    <h2>Fixture general — ${esc(grupo.nombre)}</h2>
    <div class="fila-form">
      ${grupos.length > 1 ? `<select onchange="cambiarFixture(this.value, '')">${grupos.map(g=>`<option value="${g.id}" ${g.id===grupo.id?'selected':''}>${esc(g.nombre)}</option>`).join('')}</select>` : ''}
      <select onchange="cambiarFixture('${grupo.id}', this.value)"><option value="">Todas las competencias</option>${comps.map(c=>`<option value="${esc(c)}" ${c===comp?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${kpisHTML(r)}
    <table>
      <thead>
        <tr><th rowspan="2">Fecha</th><th rowspan="2">Día</th><th rowspan="2">Rival</th>${cats.map(c=>`<th colspan="3" style="text-align:center;">${esc(c.nombre)}</th>`).join('')}<th rowspan="2">Jornada</th></tr>
        <tr>${cats.map(()=>'<th>GF</th><th>GC</th><th>L/V</th>').join('')}</tr>
      </thead>
      <tbody>${filas || `<tr><td colspan="${4 + cats.length*3}">Sin partidos cargados.</td></tr>`}</tbody>
      ${filas ? `<tfoot><tr><th colspan="3">Totales</th>${cats.map(c=>`<th>${tot[c.id].gf}</th><th>${tot[c.id].gc}</th><th></th>`).join('')}<th>${ptsClubTot} - ${ptsRivalTot}</th></tr></tfoot>` : ''}
    </table>
  </div>`;
}

let _refsReportes = [];
function renderReportes(){

function cambiarFiltroReporte(campo, valor){ filtrosReportes[campo] = valor; renderVistaActual(); }

function reportesHTML(d){
  const f = filtrosReportes;
  const hoy = hoyISO();
  const jugadorDe = (c, id) => d.plantel[c]?.[id] || {};
  const inp = (campo, titulo) => `<input type="date" title="${titulo}" value="${esc(f[campo])}" onchange="cambiarFiltroReporte('${campo}', this.value)">`;

  const liberados = [];
  Object.entries(d.plantel).forEach(([c, pl])=> Object.values(pl||{}).forEach(j=>{
    const fl = j.fechaLiberado || '';
    if(!j.archivado) return;
    if(f.libDesde && fl < f.libDesde) return;
    if(f.libHasta && (!fl || fl > f.libHasta)) return;
    if(f.libPos && j.posicion !== f.libPos) return;
    liberados.push({c, j});
  }));
  liberados.sort((a,b)=> (b.j.fechaLiberado||'').localeCompare(a.j.fechaLiberado||''));

  const contratos = [];
  Object.entries(d.contratos).forEach(([c, cs])=> Object.values(cs||{}).forEach(k=>{
    if(f.conDesde && (k.fechaFin||'') < f.conDesde) return;
    if(f.conHasta && (k.fechaFin||'') > f.conHasta) return;
    contratos.push({c, k, j: jugadorDe(c, k.jugadorId)});
  }));
  contratos.sort((a,b)=> (a.k.fechaFin||'').localeCompare(b.k.fechaFin||''));

  const prestamos = [];
  Object.entries(d.prestamos).forEach(([c, ps])=> Object.values(ps||{}).forEach(p=>{
    if(!p.fechaFin || p.fechaFin >= hoy) prestamos.push({c, p, j: jugadorDe(c, p.jugadorId)});
  }));

  return `
  <div class="card">
    <h2>Jugadores liberados / archivados</h2>
    <div class="fila-form">
      ${inp('libDesde', 'Liberado desde')} ${inp('libHasta', 'Liberado hasta')}
      <select onchange="cambiarFiltroReporte('libPos', this.value)"><option value="">Todas las posiciones</option>${CLUB.posiciones.map(p=>`<option value="${esc(p.codigo)}" ${f.libPos===p.codigo?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
    </div>
    <table>
      <thead><tr><th>Jugador</th><th>Categoría</th><th>Posición</th><th>Edad</th><th>Nacionalidad</th><th>Fecha liberado</th></tr></thead>
      <tbody>${liberados.map(({c,j})=>`<tr><td>${esc(nombreCompleto(j))}</td><td>${esc(nombreCategoria(c))}</td><td>${esc(nombrePosicion(j.posicion))}</td>
        <td>${edadDe(j.fechaNacimiento)}</td><td>${esc(j.nacionalidad)}</td><td>${esc(fechaCorta(j.fechaLiberado, true))}</td></tr>`).join('')
        || '<tr><td colspan="6">Sin jugadores liberados con esos filtros.</td></tr>'}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>Jugadores con contrato</h2>
    <div class="fila-form">${inp('conDesde', 'Fin de contrato desde')} ${inp('conHasta', 'Fin de contrato hasta')}</div>
    <table>
      <thead><tr><th>Jugador</th><th>Categoría</th><th>Posición</th><th>Edad</th><th>Inicio</th><th>Fin</th></tr></thead>
      <tbody>${contratos.map(({c,k,j})=>`<tr${k.fechaFin && k.fechaFin < hoy ? ' style="opacity:.55;"' : ''}><td>${esc(nombreCompleto(j))}</td><td>${esc(nombreCategoria(c))}</td>
        <td>${esc(nombrePosicion(j.posicion))}</td><td>${edadDe(j.fechaNacimiento)}</td><td>${esc(fechaCorta(k.fechaInicio, true))}</td><td>${esc(fechaCorta(k.fechaFin, true))}</td></tr>`).join('')
        || '<tr><td colspan="6">Sin contratos con esos filtros.</td></tr>'}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>Préstamos y convocatorias vigentes</h2>
    <table>
      <thead><tr><th>Jugador</th><th>Categoría</th><th>Tipo</th><th>Club / selección</th><th>Desde</th><th>Hasta</th></tr></thead>
      <tbody>${prestamos.map(({c,p,j})=>`<tr><td>${esc(nombreCompleto(j))}</td><td>${esc(nombreCategoria(c))}</td><td>${esc(p.tipo)}</td>
        <td>${esc(p.clubOSeleccion)}</td><td>${esc(fechaCorta(p.fechaInicio, true))}</td><td>${esc(fechaCorta(p.fechaFin, true))}</td></tr>`).join('')
        || '<tr><td colspan="6">No hay préstamos ni convocatorias vigentes.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function plantelHTML(datosCompletos){
  const cat = categoriaActual;
  const verArchivados = !!mostrarArchivados[cat];
  const f = filtrosPlantel[cat] || {};
  const ordenPos = codigo => { const i = CLUB.posiciones.findIndex(p=>p.codigo===codigo); return i < 0 ? 999 : i; };
  const datos = Object.entries(datosCompletos).filter(([,j])=>
      (verArchivados || !j.archivado)
      && (!f.nombre || sinAcentos(nombreCompleto(j)).includes(sinAcentos(f.nombre)))
      && (!f.pos || j.posicion === f.pos)
      && (!f.edadMax || (j.fechaNacimiento && edadDe(j.fechaNacimiento) <= Number(f.edadMax)))
      && (!f.valoracion || j.valoracion === f.valoracion))
    .sort((a,b)=> ordenPos(a[1].posicion) - ordenPos(b[1].posicion) || nombreCompleto(a[1]).localeCompare(nombreCompleto(b[1])));
  const editar = puedeEditar();
  const columnas = editar ? 9 : 8;
  const opcionesPos = CLUB.posiciones.map(p=>`<option value="${esc(p.codigo)}">${esc(p.nombre)}</option>`).join('');
  const idAbierto = fichaAbierta[cat];
  const filas = datos.map(([id,j])=>{
    const abierta = id === idAbierto;
    const filaExtra = abierta ? `<tr><td colspan="${columnas}">${fichaExtraHTML(id, j)}</td></tr>` : '';
    return `
    <tr${j.archivado?' style="opacity:.55;"':''}>
      ${editar?`<td><input type="checkbox" class="chkPase" value="${id}"></td>`:''}
      <td>${esc(nombreCompleto(j))}${j.archivado?' <span class="tag-rol" style="background:var(--borde);">archivado</span>':''}</td>
      <td>${esc(nombrePosicion(j.posicion))}</td>
      <td>${esc(fechaCorta(j.fechaNacimiento, true))}</td>
      <td>${edadDe(j.fechaNacimiento)}</td>
      <td>${esc(j.pieHabil)}</td>
      <td>${esc(j.altura)}</td>
      <td>${esc(j.peso)}</td>

// Pase de categoría (ej. cambio de temporada): se mueve el jugador con el
// mismo id y todos sus registros, en una sola escritura multi-ruta. Las
// convocatorias quedan donde se jugó cada partido, con el nombre guardado
// para que se sigan leyendo desde la categoría vieja.
async function pasarJugadores(){
  const origen = categoriaActual;
  const destino = document.getElementById('paseDestino').value;
  const ids = [...document.querySelectorAll('.chkPase:checked')].map(e=>e.value);
  if(!ids.length){ alert('Marcá al menos un jugador.'); return; }
  if(!puedeEditar(destino)){ alert('Tu rol no puede editar la categoría destino.'); return; }
  if(!confirm(`¿Pasar ${ids.length} jugador(es) de ${nombreCategoria(origen)} a ${nombreCategoria(destino)}? Se mueven también sus datos médicos, contratos, préstamos, multimedia e informes.`)) return;
  const leer = n => db.ref(n+'/'+origen).once('value').then(s=>s.val()||{});
  const plantel = await leer('plantel');
  const up = {};
  ids.forEach(id=>{ up[`plantel/${destino}/${id}`] = plantel[id]; up[`plantel/${origen}/${id}`] = null; });
  for(const nodo of NODOS_POR_JUGADOR){
    Object.entries(await leer(nodo)).forEach(([rid, r])=>{
      if(!ids.includes(r.jugadorId)) return;
      up[`${nodo}/${destino}/${rid}`] = r;
      up[`${nodo}/${origen}/${rid}`] = null;
    });
  }
  Object.entries(await leer('convocatorias')).forEach(([fecha, conv])=> ids.forEach(id=>{
    if(conv?.[id] && !conv[id].jugador) up[`convocatorias/${origen}/${fecha}/${id}/jugador`] = nombreCompleto(plantel[id]);
  }));
  db.ref().update(up);
}

// Recorre las convocatorias de TODAS las categorías: un jugador que pasó de
// categoría conserva su historial completo (el id no cambia con el pase).
function cargarHistorialJugador(id){
  Promise.all([db.ref('convocatorias').once('value'), db.ref('partidos').once('value')]).then(([sc, sp])=>{
    const el = document.getElementById('historial_'+id);
    if(el) el.innerHTML = historialJugadorHTML(id, sc.val()||{}, sp.val()||{});
  });
}

function historialJugadorHTML(id, convs, partidos){
  const filas = [], resumen = {};
  Object.entries(convs).forEach(([cat, porFecha])=> Object.entries(porFecha||{}).forEach(([fecha, conv])=>{
    const c = conv?.[id];
    if(!c) return;
    const p = partidos[cat]?.[fecha] || {};
    filas.push({cat, fecha, p, c});
    const k = nombreCategoria(cat) + ' — ' + (p.competencia || 'Sin competencia');
    const x = resumen[k] || (resumen[k] = {conv:0, tit:0, min:0, goles:0, asist:0, ta:0, tr:0});
    x.conv++; if(c.titular) x.tit++;
    x.min += Number(c.minutos)||0; x.goles += Number(c.goles)||0; x.asist += Number(c.asistencias)||0;
    if(c.amarilla) x.ta++; if(c.roja) x.tr++;
  }));
  if(!filas.length) return 'Todavía no figura en ninguna convocatoria.';
  filas.sort((a,b)=> a.cat.localeCompare(b.cat) || (+a.fecha) - (+b.fecha));
  return `
    <table>
      <thead><tr><th>Categoría / competencia</th><th>Conv.</th><th>Titular</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th></tr></thead>
      <tbody>${Object.entries(resumen).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.conv}</td><td>${x.tit}</td><td>${x.min}</td><td>${x.goles}</td><td>${x.asist}</td><td>${x.ta}</td><td>${x.tr}</td></tr>`).join('')}</tbody>
    </table>
    <table>
      <thead><tr><th>Categoría</th><th>Fecha</th><th>Rival</th><th>Resultado</th><th>Titular</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th></tr></thead>
      <tbody>${filas.map(({cat, fecha, p, c})=>`<tr>
        <td>${esc(nombreCategoria(cat))}</td><td>${fecha}${p.fechaPartido ? ' ('+esc(fechaCorta(p.fechaPartido))+')' : ''}</td><td>${esc(p.rival)}</td>
        <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''} ${badge(desenlace(p))}</td><td>${c.titular?'Sí':''}</td><td>${c.minutos ?? ''}</td>
        <td>${c.goles||''}</td><td>${c.asistencias||''}</td><td>${c.amarilla?'Sí':''}</td><td>${c.roja?'Sí':''}</td></tr>`).join('')}</tbody>
    </table>`;
}

// ---------- Datos médicos (consultas y lesiones) ----------
// Registros viejos sin tipoConsulta se toman como 'Médica' (eran solo lesiones).
const esLesion = l => (l.tipoConsulta || 'Médica') === 'Médica';
const lesionActiva = l => esLesion(l) && !l.fechaRecuperacion;
function diasEntre(desde, hasta){
  if(!desde) return null;
  const d1 = new Date(desde+'T00:00:00'), d2 = hasta ? new Date(hasta+'T00:00:00') : new Date();
  return Math.round((d2-d1)/86400000);
}
function opcionesSelect(lista, valor){
  return ['', ...lista].map(o=>`<option value="${esc(o)}" ${o===(valor||'')?'selected':''}>${esc(o)||'—'}</option>`).join('');

// ---------- Partidos / Resultados ----------
let _refsPartidos = [];
function renderPartidos(){
  const sec = document.getElementById('vistaPartidos');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver y cargar datos.</p>'; return; }
  const cat = categoriaActual;
  let partidosDatos = {}, plantelDatos = {}, convocatoriaDatos = {};
  const rerender = ()=>{ sec.innerHTML = partidosHTML(cat, partidosDatos, plantelDatos, convocatoriaDatos); };
  const pares = [
    ['partidos/'+cat, v=>{ partidosDatos=v; rerender(); }],
    ['plantel/'+cat, v=>{ plantelDatos=v; rerender(); }],
  ];
  const fechaConv = convocatoriaAbiertaFecha[cat];
  if(fechaConv) pares.push(['convocatorias/'+cat+'/'+fechaConv, v=>{ convocatoriaDatos=v; rerender(); }]);
  suscribirRefs(_refsPartidos, pares);
}

function partidosHTML(cat, datos, plantel, convocatoria){
  const filas = Object.entries(datos)
    .sort((a,b)=> (+a[0]) - (+b[0]))
    .map(([fecha,p])=>{
      const detalleAbierta = detalleAbiertoFecha[cat] === fecha;
      const convocatoriaAbierta = convocatoriaAbiertaFecha[cat] === fecha;
      let extra = '';
      if(detalleAbierta) extra += `<tr><td colspan="8">${partidoDetalleHTML(fecha,p)}</td></tr>`;
      if(convocatoriaAbierta) extra += `<tr><td colspan="8">${convocatoriaHTML(cat, fecha, plantel, convocatoria)}</td></tr>`;
      return `
      <tr>
        <td>${fecha}</td>
        <td>${esc(fechaCorta(p.fechaPartido))}</td>
        <td>${esc(p.rival)}</td>
        <td>${esc(p.localia)}</td>
        <td>${p.golesFavor ?? ''} - ${p.golesContra ?? ''}</td>
        <td>${esc(p.resultado)}</td>
        <td>${esc(p.competencia)}</td>
        <td>
          <button class="secundario" onclick="toggleDetallePartido('${fecha}')">${detalleAbierta?'Cerrar':'Detalle'}</button>
          <button class="secundario" onclick="toggleConvocatoria('${fecha}')">${convocatoriaAbierta?'Cerrar':'Convocatoria'}</button>
          ${puedeEditar()?`<button class="peligro" onclick="borrarPartido('${fecha}')">Borrar</button>`:''}
        </td>
      </tr>${extra}`;
    }).join('');
  return `
  <div class="card">
    <h2>Partidos</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="mFecha" type="number" placeholder="Fecha Nro">
      <input id="mFechaPartido" type="date" title="Día del partido (opcional)">
      <input id="mRival" placeholder="Rival">
      <select id="mLocalia"><option value="Local">Local</option><option value="Visitante">Visitante</option></select>
      <input id="mGF" type="number" placeholder="Goles a favor">
      <input id="mGC" type="number" placeholder="Goles en contra">
      <select id="mResultado"><option>Victoria</option><option>Empate</option><option>Derrota</option><option>No Disputado</option></select>
      <button class="accion" onclick="agregarPartido()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Fecha</th><th>Día</th><th>Rival</th><th>Condición</th><th>Goles</th><th>Resultado</th><th>Competencia</th><th></th></tr></thead>
      <tbody>${filas || '<tr><td colspan="8">Sin partidos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarPartido(){
  const fecha = document.getElementById('mFecha').value;
  if(!fecha) return;
  const p = {
    rival: document.getElementById('mRival').value.trim(),
    localia: document.getElementById('mLocalia').value,
    golesFavor: Number(document.getElementById('mGF').value || 0),

  };

  if(fechaPartido) p.fechaPartido = fechaPartido;
  db.ref('partidos/'+categoriaActual+'/'+fecha).update(p);

function guardarDetallePartido(fecha){
  const v = id => document.getElementById(id).value.trim();
  const links = {};
  (CLUB.linksPartido || []).forEach(k=>{
    const val = v('pd_link_'+k+'_'+fecha);
    if(val) links[k] = val;
  });
  const penF = document.getElementById('pd_penF_'+fecha).value;
  const penC = document.getElementById('pd_penC_'+fecha).value;
  db.ref('partidos/'+categoriaActual+'/'+fecha).update({
    fechaPartido: v('pd_fechaPartido_'+fecha),
    competencia: v('pd_competencia_'+fecha),
    arbitro: v('pd_arbitro_'+fecha),
    sistemaTactico: v('pd_sistema_'+fecha),
    penalesFavor: penF === '' ? null : Number(penF),
    penalesContra: penC === '' ? null : Number(penC),
    planConTenencia: v('pd_planCon_'+fecha),
    planSinTenencia: v('pd_planSin_'+fecha),
    descripcion: v('pd_desc_'+fecha),
    links,
  });
}

function exportarCitacionPDF(cat, fecha){
  Promise.all([
    db.ref('plantel/'+cat).once('value'),
    db.ref('convocatorias/'+cat+'/'+fecha).once('value'),
    db.ref('partidos/'+cat+'/'+fecha).once('value'),
  ]).then(([spPlantel, spConv, spPartido])=>{
    const plantel = spPlantel.val() || {};
    const conv = spConv.val() || {};
    const partido = spPartido.val() || {};
    const titulares = [], suplentes = [];
    Object.entries(conv).forEach(([id,c])=>{
      const nombreJ = plantel[id] ? nombreCompleto(plantel[id]) : (c.jugador || '');
      const linea = `${c.dorsal ?? ''} — ${esc(nombreJ)}`;
      (c.titular ? titulares : suplentes).push(linea);
    });
    const firmas = lista => lista.map(l=>`<div class="firma-fila"><span>${l}</span><span>Firma</span></div>`).join('')
      || '<p style="color:#777;">(sin cargar)</p>';
    const html = `
    <h1>${esc(CLUB.club.nombre)} — Citación</h1>
    <p>Fecha <strong>${fecha}</strong> — Rival: <strong>${esc(partido.rival)}</strong> (${esc(partido.localia)})</p>
    <h3>Titulares</h3>${firmas(titulares)}
    <h3>Suplentes</h3>${firmas(suplentes)}`;
    abrirVentanaPDF('Citación F'+fecha, html);
  });
}

function guardarConvocatoria(cat, fecha){
  // Lee los ids directo del DOM ya renderizado (no vuelve a pedir el plantel):
  // un jugador agregado al plantel recién no rompe el guardado.
  const numeroOVacio = v => v === '' ? null : Number(v);
  const out = {};
  document.querySelectorAll('[id^="cv_convocado_"]').forEach(elConv=>{
    const id = elConv.id.slice('cv_convocado_'.length);
    const titular = document.getElementById('cv_titular_'+id).checked;
    if(!elConv.checked && !titular) return;
    out[id] = {
      jugador: elConv.dataset.nombre,
      titular,
      dorsal: numeroOVacio(document.getElementById('cv_dorsal_'+id).value),
      minutos: numeroOVacio(document.getElementById('cv_minutos_'+id).value),
      goles: Number(document.getElementById('cv_goles_'+id).value || 0),
      asistencias: Number(document.getElementById('cv_asistencias_'+id).value || 0),
      amarilla: document.getElementById('cv_amarilla_'+id).checked,
      roja: document.getElementById('cv_roja_'+id).checked,
      rojaFechaExpulsion: document.getElementById('cv_rojaFecha_'+id).value || null,
      rojaLink: document.getElementById('cv_rojaLink_'+id).value.trim() || null,
      rojaPdf: document.getElementById('cv_rojaPdf_'+id).value.trim() || null,
      rojaObservaciones: document.getElementById('cv_rojaObs_'+id).value.trim() || null,
      sustituidoPor: document.getElementById('cv_sustituidoPor_'+id).value || null,
      motivoCambio: document.getElementById('cv_motivo_'+id).value || null,
      destacado: document.getElementById('cv_destacado_'+id).checked,
    };
  });
  db.ref('convocatorias/'+cat+'/'+fecha).set(out);
}

let TABLA_LIGA = null;
async function cargarTablaLiga(forzar){
  if(TABLA_LIGA && !forzar) return TABLA_LIGA;
  try{
    const r = await fetch('data/tablas.json' + (forzar ? '?t='+Date.now() : ''), {cache:'no-store'});
    TABLA_LIGA = r.ok ? await r.json() : {categorias:{}, fixture:{}};
  }catch(e){
    TABLA_LIGA = {categorias:{}, fixture:{}};
  }
  return TABLA_LIGA;
}

async function actualizarTablaLiga(){
  await cargarTablaLiga(true);
  renderVistaActual();
}

// ---------- Confiabilidad (carga manual vs. fuente automática de liga) ----------
let _refsConfiabilidad = [];
async function renderConfiabilidad(){
  const sec = document.getElementById('vistaConfiabilidad');
  sec.classList.remove('oculto');
  if(!categoriaActual){ sec.innerHTML = '<p>No hay categorías configuradas.</p>'; return; }
  if(!db){ sec.innerHTML = '<p>Configurá Firebase (config/firebase.js) para ver esto.</p>'; return; }
  const cat = categoriaActual;
  const liga = await cargarTablaLiga();
  const fixtureLiga = (liga.fixture && liga.fixture[cat]) || [];
  const tablaLiga = (liga.categorias && liga.categorias[cat]) || [];
  let partidosManual = {}, omitidos = {};
  const render = ()=>{ sec.innerHTML = confiabilidadHTML(cat, partidosManual, fixtureLiga, tablaLiga, omitidos); };
  suscribirRefs(_refsConfiabilidad, [
    ['partidos/'+cat, v=>{ partidosManual=v; render(); }],
    ['recordatoriosOmitidos/'+cat, v=>{ omitidos=v; render(); }],
  ]);
}

function compararResultado(fecha, manual, liga){
  if(!liga || liga.resultado == null) return null; // la liga todavía no tiene el resultado, nada que comparar
  if(!manual || manual.golesFavor == null){
    return `La liga ya tiene el resultado de la fecha ${fecha} (vs ${esc(liga.rival)}, ${esc(liga.resultado)}) pero no está cargado a mano.`;
  }
  if(manual.golesFavor !== liga.golesFavor || manual.golesContra !== liga.golesContra){
    return `Fecha ${fecha} vs ${esc(liga.rival)}: cargaste ${manual.golesFavor}-${manual.golesContra}, la liga dice ${liga.golesFavor}-${liga.golesContra}.`;
  }
  return null;
}

function calcularTablaPropia(partidosManual){
  let pj=0, pg=0, pe=0, pp=0, gf=0, gc=0;
  Object.values(partidosManual).forEach(p=>{
    if(!p.resultado || p.resultado === 'No Disputado') return;
    pj++;
    gf += p.golesFavor || 0;
    gc += p.golesContra || 0;
    if(p.resultado === 'Victoria') pg++;
    else if(p.resultado === 'Empate') pe++;
    else if(p.resultado === 'Derrota') pp++;
  });
  return {pj, pg, pe, pp, gf, gc, pts: pg*3+pe};
}

function filaLigaDelClub(tablaLiga){
  const nombre = (CLUB.fuentes?.liga?.config?.nombreEquipoEnLiga || CLUB.club.nombre || '').toLowerCase();
  if(!nombre) return null;
  return tablaLiga.find(f=>{
    const equipo = (f.equipo||'').toLowerCase();
    return equipo.includes(nombre) || nombre.includes(equipo);
  }) || null;
}

function recordatoriosLinks(partidosManual, omitidos){
  const tipos = CLUB.linksPartido || [];
  const avisos = [];
  Object.entries(partidosManual).forEach(([fecha,p])=>{
    if(!p.resultado || p.resultado === 'No Disputado') return;
    if(omitidos[fecha]) return;
    const links = p.links || {};
    if(!tipos.some(t=>links[t])) avisos.push({fecha, rival:p.rival});
  });
  return avisos;
}

function omitirRecordatorio(fecha){
  db.ref('recordatoriosOmitidos/'+categoriaActual+'/'+fecha).set(true);
}

function confiabilidadHTML(cat, partidosManual, fixtureLiga, tablaLiga, omitidos){
  const avisosResultados = fixtureLiga
    .map(f=>compararResultado(f.fecha, partidosManual[f.fecha], f))
    .filter(Boolean);

  const propia = calcularTablaPropia(partidosManual);
  const filaLiga = filaLigaDelClub(tablaLiga);
  const difTabla = filaLiga && ['pj','pg','pe','pp','gf','gc'].some(c=>propia[c] !== filaLiga[c]);

  const recordatorios = recordatoriosLinks(partidosManual, omitidos);

  return `
  <div class="card">
    <h2>Confiabilidad</h2>
    <p style="color:#9aa4bd;font-size:.85rem;">
      Cruza lo cargado a mano contra la fuente automática de liga (<code>data/tablas.json</code>).
      Si una sección no muestra nada, es que no encontró ninguna discrepancia.
    </p>

    <div class="subtitulo">Resultados</div>
    ${avisosResultados.length ? `<ul>${avisosResultados.map(m=>`<li>${m}</li>`).join('')}</ul>` : '<p>Sin discrepancias.</p>'}

    <div class="subtitulo">Tabla propia (sumada de los partidos cargados) vs. tabla de la liga</div>
    ${!filaLiga ? '<p style="color:#9aa4bd;">Todavía no se encontró la fila del club en la tabla de la liga (revisá <code>nombreEquipoEnLiga</code> en club.json).</p>'
      : !difTabla ? '<p>Sin discrepancias.</p>' : `
      <table>
        <thead><tr><th></th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th></tr></thead>
        <tbody>
          <tr><td>Carga manual</td><td>${propia.pj}</td><td>${propia.pg}</td><td>${propia.pe}</td><td>${propia.pp}</td><td>${propia.gf}</td><td>${propia.gc}</td></tr>
          <tr><td>Liga (${esc(filaLiga.equipo)})</td><td>${filaLiga.pj}</td><td>${filaLiga.pg}</td><td>${filaLiga.pe}</td><td>${filaLiga.pp}</td><td>${filaLiga.gf}</td><td>${filaLiga.gc}</td></tr>
        </tbody>
      </table>`}

    <div class="subtitulo">Partidos jugados sin ningún link cargado</div>
    ${recordatorios.length ? `<ul>${recordatorios.map(r=>`
      <li>Fecha ${r.fecha} vs ${esc(r.rival)} — sin links.
        ${puedeEditar() ? `<button class="secundario" onclick="omitirRecordatorio('${r.fecha}')">Omitir</button>` : ''}
      </li>`).join('')}</ul>` : '<p>Sin pendientes.</p>'}
  </div>`;
}

    <tr>
      <td>${esc(d.tipo)}</td>
      <td>${esc(d.titulo)}</td>
      <td>${esc(d.microciclo)}</td>
      <td>${esc(d.fechaDesde)}${d.fechaHasta?' a '+d.fechaHasta:''}</td>
      <td>${esc(d.descripcion)}</td>
      <td>${d.url?`<a href="${url(d.url)}" target="_blank">Abrir</a>`:''}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarDocumento('${id}')">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Documentos (Planificación / Proyectos externos / Rendimiento físico)</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <select id="docTipo">${TIPOS_DOCUMENTO.map(t=>`<option>${t}</option>`).join('')}</select>
      <input id="docTitulo" placeholder="Título">
      <input id="docMicrociclo" type="number" placeholder="Microciclo (opcional)">
      <input id="docFechaDesde" type="date" title="Fecha desde">
      <input id="docFechaHasta" type="date" title="Fecha hasta (opcional)">
      <input id="docDescripcion" placeholder="Descripción">
      <input id="docUrl" placeholder="Url">
      <button class="accion" onclick="agregarDocumento()">Agregar</button>
    </div>`:''}
    <table>
      <thead><tr><th>Tipo</th><th>Título</th><th>Microciclo</th><th>Fecha</th><th>Descripción</th><th>Url</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin documentos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarDocumento(){
  const d = {
    tipo: document.getElementById('docTipo').value,
    titulo: document.getElementById('docTitulo').value.trim(),
    microciclo: document.getElementById('docMicrociclo').value || null,
    fechaDesde: document.getElementById('docFechaDesde').value,
    fechaHasta: document.getElementById('docFechaHasta').value || null,
    descripcion: document.getElementById('docDescripcion').value.trim(),
    url: document.getElementById('docUrl').value.trim(),
  };
  if(!d.titulo) return;
  db.ref('documentos/'+categoriaActual).push(d);
}

function borrarDocumento(id){
  if(!confirm('¿Borrar documento?')) return;
  db.ref('documentos/'+categoriaActual+'/'+id).remove();
}

function entrenamientosHTML(entrenamientos){
  const otrasCatsEditables = CLUB.temporada.categorias.filter(c=> c.id!==categoriaActual && puedeEditar(c.id));
  const filas = Object.entries(entrenamientos)
    .sort((a,b)=> (b[1].fecha||'').localeCompare(a[1].fecha||''))
    .map(([id,e])=>`
    <tr>
      <td>${esc(e.fecha)}</td>
      <td>${esc(e.descripcion)}</td>
      <td>${esc(e.etiquetas)}</td>
      <td>${e.linkCampo?`<a href="${url(e.linkCampo)}" target="_blank">Campo</a>`:''}</td>
      <td>${e.linkArqueros?`<a href="${url(e.linkArqueros)}" target="_blank">Arqueros</a>`:''}</td>
      <td>${e.urlPlanificacion?`<a href="${url(e.urlPlanificacion)}" target="_blank">Planificación</a>`:''}</td>
      ${puedeEditar()?`<td><button class="peligro" onclick="borrarEntrenamiento('${id}')">Borrar</button></td>`:''}
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Entrenamientos</h2>
    ${puedeEditar()?`
    <div class="fila-form">
      <input id="entFecha" type="date">
      <input id="entDescripcion" placeholder="Descripción (ej. Semana 18)">
      <input id="entEtiquetas" placeholder="Etiquetas (ej. Impacto, Descarga)">
      <input id="entLinkCampo" placeholder="Link entrenamiento de campo">
      <input id="entLinkArqueros" placeholder="Link entrenamiento de arqueros">
      <input id="entUrlPlanificacion" placeholder="Url planificación">
      <button class="accion" onclick="agregarEntrenamiento()">Agregar</button>
    </div>
    ${otrasCatsEditables.length ? `<div class="fila-form nota"><span style="flex:none;">Cargarlo también en:</span>
      ${otrasCatsEditables.map(c=>`<label style="flex:none;display:inline-flex;gap:4px;align-items:center;"><input type="checkbox" class="chkEntCat" value="${c.id}">${esc(c.nombre)}</label>`).join('')}
    </div>` : ''}`:''}
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Etiquetas</th><th>Campo</th><th>Arqueros</th><th>Planificación</th>${puedeEditar()?'<th></th>':''}</tr></thead>
      <tbody>${filas || '<tr><td colspan="7">Sin entrenamientos cargados.</td></tr>'}</tbody>
    </table>
  </div>`;
}

function agregarEntrenamiento(){
  const e = {
    fecha: document.getElementById('entFecha').value,
    descripcion: document.getElementById('entDescripcion').value.trim(),
    etiquetas: document.getElementById('entEtiquetas').value.trim(),
    linkCampo: document.getElementById('entLinkCampo').value.trim(),
    linkArqueros: document.getElementById('entLinkArqueros').value.trim(),
    urlPlanificacion: document.getElementById('entUrlPlanificacion').value.trim(),
  };
  if(!e.fecha) return;
  const cats = [categoriaActual, ...[...document.querySelectorAll('.chkEntCat:checked')].map(x=>x.value)];
  cats.forEach(c=> db.ref('entrenamientos/'+c).push(e));
}

function borrarEntrenamiento(id){
  if(!confirm('¿Borrar entrenamiento?')) return;
  db.ref('entrenamientos/'+categoriaActual+'/'+id).remove();
}

// ---------- Arranque ----------
(async function init(){
  CLUB = await cargarConfigClub();
  aplicarTema(CLUB);
  poblarSelectorCategoria();
  if((CLUB.fuentes?.liga?.adapter || 'manual') !== 'manual'){
    document.getElementById('navConfiabilidad').classList.remove('oculto');
  }

  if(window.FIREBASE_CONFIG_FALTA || !window.FIREBASE_CONFIG){
    document.getElementById('avisoConfig').textContent =
      'Falta config/firebase.js con las credenciales reales del club (ver config/README.md). Mostrando solo la config de ejemplo.';
    document.getElementById('avisoConfig').classList.remove('oculto');
    actualizarEstadoSesion();
    renderVistaActual();
    return;
  }

  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.database();
  auth = firebase.auth();
  auth.onAuthStateChanged(onAuthCambio);
  renderVistaActual();
})();
</script>
</body>
</html>
